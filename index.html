<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greimas Square — 3D Wireframe</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070d; color: #e9edf7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .lbl {
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 1px 2px rgba(0,0,0,0.9);
  }
  .lbl.main { font-size: 14px; font-weight: 600; }
  .lbl.main b {
    font-weight: 500; font-size: 10px; opacity: 0.55;
    margin-right: 5px; letter-spacing: 0.06em;
  }
  .lbl.mid { font-size: 13px; font-weight: 600; color: #ffd166; }
  .lbl.mid b {
    font-weight: 500; font-size: 9.5px; opacity: 0.55;
    margin-right: 5px; letter-spacing: 0.06em;
  }
  .lbl.corner { font-size: 12px; font-weight: 500; color: #e8b64c; opacity: 0.92; }
  .lbl.corner b {
    font-weight: 400; font-size: 9px; opacity: 0.55;
    margin-right: 4px; letter-spacing: 0.06em;
  }
  .lbl.sub { font-size: 10.5px; opacity: 0.88; letter-spacing: 0.04em; }

  #ui {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 10;
    width: 264px;
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    padding: 12px;
    border-radius: 12px;
    background: rgba(9, 13, 22, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    font-size: 12px;
    line-height: 1.4;
  }
  #ui::-webkit-scrollbar { width: 6px; }
  #ui::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 3px; }
  #ui h1 {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #ui h1 span {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 5px;
    font-size: 9px;
    letter-spacing: 0.12em;
    border-radius: 4px;
    color: #0a0e1c;
    vertical-align: 2px;
    background: linear-gradient(120deg, #4ecdc4, #ffd166);
  }
  .hint {
    margin: 0 0 10px;
    font-size: 10px;
    color: #7e8aa8;
    letter-spacing: 0.02em;
  }

  .sec {
    margin-bottom: 9px;
    padding-bottom: 7px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .sec:last-of-type { border-bottom: none; margin-bottom: 4px; }
  .sec-title {
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7e8aa8;
    margin-bottom: 6px;
  }

  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .row .sym {
    flex: 0 0 36px;
    font-size: 11px;
    font-weight: 600;
    text-align: right;
    letter-spacing: 0.02em;
  }
  .row .sym.dot {
    flex: 0 0 36px;
    display: flex;
    justify-content: flex-end;
  }
  .row .sym.dot i {
    display: block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  .row input {
    flex: 1; min-width: 0;
    padding: 5px 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e9edf7;
    font: inherit;
    font-size: 11.5px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .row input:focus {
    border-color: rgba(126, 160, 255, 0.5);
    background: rgba(126, 160, 255, 0.10);
  }
  .row.sub input { font-size: 10.5px; color: #a8b3cc; }
  .row.sub { margin-bottom: 7px; }

  .buttons { display: flex; gap: 7px; margin: 8px 0 10px; }
  button {
    flex: 1;
    padding: 7px 4px;
    border-radius: 7px;
    cursor: pointer;
    font: inherit;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #e9edf7;
    background: rgba(126, 160, 255, 0.18);
    border: 1px solid rgba(126, 160, 255, 0.4);
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: rgba(126, 160, 255, 0.32); }
  button:active { transform: translateY(1px); }
  button.ghost {
    flex: 0 0 72px;
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.10);
  }
  button.ghost:hover { background: rgba(255, 255, 255, 0.11); }

  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .toggles label {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    border-radius: 7px;
    cursor: pointer;
    user-select: none;
    font-size: 10px;
    letter-spacing: 0.03em;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    transition: background 0.15s, border-color 0.15s;
  }
  .toggles label:hover { background: rgba(255, 255, 255, 0.09); }
  .toggles input { display: none; }
  .toggles label:has(input:checked) {
    background: rgba(126, 160, 255, 0.16);
    border-color: rgba(126, 160, 255, 0.4);
    color: #fff;
  }

  @media (max-width: 560px) {
    #ui { width: 200px; padding: 10px; font-size: 11px; }
    .hint { display: none; }
    #ui h1 { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="ui">
  <h1>Greimas Square<span>3D</span></h1>
  <p class="hint">drag · rotate | scroll · zoom | right-drag · pan</p>

  <div class="sec">
    <div class="sec-title">Inner Square</div>
    <div class="row"><span class="sym" style="color:#ffb86b">S₁</span><input type="text" data-k="s1" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#ff9f43"><i></i></span><input type="text" data-k="s1" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#6fe3da">S₂</span><input type="text" data-k="s2" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#4ecdc4"><i></i></span><input type="text" data-k="s2" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#a3adff">~S₁</span><input type="text" data-k="ns1" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#7b8cff"><i></i></span><input type="text" data-k="ns1" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#ffa0cd">~S₂</span><input type="text" data-k="ns2" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#ff6fae"><i></i></span><input type="text" data-k="ns2" data-f="subs" placeholder="subterms, comma separated"></div>
  </div>

  <div class="sec">
    <div class="sec-title">Outer Midpoints</div>
    <div class="row"><span class="sym" style="color:#ffd166">M₁</span><input type="text" data-k="m1" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#ffd166"><i></i></span><input type="text" data-k="m1" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#ffd166">M₂</span><input type="text" data-k="m2" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#ffd166"><i></i></span><input type="text" data-k="m2" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#ffd166">M₃</span><input type="text" data-k="m3" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#ffd166"><i></i></span><input type="text" data-k="m3" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#ffd166">M₄</span><input type="text" data-k="m4" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#ffd166"><i></i></span><input type="text" data-k="m4" data-f="subs" placeholder="subterms, comma separated"></div>
  </div>

  <div class="sec">
    <div class="sec-title">Outer Corners</div>
    <div class="row"><span class="sym" style="color:#e8b64c">C₁</span><input type="text" data-k="c1" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#e8b64c"><i></i></span><input type="text" data-k="c1" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#e8b64c">C₂</span><input type="text" data-k="c2" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#e8b64c"><i></i></span><input type="text" data-k="c2" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#e8b64c">C₃</span><input type="text" data-k="c3" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#e8b64c"><i></i></span><input type="text" data-k="c3" data-f="subs" placeholder="subterms, comma separated"></div>
    <div class="row"><span class="sym" style="color:#e8b64c">C₄</span><input type="text" data-k="c4" data-f="name"></div>
    <div class="row sub"><span class="sym dot" style="color:#e8b64c"><i></i></span><input type="text" data-k="c4" data-f="subs" placeholder="subterms, comma separated"></div>
  </div>

  <div class="buttons">
    <button id="apply">Update</button>
    <button id="reset" class="ghost">Reset</button>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="t-labels" checked><span>Labels</span></label>
    <label><input type="checkbox" id="t-subs" checked><span>Subterms</span></label>
    <label><input type="checkbox" id="t-rotate"><span>Auto-rotate</span></label>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* =====================================================================
   DATA
   ===================================================================== */
const INNER_KEYS = ['s1', 's2', 'ns1', 'ns2'];
const M_KEYS     = ['m1', 'm2', 'm3', 'm4'];
const C_KEYS     = ['c1', 'c2', 'c3', 'c4'];
const ALL_KEYS   = [...INNER_KEYS, ...M_KEYS, ...C_KEYS];

const SYMBOLS = {
  s1: 'S₁', s2: 'S₂', ns1: '~S₁', ns2: '~S₂',
  m1: 'M₁', m2: 'M₂', m3: 'M₃', m4: 'M₄',
  c1: 'C₁', c2: 'C₂', c3: 'C₃', c4: 'C₄',
};

const COLORS = {
  s1: 0xff9f43, s2: 0x4ecdc4, ns1: 0x7b8cff, ns2: 0xff6fae,
  m1: 0xffd166, m2: 0xffd166, m3: 0xffd166, m4: 0xffd166,
  c1: 0xe8b64c, c2: 0xe8b64c, c3: 0xe8b64c, c4: 0xe8b64c,
};

const TEXT_COLORS = {
  s1: '#ffb86b', s2: '#6fe3da', ns1: '#a3adff', ns2: '#ffa0cd',
  m1: '#ffd166', m2: '#ffd166', m3: '#ffd166', m4: '#ffd166',
  c1: '#e8b64c', c2: '#e8b64c', c3: '#e8b64c', c4: '#e8b64c',
};

const DEFAULTS = {
  s1:  { name: 'Being',       subs: 'Flora, Fauna, Body' },
  s2:  { name: 'Seeming',     subs: 'Silence, Decay, Ghost' },
  ns1: { name: 'Non-being',   subs: 'Mineral, Machine, Crystal' },
  ns2: { name: 'Non-seeming', subs: 'Memory, Relic, Seed' },
  m1:  { name: 'Truth',       subs: 'Verity, Fact, Authenticity' },
  m2:  { name: 'Lie',         subs: 'Fabrication, Deceit, Perjury' },
  m3:  { name: 'Falsehood',   subs: 'Error, Illusion, Mistake' },
  m4:  { name: 'Secret',      subs: 'Concealment, Mystery, Silence' },
  c1:  { name: 'Paradox',     subs: 'Contradiction, Aporia, Antinomy' },
  c2:  { name: 'Deception',   subs: 'Trickery, Illusion, Fraud' },
  c3:  { name: 'Subterfuge',  subs: 'Evasion, Ruse, Stratagem' },
  c4:  { name: 'Revelation',  subs: 'Disclosure, Epiphany, Unveiling' },
};

const state = JSON.parse(JSON.stringify(DEFAULTS));

/* =====================================================================
   POSITIONS
   ===================================================================== */
const H = 2.0;      // inner half-size
const D = 4.5;      // outer half-size

const POS = {
  s1:  new THREE.Vector3(-H,  H, 0),
  s2:  new THREE.Vector3( H,  H, 0),
  ns1: new THREE.Vector3(-H, -H, 0),
  ns2: new THREE.Vector3( H, -H, 0),
  m1:  new THREE.Vector3( 0,  D, 0),
  m2:  new THREE.Vector3( D,  0, 0),
  m3:  new THREE.Vector3( 0, -D, 0),
  m4:  new THREE.Vector3(-D,  0, 0),
  c1:  new THREE.Vector3( D,  D, 0),
  c2:  new THREE.Vector3( D, -D, 0),
  c3:  new THREE.Vector3(-D, -D, 0),
  c4:  new THREE.Vector3(-D,  D, 0),
};

/* =====================================================================
   SCENE
   ===================================================================== */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(1.0, 0.5, 15.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, {
  position: 'absolute',
  top: '0', left: '0',
  pointerEvents: 'none',
  zIndex: '1'
});
app.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.08;
controls.rotateSpeed     = 0.85;
controls.minDistance     = 5;
controls.maxDistance     = 34;
controls.autoRotateSpeed = 0.9;

/* =====================================================================
   GROUPS
   ===================================================================== */
const structureGroup = new THREE.Group();
const fanGroup       = new THREE.Group();
const labelGroup     = new THREE.Group();
scene.add(structureGroup, fanGroup, labelGroup);

/* =====================================================================
   HELPERS
   ===================================================================== */
const glowTex = (() => {
  const s = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1.0)');
  g.addColorStop(0.30, 'rgba(255,255,255,0.7)');
  g.addColorStop(0.65, 'rgba(255,255,255,0.15)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const lineMaterials = [];

function makeLine(p1, p2, opts = {}) {
  const {
    color = 0xffffff, width = 2, opacity = 1,
    dashed = false, dash = 0.2, gap = 0.15
  } = opts;

  const geo = new LineGeometry();
  geo.setPositions([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z]);

  const mat = new LineMaterial({
    color, linewidth: width,
    transparent: opacity < 1, opacity,
    dashed, dashSize: dash, gapSize: gap,
    depthWrite: false
  });
  mat.resolution.set(innerWidth, innerHeight);
  lineMaterials.push(mat);

  const line = new Line2(geo, mat);
  line.computeLineDistances();
  return line;
}

function makeDot(pos, color, scale) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color,
    blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity: 0.95
  }));
  sprite.position.copy(pos);
  sprite.scale.setScalar(scale);
  return sprite;
}

function makeLabel(symbol, name, textColor, cls) {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  el.style.color = textColor;
  const b = document.createElement('b');
  b.textContent = symbol;
  el.append(b, document.createTextNode(name));
  return new CSS2DObject(el);
}

function makeSubLabel(text, textColor) {
  const el = document.createElement('div');
  el.className = 'lbl sub';
  el.style.color = textColor;
  el.textContent = text;
  return new CSS2DObject(el);
}

function clearAll() {
  [structureGroup, fanGroup, labelGroup].forEach(group => {
    group.traverse(obj => {
      if (obj.isLine2) {
        obj.geometry.dispose();
        obj.material.dispose();
      }
      if (obj.isSprite && obj.material) obj.material.dispose();
    });
    group.clear();
  });
  lineMaterials.length = 0;
}

/* =====================================================================
   BUILD
   ===================================================================== */
let mainLabels = [];
let subLabels  = [];

/* Triangle geometry constants */
const TRI_TILT = Math.PI / 4;   // tilt of the triangle plane (45° from the square's plane)

function build() {
  clearAll();
  mainLabels = [];
  subLabels  = [];

  /* ---- 1. Inner square ---- */
  const innerEdges = [
    ['s1',  's2',  { color: 0xd6dff0, width: 2.4, opacity: 0.95 }],
    ['ns1', 'ns2', { color: 0xd6dff0, width: 2.4, opacity: 0.95 }],
    ['s1',  'ns1', { color: 0xb8c4da, width: 2.4, opacity: 0.95 }],
    ['s2',  'ns2', { color: 0xb8c4da, width: 2.4, opacity: 0.95 }],
    ['s1',  'ns2', { color: 0x8a97b5, width: 2.2, opacity: 0.85, dashed: true, dash: 0.22, gap: 0.16 }],
    ['s2',  'ns1', { color: 0x8a97b5, width: 2.2, opacity: 0.85, dashed: true, dash: 0.22, gap: 0.16 }],
  ];
  for (const [a, b, opts] of innerEdges) {
    structureGroup.add(makeLine(POS[a], POS[b], opts));
  }

  /* ---- 2. Inner → outer midpoints (dotted) ---- */
  const outerConns = [
    ['s1', 'm1'], ['s1', 'm4'],
    ['s2', 'm1'], ['s2', 'm2'],
    ['ns1', 'm4'], ['ns1', 'm3'],
    ['ns2', 'm2'], ['ns2', 'm3'],
  ];
  for (const [a, b] of outerConns) {
    structureGroup.add(makeLine(POS[a], POS[b], {
      color: 0xc9a24a, width: 1.6, opacity: 0.6,
      dashed: true, dash: 0.10, gap: 0.12
    }));
  }

  /* ---- 3. Outer perimeter (dotted) ---- */
  const perimeter = [['c4', 'c1'], ['c1', 'c2'], ['c2', 'c3'], ['c3', 'c4']];
  for (const [a, b] of perimeter) {
    structureGroup.add(makeLine(POS[a], POS[b], {
      color: 0xd4a94f, width: 1.7, opacity: 0.7,
      dashed: true, dash: 0.12, gap: 0.13
    }));
  }

  /* ---- 4. Vertex dots ---- */
  for (const k of ALL_KEYS) {
    const isInner = INNER_KEYS.includes(k);
    const scale = isInner ? 0.72 : 0.55;
    structureGroup.add(makeDot(POS[k], COLORS[k], scale));
  }

  /* ---- 5. Main labels ---- */
  // Inner S: label pushed outward (away from origin)
  for (const k of INNER_KEYS) {
    const p = POS[k];
    const dir = new THREE.Vector3(p.x, p.y, 0).normalize();
    const label = makeLabel(SYMBOLS[k], state[k].name, TEXT_COLORS[k], 'main');
    label.position.copy(p).addScaledVector(dir, 0.55);
    labelGroup.add(label);
    mainLabels.push(label);
  }
  // M & C: label pushed inward (toward origin), so the triangle has clear space
  for (const k of [...M_KEYS, ...C_KEYS]) {
    const p = POS[k];
    const dir = new THREE.Vector3(-p.x, -p.y, 0).normalize();
    const cls = M_KEYS.includes(k) ? 'mid' : 'corner';
    const label = makeLabel(SYMBOLS[k], state[k].name, TEXT_COLORS[k], cls);
    label.position.copy(p).addScaledVector(dir, 0.42);
    labelGroup.add(label);
    mainLabels.push(label);
  }

  /* ---- 6. Subterm triangles ---- */
  buildFans();

  /* ---- 7. Visibility ---- */
  applyVisibility();
}

/* ---------------------------------------------------------------------
   TRIANGLE FANS
   Each vertex sprouts a triangle of subterms. The triangle sits in a
   plane tilted 45° from the square's plane so it reads well from any
   viewing angle.
   --------------------------------------------------------------------- */
function buildFans() {
  for (const k of ALL_KEYS) {
    const subs = (state[k].subs || '')
      .split(',')
      .map(s => s.trim())
      .filter(Boolean);

    if (subs.length !== 3) continue;   // triangle requires exactly 3

    const origin  = POS[k];
    const color   = COLORS[k];
    const isInner = INNER_KEYS.includes(k);

    // Size: inner terms get bigger triangles, outer get slightly smaller
    const dist    = isInner ? 1.25 : 0.70;
    const r       = isInner ? 0.70 : 0.40;
    const dotSize = isInner ? 0.38 : 0.30;
    const lblPush = isInner ? 0.28 : 0.22;

    // Local frame at this vertex
    const u = new THREE.Vector3(origin.x, origin.y, 0).normalize();   // outward
    const z = new THREE.Vector3(0, 0, 1);
    const v = new THREE.Vector3(u.y, -u.x, 0);                        // perpendicular in XY
    const e2 = v.clone()
      .multiplyScalar(Math.cos(TRI_TILT))
      .addScaledVector(z, Math.sin(TRI_TILT));

    // Triangle centroid
    const center = origin.clone().addScaledVector(u, dist);

    // Triangle vertices (equilateral: angles 0°, 120°, 240° in the (u, e2) plane)
    const verts = [];
    for (let i = 0; i < 3; i++) {
      const angle = (i / 3) * 2 * Math.PI;
      const p = center.clone()
        .addScaledVector(u,  r * Math.cos(angle))
        .addScaledVector(e2, r * Math.sin(angle));
      verts.push(p);
    }

    // Branches: origin → each vertex
    for (const vp of verts) {
      fanGroup.add(makeLine(origin, vp, { color, width: 1.5, opacity: 0.42 }));
    }

    // Triangle edges: vertex → next vertex
    for (let i = 0; i < 3; i++) {
      fanGroup.add(makeLine(verts[i], verts[(i + 1) % 3], {
        color, width: 1.5, opacity: 0.58
      }));
    }

    // Dots + labels at each vertex
    for (let i = 0; i < 3; i++) {
      const vp = verts[i];
      fanGroup.add(makeDot(vp, color, dotSize));

      const dirOut = vp.clone().sub(center).normalize();
      const lbl = makeSubLabel(subs[i], TEXT_COLORS[k]);
      lbl.position.copy(vp).addScaledVector(dirOut, lblPush);
      fanGroup.add(lbl);
      subLabels.push(lbl);
    }
  }
}

/* =====================================================================
   VISIBILITY
   ===================================================================== */
const toggleLabels = document.getElementById('t-labels');
const toggleSubs   = document.getElementById('t-subs');
const toggleRotate = document.getElementById('t-rotate');

function applyVisibility() {
  const showLabels = toggleLabels.checked;
  const showSubs   = toggleSubs.checked;

  mainLabels.forEach(l => { l.visible = showLabels; });
  subLabels.forEach(l  => { l.visible = showLabels && showSubs; });
  fanGroup.visible = showSubs;
}

/* =====================================================================
   UI
   ===================================================================== */
const inputs = {};
document.querySelectorAll('#ui input[data-k]').forEach(el => {
  const k = el.dataset.k;
  const f = el.dataset.f;
  if (!inputs[k]) inputs[k] = {};
  inputs[k][f] = el;
});

function syncInputsFromState() {
  for (const k of ALL_KEYS) {
    if (inputs[k] && inputs[k].name) inputs[k].name.value = state[k].name || '';
    if (inputs[k] && inputs[k].subs) inputs[k].subs.value = state[k].subs || '';
  }
}

function applyInputs() {
  for (const k of ALL_KEYS) {
    if (!inputs[k]) continue;
    if (inputs[k].name) {
      const val = inputs[k].name.value.trim();
      state[k].name = val || DEFAULTS[k].name;
    }
    if (inputs[k].subs) {
      state[k].subs = inputs[k].subs.value.trim();
    }
  }
  build();
}

document.getElementById('apply').addEventListener('click', applyInputs);

document.getElementById('reset').addEventListener('click', () => {
  for (const k of ALL_KEYS) {
    state[k].name = DEFAULTS[k].name;
    state[k].subs = DEFAULTS[k].subs;
  }
  syncInputsFromState();
  build();
});

document.querySelectorAll('#ui input[data-k]').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      applyInputs();
      el.blur();
    }
  });
});

toggleLabels.addEventListener('change', applyVisibility);
toggleSubs  .addEventListener('change', applyVisibility);
toggleRotate.addEventListener('change', () => {
  controls.autoRotate = toggleRotate.checked;
});

/* =====================================================================
   RESIZE
   ===================================================================== */
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  lineMaterials.forEach(m => m.resolution.set(w, h));
}
addEventListener('resize', onResize);

/* =====================================================================
   LOOP
   ===================================================================== */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* =====================================================================
   BOOT
   ===================================================================== */
syncInputsFromState();
build();
animate();
</script>
</body>
</html>
