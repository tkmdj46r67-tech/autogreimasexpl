<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Greimas Square — 3D Explorer</title>
<style>
  *{ box-sizing: border-box; }
  html, body{
    margin:0; height:100%; overflow:hidden; background:#05070d; color:#e9edf7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; }

  /* ---------- 3D labels ---------- */
  .lbl{
    pointer-events:none; user-select:none; white-space:nowrap; color:#fff;
    text-shadow: 0 0 10px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.9);
  }
  .lbl.main{
    font-size:15px; font-weight:600; padding:2px 10px; border-radius:999px;
    background: rgba(8,11,20,.62); border:1px solid rgba(255,255,255,.08);
  }
  .lbl.main b{
    font-weight:500; font-size:10.5px; opacity:.55; margin-right:6px; letter-spacing:.06em;
  }
  .lbl.sub{ font-size:11px; opacity:.85; letter-spacing:.05em; }

  /* ---------- console ---------- */
  #ui{
    position:fixed; top:16px; left:16px; z-index:10;
    width:280px; max-height:calc(100vh - 32px); overflow-y:auto;
    padding:14px 15px 15px;
    border-radius:14px;
    background: rgba(10,14,24,.86);
    border:1px solid rgba(255,255,255,.08);
    box-shadow: 0 16px 44px rgba(0,0,0,.55);
    font-size:12px; line-height:1.4;
  }
  #ui::-webkit-scrollbar{ width:7px; }
  #ui::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.13); border-radius:4px; }

  #ui h1{
    margin:0 0 2px; font-size:13px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  }
  #ui h1 span{
    display:inline-block; margin-left:6px; padding:1px 6px; font-size:9px; letter-spacing:.14em;
    border-radius:5px; color:#0a0e1c; vertical-align:2px;
    background:linear-gradient(120deg,#4ecdc4,#ff6fae);
  }
  .hint{ margin:0 0 13px; font-size:10.5px; color:#8a96b4; letter-spacing:.02em; }

  .term{ margin-bottom:9px; }
  .term label{
    display:flex; align-items:center; gap:6px; margin-bottom:4px;
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#9aa6c0;
  }
  .term label i{
    width:8px; height:8px; border-radius:50%; flex:0 0 auto;
    background:var(--c); box-shadow:0 0 9px var(--c);
  }
  input[type=text]{
    width:100%; padding:6px 9px; margin-bottom:4px; border-radius:8px;
    font:inherit; font-size:12px; color:#e9edf7;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    outline:none; transition:border-color .15s, background .15s;
  }
  input[type=text]:focus{
    border-color:rgba(126,160,255,.55); background:rgba(126,160,255,.10);
  }
  input.t-sub{ font-size:11px; color:#a8b3cc; }

  .buttons{ display:flex; gap:8px; margin:6px 0 12px; }
  button{
    flex:1; padding:8px 4px; border-radius:9px; cursor:pointer;
    font:inherit; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:#e9edf7; background:rgba(126,160,255,.18);
    border:1px solid rgba(126,160,255,.4);
    transition:background .15s, border-color .15s;
  }
  button:hover{ background:rgba(126,160,255,.32); }
  button:active{ transform:translateY(1px); }
  button.ghost{
    flex:0 0 76px; background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.11);
  }
  button.ghost:hover{ background:rgba(255,255,255,.11); }

  .toggles{
    display:flex; flex-wrap:wrap; gap:6px;
    padding-top:11px; border-top:1px solid rgba(255,255,255,.07);
  }
  .toggles label{
    display:flex; align-items:center; gap:5px;
    padding:5px 9px; border-radius:8px; cursor:pointer; user-select:none;
    font-size:10.5px; letter-spacing:.03em;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
    transition:background .15s, border-color .15s;
  }
  .toggles label:hover{ background:rgba(255,255,255,.09); }
  .toggles input{ display:none; }
  .toggles label:has(input:checked){
    background:rgba(126,160,255,.16);
    border-color:rgba(126,160,255,.42);
    color:#fff;
  }

  @media (max-width:560px){
    #ui{ width:206px; padding:11px; font-size:11px; }
    .hint{ display:none; }
    #ui h1{ font-size:11.5px; }
    .lbl.main{ font-size:13px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<!-- ================= CONSOLE ================= -->
<div id="ui">
  <h1>Greimas Square<span>3D</span></h1>
  <p class="hint">drag · rotate &nbsp;|&nbsp; scroll · zoom &nbsp;|&nbsp; right-drag · pan</p>

  <div class="term">
    <label><i style="--c:#ff9f43"></i>S₁ &nbsp;·&nbsp; top-left</label>
    <input class="t-main" data-k="s1" type="text" placeholder="term" />
    <input class="t-sub"  data-k="s1" type="text" placeholder="subterms, comma separated" />
  </div>

  <div class="term">
    <label><i style="--c:#4ecdc4"></i>S₂ &nbsp;·&nbsp; top-right</label>
    <input class="t-main" data-k="s2" type="text" placeholder="term" />
    <input class="t-sub"  data-k="s2" type="text" placeholder="subterms, comma separated" />
  </div>

  <div class="term">
    <label><i style="--c:#7b8cff"></i>~S₁ &nbsp;·&nbsp; bottom-left</label>
    <input class="t-main" data-k="ns1" type="text" placeholder="term" />
    <input class="t-sub"  data-k="ns1" type="text" placeholder="subterms, comma separated" />
  </div>

  <div class="term">
    <label><i style="--c:#ff6fae"></i>~S₂ &nbsp;·&nbsp; bottom-right</label>
    <input class="t-main" data-k="ns2" type="text" placeholder="term" />
    <input class="t-sub"  data-k="ns2" type="text" placeholder="subterms, comma separated" />
  </div>

  <div class="buttons">
    <button id="apply">Update</button>
    <button id="reset" class="ghost">Reset</button>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="t-labels" checked><span>Labels</span></label>
    <label><input type="checkbox" id="t-subs" checked><span>Subterms</span></label>
    <label><input type="checkbox" id="t-blur" checked><span>Motion blur</span></label>
    <label><input type="checkbox" id="t-rotate"><span>Auto-rotate</span></label>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* =====================================================================
   1.  DATA
   ===================================================================== */
const KEYS = ['s1', 's2', 'ns1', 'ns2'];

const COLORS = { s1: 0xff9f43, s2: 0x4ecdc4, ns1: 0x7b8cff, ns2: 0xff6fae };
const TEXTC  = { s1: '#ffb86b', s2: '#6fe3da', ns1: '#a3adff', ns2: '#ffa0cd' };
const SYM    = { s1: 'S₁', s2: 'S₂', ns1: '~S₁', ns2: '~S₂' };

const DEFAULTS = {
  s1 : { term: 'Life',      subs: 'Flora, Fauna, Body' },
  s2 : { term: 'Death',     subs: 'Silence, Decay, Ghost' },
  ns1: { term: 'Non-life',  subs: 'Mineral, Machine, Crystal' },
  ns2: { term: 'Non-death', subs: 'Memory, Relic, Seed' },
};

const state = JSON.parse(JSON.stringify(DEFAULTS));

/* =====================================================================
   2.  RENDERER / SCENE / CAMERA
   ===================================================================== */
const app = document.getElementById('app');
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;   // we tonemap in the composite pass
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, {
  position: 'absolute', top: '0', left: '0', pointerEvents: 'none'
});
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();

/* gradient sky (drawn in WebGL so the composite pass stays opaque) */
scene.background = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 205, 0, 256, 205, 365);
  g.addColorStop(0.00, '#18223c');
  g.addColorStop(0.45, '#0a0e1c');
  g.addColorStop(1.00, '#04050a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(3.4, 2.2, 11.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.08;
controls.rotateSpeed     = 0.85;
controls.minDistance     = 4.5;
controls.maxDistance     = 30;
controls.autoRotateSpeed = 0.9;

/* no lights needed — everything is unlit / emissive */

/* =====================================================================
   3.  SHARED HELPERS
   ===================================================================== */
const glowTex = (() => {
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.16, 'rgba(255,255,255,0.40)');
  g.addColorStop(0.42, 'rgba(255,255,255,0.10)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

/* --- fat line helper (Line2) --- */
function makeLine(points, opts = {}) {
  const {
    color = 0xffffff, width = 2, opacity = 1,
    dashed = false, dash = 0.20, gap = 0.14
  } = opts;

  const flat = [];
  for (const p of points) flat.push(p.x, p.y, p.z);

  const geo = new LineGeometry();
  geo.setPositions(flat);

  const mat = new LineMaterial({
    color, linewidth: width,
    transparent: true, opacity, depthWrite: false,
    dashed, dashSize: dash, gapSize: gap
  });
  mat.resolution.set(innerWidth, innerHeight);

  const line = new Line2(geo, mat);
  line.computeLineDistances();
  return line;
}

/* --- shared node resources (never disposed) --- */
const sphereMain = new THREE.SphereGeometry(0.16, 20, 14);
const sphereSub  = new THREE.SphereGeometry(0.07, 14, 10);

const matMain = {}, matSub = {}, matHalo = {};
for (const k of KEYS) {
  matMain[k] = new THREE.MeshBasicMaterial({ color: COLORS[k] });
  matSub[k]  = new THREE.MeshBasicMaterial({ color: COLORS[k] });
  matHalo[k] = new THREE.SpriteMaterial({
    map: glowTex, color: COLORS[k],
    blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity: 0.85
  });
}

function makeNode(pos, key, small) {
  const g = new THREE.Group();
  g.position.copy(pos);
  g.add(new THREE.Mesh(small ? sphereSub : sphereMain, small ? matSub[key] : matMain[key]));
  const halo = new THREE.Sprite(matHalo[key]);
  halo.scale.setScalar(small ? 0.62 : 1.30);
  g.add(halo);
  return g;
}

/* =====================================================================
   4.  GEOMETRY CONSTANTS
   ===================================================================== */
const HALF       = 2.0;
const SUB_RADIUS = 1.72;
const SUB_SPREAD = THREE.MathUtils.degToRad(58);

const POS = {
  s1 : new THREE.Vector3(-HALF,  HALF, 0),
  s2 : new THREE.Vector3( HALF,  HALF, 0),
  ns1: new THREE.Vector3(-HALF, -HALF, 0),
  ns2: new THREE.Vector3( HALF, -HALF, 0),
};

/* =====================================================================
   5.  THE SQUARE  (built once — never rebuilt)
   ===================================================================== */
const squareGroup = new THREE.Group();
scene.add(squareGroup);

/* --- the six relations --- */
const EDGES = [
  ['s1',  's2',  { color: 0xa9b8d8, width: 2.8, opacity: 0.95 }],                    // contrariety
  ['ns1', 'ns2', { color: 0xa9b8d8, width: 2.8, opacity: 0.95 }],                    // subcontrariety
  ['s1',  'ns1', { color: 0x8f9dbe, width: 2.4, opacity: 0.85, dashed: true, dash: 0.22, gap: 0.16 }], // contradiction
  ['s2',  'ns2', { color: 0x8f9dbe, width: 2.4, opacity: 0.85, dashed: true, dash: 0.22, gap: 0.16 }], // contradiction
  ['s1',  'ns2', { color: 0x707d99, width: 2.4, opacity: 0.80, dashed: true, dash: 0.05, gap: 0.13 }], // implication
  ['s2',  'ns1', { color: 0x707d99, width: 2.4, opacity: 0.80, dashed: true, dash: 0.05, gap: 0.13 }], // implication
];

for (const [a, b, style] of EDGES) {
  squareGroup.add(makeLine([POS[a], POS[b]], style));
}

/* --- corner nodes --- */
for (const k of KEYS) {
  squareGroup.add(makeNode(POS[k], k, false));
}

/* --- main labels (created once, text updated later) --- */
const labelGroup = new THREE.Group();
scene.add(labelGroup);

const mainLabels = {};   // key -> { el, obj }

for (const k of KEYS) {
  const p   = POS[k];
  const out = new THREE.Vector3(p.x, p.y, 0).normalize();

  const el = document.createElement('div');
  el.className = 'lbl main';
  el.style.color = TEXTC[k];

  const obj = new CSS2DObject(el);
  obj.position.copy(p).addScaledVector(out, 0.62);

  labelGroup.add(obj);
  mainLabels[k] = { el, obj };
}

function updateMainLabels() {
  for (const k of KEYS) {
    const { el } = mainLabels[k];
    el.textContent = '';
    const b = document.createElement('b');
    b.textContent = SYM[k];
    el.append(b, document.createTextNode(state[k].term));
  }
}

/* =====================================================================
   6.  SUBTERM FANS  (rebuilt whenever terms change)
   ===================================================================== */
const fanGroup = new THREE.Group();
scene.add(fanGroup);

let subLabelObjs = [];

function buildFans() {
  /* dispose only the Line2 geometry/materials we created */
  fanGroup.traverse(o => {
    if (o.isLine2) {
      o.geometry.dispose();
      o.material.dispose();
    }
  });
  fanGroup.clear();          // CSS2DObjects clean up their own DOM on 'removed'
  subLabelObjs = [];

  for (const k of KEYS) {
    const origin = POS[k];
    const color  = COLORS[k];

    const subs = state[k].subs
      .split(',')
      .map(s => s.trim())
      .filter(Boolean);

    if (!subs.length) continue;

    const n  = subs.length;
    const u  = new THREE.Vector3(origin.x, origin.y, 0).normalize();
    const zA = new THREE.Vector3(0, 0, 1);

    const positions = [];

    subs.forEach((text, i) => {
      const t     = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
      const theta = SUB_SPREAD * t;

      const dir = u.clone().multiplyScalar(Math.cos(theta))
        .addScaledVector(zA, Math.sin(theta))
        .normalize();

      const pos = origin.clone().addScaledVector(dir, SUB_RADIUS);
      positions.push(pos);

      /* branch line */
      fanGroup.add(makeLine([origin, pos], { color, width: 1.6, opacity: 0.42 }));

      /* sub-node */
      fanGroup.add(makeNode(pos, k, true));

      /* sub-label */
      const el = document.createElement('div');
      el.className = 'lbl sub';
      el.style.color = TEXTC[k];
      el.textContent = text;

      const obj = new CSS2DObject(el);
      obj.position.copy(pos).addScaledVector(dir, 0.30);

      fanGroup.add(obj);
      subLabelObjs.push(obj);
    });

    /* faint arc threading the subterms */
    if (positions.length > 1) {
      const curve = new THREE.CatmullRomCurve3(positions);
      fanGroup.add(makeLine(curve.getPoints(24), { color, width: 1.1, opacity: 0.24 }));
    }
  }

  updateVisibility();
}

/* =====================================================================
   7.  GROUND GRID
   ===================================================================== */
const grid = new THREE.GridHelper(28, 28, 0x2b3550, 0x161d2e);
grid.material.transparent = true;
grid.material.opacity = 0.32;
grid.position.y = -3.7;
scene.add(grid);

/* =====================================================================
   8.  MOTION-BLUR COMPOSITE  (3 render targets, 2 full-screen passes)
   ===================================================================== */
const bufSize = renderer.getDrawingBufferSize(new THREE.Vector2());

function makeRT(depth) {
  return new THREE.WebGLRenderTarget(bufSize.x, bufSize.y, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: depth,
    stencilBuffer: false
  });
}

const rtScene = makeRT(true);
const rtA     = makeRT(false);
const rtB     = makeRT(false);

const quadCam  = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo  = new THREE.PlaneGeometry(2, 2);
const quadScene = new THREE.Scene();

const VERT = `
  varying vec2 vUv;
  void main(){
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

/* pass 1 — accumulate: max(current, previous * decay) */
const blurMat = new THREE.ShaderMaterial({
  uniforms: {
    tCur  : { value: null },
    tPrev : { value: null },
    decay : { value: 0.80 }
  },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tCur;
    uniform sampler2D tPrev;
    uniform float decay;
    varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tCur,  vUv).rgb;
      vec3 p = texture2D(tPrev, vUv).rgb;
      gl_FragColor = vec4(max(c, p * decay), 1.0);
    }
  `,
  depthTest: false, depthWrite: false
});

/* pass 2 — tonemap + gamma to the screen */
const outMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    varying vec2 vUv;
    vec3 aces(vec3 x){
      return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
    }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      gl_FragColor = vec4(pow(aces(c), vec3(1.0 / 2.2)), 1.0);
    }
  `,
  depthTest: false, depthWrite: false
});

const quad = new THREE.Mesh(quadGeo, outMat);
quad.frustumCulled = false;
quadScene.add(quad);

let accumIndex = 0;
let blurOn = true;

function renderFrame() {
  /* 1 — scene into an offscreen buffer */
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);

  /* 2 — accumulate with the previous frame */
  const read  = accumIndex ? rtB : rtA;
  const write = accumIndex ? rtA : rtB;

  blurMat.uniforms.tCur.value  = rtScene.texture;
  blurMat.uniforms.tPrev.value = read.texture;
  blurMat.uniforms.decay.value = blurOn ? 0.80 : 0.0;

  quad.material = blurMat;
  renderer.setRenderTarget(write);
  renderer.render(quadScene, quadCam);

  /* 3 — tonemap that result to the canvas */
  outMat.uniforms.tDiffuse.value = write.texture;
  quad.material = outMat;
  renderer.setRenderTarget(null);
  renderer.render(quadScene, quadCam);

  accumIndex = 1 - accumIndex;
}

/* =====================================================================
   9.  UI WIRING
   ===================================================================== */
const inputsMain = {};
const inputsSub  = {};

document.querySelectorAll('input.t-main').forEach(el => inputsMain[el.dataset.k] = el);
document.querySelectorAll('input.t-sub').forEach(el  => inputsSub[el.dataset.k]  = el);

const toggleLabels = document.getElementById('t-labels');
const toggleSubs   = document.getElementById('t-subs');
const toggleBlur   = document.getElementById('t-blur');
const toggleRotate = document.getElementById('t-rotate');

function updateVisibility() {
  const showLabels = toggleLabels.checked;
  const showSubs   = toggleSubs.checked;

  for (const k of KEYS) mainLabels[k].obj.visible = showLabels;
  for (const o of subLabelObjs) o.visible = showLabels && showSubs;
  fanGroup.visible = showSubs;
}

function syncInputsFromState() {
  for (const k of KEYS) {
    inputsMain[k].value = state[k].term;
    inputsSub[k].value  = state[k].subs;
  }
}

function applyInputs() {
  for (const k of KEYS) {
    const term = inputsMain[k].value.trim();
    state[k].term = term || DEFAULTS[k].term;
    state[k].subs = inputsSub[k].value.trim();
  }
  updateMainLabels();
  buildFans();
  updateVisibility();
}

document.getElementById('apply').addEventListener('click', applyInputs);

document.getElementById('reset').addEventListener('click', () => {
  for (const k of KEYS) {
    state[k].term = DEFAULTS[k].term;
    state[k].subs = DEFAULTS[k].subs;
  }
  syncInputsFromState();
  updateMainLabels();
  buildFans();
  updateVisibility();
});

/* Enter key inside any field applies */
[...Object.values(inputsMain), ...Object.values(inputsSub)].forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); applyInputs(); el.blur(); }
  });
});

toggleLabels.addEventListener('change', updateVisibility);
toggleSubs  .addEventListener('change', updateVisibility);
toggleBlur  .addEventListener('change', () => blurOn = toggleBlur.checked);
toggleRotate.addEventListener('change', () => controls.autoRotate = toggleRotate.checked);

/* =====================================================================
   10.  BOOT
   ===================================================================== */
syncInputsFromState();
updateMainLabels();
buildFans();

/* =====================================================================
   11.  RESIZE + LOOP
   ===================================================================== */
function onResize() {
  const w = innerWidth, h = innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);

  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  rtScene.setSize(s.x, s.y);
  rtA.setSize(s.x, s.y);
  rtB.setSize(s.x, s.y);

  scene.traverse(o => {
    if (o.material && o.material.isLineMaterial) o.material.resolution.set(w, h);
  });
}
addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderFrame();
}
animate();
</script>
</body>
</html>
