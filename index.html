<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architectonic Greimas Viewer — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(9,13,22,0.92);
    --text: #e9edf7;
    --text-dim: #8a93ab;
    --accent: #1F9E89;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Archivo', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  input, textarea, button { font-family: inherit; }

  #canvas-container { position: fixed; inset: 0; z-index: 1; }

  #top-bar {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap; max-width: 60vw;
  }
  .btn {
    padding: 10px 14px; min-height: 40px;
    border-radius: 9px; cursor: pointer;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: #c8d0e6; background: var(--panel);
    border: 1px solid rgba(31,158,137,0.20);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: background .15s, border-color .15s, color .15s, opacity .15s;
    user-select: none;
  }
  .btn:hover:not(.disabled) { background: rgba(31,158,137,.20); border-color: rgba(31,158,137,.55); color: #fff; }
  .btn:active:not(.disabled) { transform: translateY(1px); }
  .btn.disabled {
    opacity: 0.35; cursor: not-allowed;
    border-color: rgba(31,158,137,0.08);
  }
  .btn.level-btn { border-color: rgba(253,231,37,0.35); color: #FDE725; }
  .btn.level-btn:hover:not(.disabled) { background: rgba(253,231,37,0.15); border-color: rgba(253,231,37,0.7); color: #fff; }

  #ui {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    width: 380px; max-height: calc(100vh - 28px); overflow-y: auto;
    padding: 14px 16px; border-radius: 12px;
    background: var(--panel);
    border: 1px solid rgba(31,158,137,0.16);
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    transition: transform .3s, opacity .3s;
  }
  body.panels-hidden #ui { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }

  .sec { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 10px 0; }
  .sec:last-child { border-bottom: none; }
  .sec-title {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);
    user-select: none;
  }
  .sec-title:hover { color: #c8d0e6; }
  .sec-body { max-height: 0; overflow: hidden; transition: max-height .3s; }
  .sec.open .sec-body { max-height: 2000px; }
  .sec-content { padding: 10px 0 4px; }
  .chev { font-size: 10px; transition: transform .25s; }
  .sec.open .chev { transform: rotate(180deg); }

  #json-input {
    width: 100%; min-height: 100px; resize: vertical;
    background: #0a0d1a; color: var(--text);
    border: 1px solid rgba(31,158,137,0.18); border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; line-height: 1.5;
  }
  #json-status { font-size: 11px; margin-top: 6px; }
  #json-status.ok { color: #35B779; }
  #json-status.err { color: #ff6b6b; }

  #node-info {
    padding: 10px 12px;
    background: rgba(15,20,32,0.8); border-radius: 8px;
    border: 1px solid rgba(31,158,137,0.12);
    font-size: 11.5px; line-height: 1.55;
    max-height: 260px; overflow-y: auto;
    min-height: 80px;
  }
  #node-info h4 { margin: 0 0 6px; font-size: 12.5px; color: #FDE725; }
  #node-info .kv { margin-bottom: 5px; }
  #node-info .k { color: var(--text-dim); }
  #node-info .chip {
    display: inline-block; padding: 1px 7px; border-radius: 8px;
    background: rgba(31,158,137,0.18); color: #35B779; font-size: 10.5px;
    margin: 2px 3px 2px 0;
  }

  .legend {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; color: var(--text-dim);
    padding: 8px 0;
  }
  .legend span { display: flex; align-items: center; }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px;
    margin-right: 8px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* ---- Overview mini-window ---- */
  #overview-container {
    position: fixed;
    left: 14px;
    bottom: 14px;
    width: 220px;
    height: 220px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(31,158,137,0.30);
    background: #05070d;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    z-index: 8;
    transition: opacity .3s;
  }
  body.panels-hidden #overview-container { opacity: 0.9; }
  #overview-canvas { display: block; width: 100%; height: 100%; }
  #overview-labels {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  #overview-title {
    position: absolute; top: 6px; left: 10px;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(200,208,230,0.6);
    pointer-events: none;
    z-index: 2;
  }

  @media (max-width: 720px) {
    #overview-container { width: 140px; height: 140px; }
    #overview-title { font-size: 8px; }
  }

  .label {
    color: #B4DE2C;
    font-size: 11px;
    font-weight: 600;
    text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    padding: 1px 4px;
    border-radius: 4px;
    transition: color .15s, opacity .15s;
  }
  .label.square-header {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .label.square-header .parent {
    color: var(--text-dim); font-weight: 500; font-style: italic;
    text-transform: none; letter-spacing: 0; font-size: 11.5px;
  }
  .label.highlighted { color: #FDE725 !important; text-shadow: 0 0 12px rgba(253,231,37,0.9), 0 0 3px rgba(0,0,0,1); }
  .label.dimmed { color: #1c3a48 !important; }

  /* Overview mini-labels (smaller) */
  .overview-label {
    color: #c8d0e6;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-shadow: 0 0 6px rgba(0,0,0,0.95);
    transform: translate(-50%, 0);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }

  .loading {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: var(--bg); color: var(--text-dim);
    font-size: 13px; z-index: 100;
    transition: opacity .5s;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="top-bar">
  <button class="btn" id="panel-toggle">◱ Hide Panels</button>
  <button class="btn level-btn" id="level-btn">→ B Level</button>
  <button class="btn disabled" id="cycle-btn">▸ Next B</button>
  <button class="btn" id="view-reset">⌖ Reset View</button>
  <button class="btn" id="view-top">▣ Top</button>
  <button class="btn" id="view-front">▤ Front</button>
</div>

<div id="ui">
  <div class="sec open" data-sec>
    <div class="sec-title"><span>Load JSON</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <textarea id="json-input" spellcheck="false" placeholder="Paste the architectonic JSON from greimas_architectonic.py here."></textarea>
      <div id="json-status"></div>
      <button class="btn" id="json-apply" style="margin-top:8px; width:100%;">Update</button>
    </div></div>
  </div>

  <div class="sec open" data-sec>
    <div class="sec-title"><span>Node Info</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <div id="node-info"><em style="color:var(--text-dim);">Hover or click a node.</em></div>
    </div></div>
  </div>

  <div class="sec open" data-sec>
    <div class="sec-title"><span>Legend</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <div class="legend" id="legend"></div>
    </div></div>
  </div>
</div>

<div id="overview-container">
  <canvas id="overview-canvas"></canvas>
  <div id="overview-labels"></div>
  <div id="overview-title">Overview</div>
</div>

<div class="loading" id="loading">Building architectonic...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// =========================================================
// VIRIDIS PALETTE
// =========================================================

const VIRIDIS = {
  'A':   0xFDE725,
  'S1':  0xB4DE2C,
  'S2':  0x35B779,
  '~S1': 0x1F9E89,
  '~S2': 0x3E4A89,
};

const VIRIDIS_HEX = {
  'A':   '#FDE725',
  'S1':  '#B4DE2C',
  'S2':  '#35B779',
  '~S1': '#1F9E89',
  '~S2': '#3E4A89',
};

function colorForSquare(k) { return VIRIDIS[k] ?? 0xB4DE2C; }
function hexForSquare(k)   { return VIRIDIS_HEX[k] ?? '#B4DE2C'; }

const HIGHLIGHT_COLOR = 0xFDE725;

// =========================================================
// GREIMAS SQUARE GEOMETRY
// =========================================================

const SQ_POS = {
  top:      [ 0.0,  3.20],
  M21:      [-2.20,  2.20],
  M22:      [-0.75,  2.20],
  M23:      [ 0.75,  2.20],
  M24:      [ 2.20,  2.20],
  M11:      [ 0.0,   1.40],
  S1:       [-1.10,  0.70],
  S2:       [ 1.10,  0.70],
  M13:      [-2.20,  0.00],
  Mixed1:   [-0.75,  0.00],
  Mixed2:   [ 0.75,  0.00],
  M14:      [ 2.20,  0.00],
  '~S2':    [-1.10, -0.70],
  '~S1':    [ 1.10, -0.70],
  M12:      [ 0.0,  -1.40],
  bottom:   [ 0.0,  -3.20],
};

const SQ_EDGES = [
  ['top','M21'], ['top','M22'], ['top','M23'], ['top','M24'],
  ['M21','M11'], ['M21','M13'],
  ['M22','M11'], ['M22','M14'],
  ['M23','M12'], ['M23','M13'],
  ['M24','M12'], ['M24','M14'],
  ['M11','S1'], ['M11','S2'],
  ['M12','~S2'], ['M12','~S1'],
  ['M13','S1'], ['M13','~S2'],
  ['M14','S2'], ['M14','~S1'],
  ['Mixed1','S1'], ['Mixed1','~S1'],
  ['Mixed2','S2'], ['Mixed2','~S2'],
  ['S1','bottom'], ['S2','bottom'], ['~S2','bottom'], ['~S1','bottom'],
  ['S1','S2'], ['~S2','~S1'],
  ['S1','~S2'], ['S2','~S1'],
  ['S1','~S1'], ['S2','~S2'],
];

function isInnerSquareEdge(a, b) {
  const inner = new Set(['S1','S2','~S2','~S1']);
  return inner.has(a) && inner.has(b);
}

// =========================================================
// LAYOUT
// =========================================================

const LAYOUT = {
  A:     { position: { x:  0,   y:  0,   z:  10 }, scale: 1.15 },
  S1:    { position: { x: -5.5, y: -6.5, z: -6  }, scale: 0.95 },
  S2:    { position: { x:  5.5, y: -6.5, z: -6  }, scale: 0.95 },
  '~S1': { position: { x: -5.5, y:  6.5, z: -6  }, scale: 0.95 },
  '~S2': { position: { x:  5.5, y:  6.5, z: -6  }, scale: 0.95 },
};

const B_CYCLE_ORDER = ['S1', 'S2', '~S2', '~S1'];  // clockwise around the square

// =========================================================
// VIEW OFFSETS — camera position relative to focus
// =========================================================

const VIEW_OFFSETS = {
  default: new THREE.Vector3(5, 3, 14),
  top:     new THREE.Vector3(4, 14, 4),
  front:   new THREE.Vector3(0, 0, 15),
};

// =========================================================
// MAIN SCENE
// =========================================================

const container = document.getElementById('canvas-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.FogExp2(0x05070d, 0.007);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
labelRenderer.domElement.style.zIndex = '2';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 100;

scene.add(new THREE.AmbientLight(0xffffff, 1));

// =========================================================
// OVERVIEW SCENE (separate, top-down)
// =========================================================

const overviewCanvas = document.getElementById('overview-canvas');
const overviewRenderer = new THREE.WebGLRenderer({
  canvas: overviewCanvas,
  antialias: true,
  alpha: false,
});
overviewRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const overviewScene = new THREE.Scene();
overviewScene.background = new THREE.Color(0x05070d);

const overviewCamera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
overviewCamera.position.set(0, 45, 2);
overviewCamera.up.set(0, 0, -1);
overviewCamera.lookAt(0, 0, 2);

const overviewLabelRenderer = new CSS2DRenderer();
overviewLabelRenderer.domElement.style.position = 'absolute';
overviewLabelRenderer.domElement.style.top = '0';
overviewLabelRenderer.domElement.style.left = '0';
overviewLabelRenderer.domElement.style.width = '100%';
overviewLabelRenderer.domElement.style.height = '100%';
overviewLabelRenderer.domElement.style.pointerEvents = 'none';
document.getElementById('overview-labels').appendChild(overviewLabelRenderer.domElement);

function updateOverviewSize() {
  const c = document.getElementById('overview-container');
  const w = c.clientWidth, h = c.clientHeight;
  overviewRenderer.setSize(w, h, false);
  overviewLabelRenderer.setSize(w, h);
  overviewCamera.aspect = w / h;
  overviewCamera.updateProjectionMatrix();
}

// Proxy objects in the overview
const overviewProxies = {};     // key -> { dot, ring, label }
let overviewFocusRing = null;

function buildOverviewProxies() {
  // Clear old
  Object.values(overviewProxies).forEach(p => {
    overviewScene.remove(p.dot);
    overviewScene.remove(p.label);
    p.dot.geometry.dispose();
    p.dot.material.dispose();
  });
  for (const k in overviewProxies) delete overviewProxies[k];

  if (overviewFocusRing) {
    overviewScene.remove(overviewFocusRing);
    overviewFocusRing.geometry.dispose();
    overviewFocusRing.material.dispose();
    overviewFocusRing = null;
  }

  state.squares.forEach(sq => {
    const layout = LAYOUT[sq.key];
    if (!layout) return;

    const color = colorForSquare(sq.key);
    const geom = new THREE.RingGeometry(0.9, 1.6, 24);
    const mat = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.9,
      side: THREE.DoubleSide,
    });
    const dot = new THREE.Mesh(geom, mat);
    dot.rotation.x = -Math.PI / 2;
    dot.position.set(layout.position.x, layout.position.y, layout.position.z);
    overviewScene.add(dot);

    const labelEl = document.createElement('div');
    labelEl.className = 'overview-label';
    labelEl.style.color = hexForSquare(sq.key);
    labelEl.textContent = sq.key === 'A' ? 'A' : `B[${sq.key}]`;
    const label = new CSS2DObject(labelEl);
    label.position.set(layout.position.x, layout.position.y, layout.position.z + 2.2);
    overviewScene.add(label);

    overviewProxies[sq.key] = { dot, label };
  });

  // Focus ring (bright, positioned under the focused proxy)
  const frGeom = new THREE.RingGeometry(1.9, 2.35, 32);
  const frMat = new THREE.MeshBasicMaterial({
    color: HIGHLIGHT_COLOR,
    transparent: true,
    opacity: 0.9,
    side: THREE.DoubleSide,
  });
  overviewFocusRing = new THREE.Mesh(frGeom, frMat);
  overviewFocusRing.rotation.x = -Math.PI / 2;
  overviewScene.add(overviewFocusRing);

  updateOverviewFocus();
}

function updateOverviewFocus() {
  if (!overviewFocusRing) return;
  const layout = LAYOUT[state.focusedKey];
  if (!layout) return;
  overviewFocusRing.position.set(layout.position.x, layout.position.y + 0.01, layout.position.z);
}

// =========================================================
// STATE
// =========================================================

const state = {
  data: null,
  squares: [],
  nodesById: new Map(),
  hoverTarget: null,
  pinnedTarget: null,
  raycaster: new THREE.Raycaster(),
  mouse: new THREE.Vector2(-10, -10),

  focusedKey: 'A',
  level: 'A',   // 'A' or 'B'

  // Camera animation
  anim: {
    active: false,
    t: 0,
    duration: 0.5,  // seconds
    fromCam: new THREE.Vector3(),
    toCam: new THREE.Vector3(),
    fromLook: new THREE.Vector3(),
    toLook: new THREE.Vector3(),
    lastTime: 0,
  },
};

// =========================================================
// SQUARE CONSTRUCTION
// =========================================================

const NODE_RADIUS = 0.13;
const NODE_OPACITY = 0.88;
const EDGE_OPACITY = 0.55;
const EDGE_OPACITY_INNER = 0.72;

function buildSquare(squareData, squareKey, title, parentTerm, position, scale) {
  const group = new THREE.Group();
  group.position.set(position.x, position.y, position.z);
  group.scale.setScalar(scale);

  const nodeMeshes = {};
  const nodeLabels = {};
  const nodePositions3D = {};

  const squareColor = colorForSquare(squareKey);
  const labelColor = hexForSquare(squareKey);

  SQ_EDGES.forEach(([a, b]) => {
    if (!SQ_POS[a] || !SQ_POS[b]) return;
    const [x1, y1] = SQ_POS[a];
    const [x2, y2] = SQ_POS[b];

    const dashed = isInnerSquareEdge(a, b);
    const opacity = dashed ? EDGE_OPACITY_INNER : EDGE_OPACITY;

    const geom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x1, y1, 0),
      new THREE.Vector3(x2, y2, 0),
    ]);

    if (dashed) {
      const mat = new THREE.LineDashedMaterial({
        color: squareColor, dashSize: 0.18, gapSize: 0.10,
        transparent: true, opacity, depthWrite: false,
      });
      const line = new THREE.Line(geom, mat);
      line.computeLineDistances();
      group.add(line);
    } else {
      const mat = new THREE.LineBasicMaterial({
        color: squareColor, transparent: true, opacity, depthWrite: false,
      });
      group.add(new THREE.Line(geom, mat));
    }
  });

  Object.entries(SQ_POS).forEach(([pos, [x, y]]) => {
    const geom = new THREE.IcosahedronGeometry(NODE_RADIUS, 0);
    const mat = new THREE.MeshBasicMaterial({
      color: squareColor, wireframe: true,
      transparent: true, opacity: NODE_OPACITY, depthWrite: false,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(x, y, 0);
    mesh.userData = {
      squareKey, position: pos, term: squareData[pos] || '',
      baseColor: squareColor, baseOpacity: NODE_OPACITY,
    };
    group.add(mesh);

    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.style.color = labelColor;
    const termText = squareData[pos] || '';
    labelEl.textContent = termText.length > 18 ? termText.slice(0, 17) + '…' : termText;
    const label = new CSS2DObject(labelEl);
    label.position.set(x, y - NODE_RADIUS - 0.22, 0);
    group.add(label);

    const posEl = document.createElement('div');
    posEl.className = 'label';
    posEl.style.fontSize = '9px';
    posEl.style.color = labelColor;
    posEl.style.opacity = '0.75';
    posEl.textContent = pos;
    const posLabel = new CSS2DObject(posEl);
    posLabel.position.set(x, y + NODE_RADIUS + 0.14, 0);
    group.add(posLabel);

    nodeMeshes[pos] = mesh;
    nodeLabels[pos] = { termEl: labelEl, posEl };
    nodePositions3D[pos] = new THREE.Vector3(x, y, 0);

    state.nodesById.set(mesh.uuid, { squareKey, position: pos, term: squareData[pos] });
  });

  const headerEl = document.createElement('div');
  headerEl.className = 'label square-header';
  headerEl.style.color = labelColor;
  const keySpan = document.createElement('span');
  keySpan.textContent = squareKey;
  headerEl.appendChild(keySpan);
  if (parentTerm) {
    const parentSpan = document.createElement('span');
    parentSpan.className = 'parent';
    parentSpan.textContent = ` of ${parentTerm}`;
    headerEl.appendChild(parentSpan);
  }
  const headerLabel = new CSS2DObject(headerEl);
  headerLabel.position.set(0, 3.85, 0);
  group.add(headerLabel);

  scene.add(group);

  return {
    key: squareKey, title, parentTerm, squareData,
    group, nodeMeshes, nodeLabels, nodePositions3D,
  };
}

function clearScene() {
  state.squares.forEach(sq => {
    scene.remove(sq.group);
    sq.group.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    });
  });
  state.squares = [];
  state.nodesById.clear();
  state.hoverTarget = null;
  state.pinnedTarget = null;
}

function buildArchitectonic(parsed) {
  clearScene();

  const layer_1 = parsed.layer_1;
  const layer_2 = parsed.layer_2;
  if (!layer_1 || !layer_1.square) throw new Error('Missing layer_1.square');
  if (!layer_2 || typeof layer_2 !== 'object') throw new Error('Missing layer_2');

  const A = buildSquare(
    layer_1.square, 'A', 'Layer 1', null,
    LAYOUT.A.position, LAYOUT.A.scale
  );
  state.squares.push(A);

  ['S1','S2','~S1','~S2'].forEach(semeKey => {
    const b = layer_2[semeKey];
    if (!b || !b.square) return;
    const sq = buildSquare(
      b.square, semeKey, 'Decomposition', b.parent_term || '',
      LAYOUT[semeKey].position, LAYOUT[semeKey].scale
    );
    state.squares.push(sq);
  });

  state.data = parsed;
  updateNodeInfo(null);
  renderLegend();
  buildOverviewProxies();

  // Default focus on A
  setFocus('A', false, 'default');
  updateNavButtons();
}

// =========================================================
// FOCUS / CAMERA ANIMATION
// =========================================================

function computeFocusCamera(key, mode) {
  const layout = LAYOUT[key];
  if (!layout) return null;
  const focusPos = new THREE.Vector3(layout.position.x, layout.position.y, layout.position.z);
  const offset = (VIEW_OFFSETS[mode] || VIEW_OFFSETS.default).clone();
  const camPos = focusPos.clone().add(offset);
  return { camPos, focusPos };
}

function setFocus(key, animate=true, mode='default') {
  if (!LAYOUT[key]) return;
  state.focusedKey = key;
  state.level = (key === 'A') ? 'A' : 'B';

  const target = computeFocusCamera(key, mode);
  if (!target) return;

  if (!animate) {
    camera.position.copy(target.camPos);
    controls.target.copy(target.focusPos);
    controls.update();
  } else {
    state.anim.active = true;
    state.anim.t = 0;
    state.anim.lastTime = performance.now();
    state.anim.fromCam.copy(camera.position);
    state.anim.toCam.copy(target.camPos);
    state.anim.fromLook.copy(controls.target);
    state.anim.toLook.copy(target.focusPos);
  }

  updateOverviewFocus();
  updateNavButtons();
}

function setViewMode(mode) {
  // Re-apply camera offset for the currently focused key
  setFocus(state.focusedKey, true, mode);
}

function updateNavButtons() {
  const levelBtn = document.getElementById('level-btn');
  const cycleBtn = document.getElementById('cycle-btn');

  if (state.level === 'A') {
    levelBtn.textContent = '→ B Level';
    cycleBtn.classList.add('disabled');
    cycleBtn.disabled = true;
  } else {
    levelBtn.textContent = '→ A Level';
    cycleBtn.classList.remove('disabled');
    cycleBtn.disabled = false;
  }
}

function toggleLevel() {
  if (state.level === 'A') {
    setFocus(B_CYCLE_ORDER[0], true, 'default');
  } else {
    setFocus('A', true, 'default');
  }
}

function cycleB(direction = 1) {
  if (state.level !== 'B') return;
  const idx = B_CYCLE_ORDER.indexOf(state.focusedKey);
  if (idx === -1) {
    setFocus(B_CYCLE_ORDER[0], true, 'default');
    return;
  }
  const next = (idx + direction + B_CYCLE_ORDER.length) % B_CYCLE_ORDER.length;
  setFocus(B_CYCLE_ORDER[next], true, 'default');
}

// =========================================================
// LEGEND
// =========================================================

function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  state.squares.forEach(sq => {
    const span = document.createElement('span');
    span.style.color = hexForSquare(sq.key);
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = hexForSquare(sq.key);
    span.appendChild(dot);
    const label = sq.key === 'A'
      ? 'A — Layer 1'
      : `B[${sq.key}]${sq.parentTerm ? ' — ' + sq.parentTerm : ''}`;
    span.appendChild(document.createTextNode(label));
    el.appendChild(span);
  });
}

// =========================================================
// HIGHLIGHTING
// =========================================================

function setNodeState(mesh, mode) {
  const mat = mesh.material;
  const baseColor = mesh.userData.baseColor;
  const baseOpacity = mesh.userData.baseOpacity;
  if (mode === 'highlight') {
    mat.color.setHex(HIGHLIGHT_COLOR);
    mat.opacity = 1.0;
    mesh.scale.setScalar(1.6);
  } else if (mode === 'dim') {
    mat.color.setHex(baseColor);
    mat.opacity = 0.14;
    mesh.scale.setScalar(0.72);
  } else {
    mat.color.setHex(baseColor);
    mat.opacity = baseOpacity;
    mesh.scale.setScalar(1);
  }
}

function applyHighlight(target) {
  state.squares.forEach(sq => {
    Object.entries(sq.nodeMeshes).forEach(([pos, mesh]) => {
      setNodeState(mesh, 'normal');
      const lbl = sq.nodeLabels[pos];
      if (lbl) lbl.termEl.classList.remove('highlighted', 'dimmed');
    });
  });

  if (!target) return;

  const targetSq = state.squares.find(s => s.key === target.squareKey);
  if (!targetSq) return;
  const targetTerm = targetSq.squareData[target.position] || '';

  state.squares.forEach(sq => {
    Object.entries(sq.nodeMeshes).forEach(([pos, mesh]) => {
      const term = sq.squareData[pos] || '';
      const matchByPos = (sq.key === target.squareKey && pos === target.position);
      const matchByTerm = term && term === targetTerm;
      if (matchByPos || matchByTerm) {
        setNodeState(mesh, 'highlight');
        const lbl = sq.nodeLabels[pos];
        if (lbl) lbl.termEl.classList.add('highlighted');
      } else {
        setNodeState(mesh, 'dim');
        const lbl = sq.nodeLabels[pos];
        if (lbl) lbl.termEl.classList.add('dimmed');
      }
    });
  });
}

// =========================================================
// NODE INFO
// =========================================================

const COMPOSITIONS = {
  'S1': 'S1 + S2 → M11 · S1 + ~S2 → M13 · S1 + ~S1 → Mixed1',
  'S2': 'S1 + S2 → M11 · S2 + ~S1 → M14 · S2 + ~S2 → Mixed2',
  '~S2': '~S1 + ~S2 → M12 · S1 + ~S2 → M13 · S2 + ~S2 → Mixed2',
  '~S1': '~S1 + ~S2 → M12 · S2 + ~S1 → M14 · S1 + ~S1 → Mixed1',
  'M11': 'complex axis: S1 + S2',
  'M12': 'neutral axis: ~S1 + ~S2',
  'M13': 'positive deixis: S1 + ~S2',
  'M14': 'negative deixis: S2 + ~S1',
  'M21': 'contains S1, S2, ~S2 (omits ~S1)',
  'M22': 'contains S1, S2, ~S1 (omits ~S2)',
  'M23': 'contains S1, ~S1, ~S2 (omits S2)',
  'M24': 'contains S2, ~S1, ~S2 (omits S1)',
  'Mixed1': 'undifferentiated axis: S1 + ~S1',
  'Mixed2': 'undifferentiated axis: S2 + ~S2',
  'top': 'all four inner semes, no shared attribute',
  'bottom': 'empty extent, all M2 attributes',
};

function updateNodeInfo(target) {
  const el = document.getElementById('node-info');
  if (!target) {
    el.innerHTML = '<em style="color:var(--text-dim);">Hover or click a node.</em>';
    return;
  }
  const sq = state.squares.find(s => s.key === target.squareKey);
  if (!sq) return;
  const pos = target.position;
  const term = sq.squareData[pos] || '';

  let html = `<h4 style="color:${hexForSquare(sq.key)}">${sq.key} · ${pos}</h4>`;
  html += `<div class="kv"><span class="k">Term:</span> ${term || '—'}</div>`;
  if (sq.parentTerm) {
    html += `<div class="kv"><span class="k">Decomposes:</span> ${sq.parentTerm}</div>`;
  }
  if (COMPOSITIONS[pos]) {
    html += `<div class="kv"><span class="k">Structure:</span> ${COMPOSITIONS[pos]}</div>`;
  }

  if (term) {
    const appearances = [];
    state.squares.forEach(other => {
      if (other.key === target.squareKey) return;
      Object.entries(other.squareData).forEach(([p, t]) => {
        if (t === term) appearances.push(`${other.key}·${p}`);
      });
    });
    if (appearances.length) {
      html += `<div class="kv"><span class="k">Also appears on:</span><br>`;
      appearances.forEach(a => { html += `<span class="chip">${a}</span>`; });
      html += `</div>`;
    }
  }

  el.innerHTML = html;
}

// =========================================================
// RAYCASTING
// =========================================================

function updateMouseFromEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  state.mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  state.mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
}

function pickNode() {
  state.raycaster.setFromCamera(state.mouse, camera);
  const meshes = [];
  state.squares.forEach(sq => {
    Object.values(sq.nodeMeshes).forEach(m => meshes.push(m));
  });
  const hits = state.raycaster.intersectObjects(meshes, false);
  if (hits.length === 0) return null;
  const mesh = hits[0].object;
  const data = state.nodesById.get(mesh.uuid);
  return data ? { squareKey: data.squareKey, position: data.position } : null;
}

let rafPending = false;
renderer.domElement.addEventListener('pointermove', (ev) => {
  updateMouseFromEvent(ev);
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    if (state.pinnedTarget) return;
    const hit = pickNode();
    if (hit) {
      if (!state.hoverTarget || hit.squareKey !== state.hoverTarget.squareKey || hit.position !== state.hoverTarget.position) {
        state.hoverTarget = hit;
        applyHighlight(hit);
        updateNodeInfo(hit);
        document.body.style.cursor = 'pointer';
      }
    } else {
      if (state.hoverTarget) {
        state.hoverTarget = null;
        if (state.pinnedTarget) {
          applyHighlight(state.pinnedTarget);
          updateNodeInfo(state.pinnedTarget);
        } else {
          applyHighlight(null);
          updateNodeInfo(null);
        }
        document.body.style.cursor = 'default';
      }
    }
  });
});

renderer.domElement.addEventListener('click', (ev) => {
  updateMouseFromEvent(ev);
  const hit = pickNode();
  if (!hit) {
    if (state.pinnedTarget) {
      state.pinnedTarget = null;
      if (state.hoverTarget) {
        applyHighlight(state.hoverTarget);
        updateNodeInfo(state.hoverTarget);
      } else {
        applyHighlight(null);
        updateNodeInfo(null);
      }
    }
    return;
  }
  if (state.pinnedTarget && state.pinnedTarget.squareKey === hit.squareKey && state.pinnedTarget.position === hit.position) {
    state.pinnedTarget = null;
    if (state.hoverTarget) {
      applyHighlight(state.hoverTarget);
      updateNodeInfo(state.hoverTarget);
    } else {
      applyHighlight(null);
      updateNodeInfo(null);
    }
  } else {
    state.pinnedTarget = hit;
    applyHighlight(hit);
    updateNodeInfo(hit);
  }
});

// =========================================================
// UI WIRING
// =========================================================

document.getElementById('panel-toggle').addEventListener('click', () => {
  document.body.classList.toggle('panels-hidden');
});

document.querySelectorAll('.sec-title').forEach(t => {
  t.addEventListener('click', () => t.closest('.sec').classList.toggle('open'));
});

document.getElementById('level-btn').addEventListener('click', toggleLevel);
document.getElementById('cycle-btn').addEventListener('click', (ev) => {
  ev.stopPropagation();
  if (state.level === 'B') cycleB(1);
});
document.getElementById('view-reset').addEventListener('click', () => setViewMode('default'));
document.getElementById('view-front').addEventListener('click', () => setViewMode('front'));
document.getElementById('view-top').addEventListener('click', () => setViewMode('top'));

function handleJsonApply() {
  const ta = document.getElementById('json-input');
  const status = document.getElementById('json-status');
  const raw = ta.value.trim();
  if (!raw) {
    status.className = 'err';
    status.textContent = 'Paste JSON first.';
    return;
  }
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    status.className = 'err';
    status.textContent = `JSON parse error: ${e.message}`;
    return;
  }
  try {
    buildArchitectonic(parsed);
    status.className = 'ok';
    status.textContent = `Loaded ${state.squares.length} squares.`;
  } catch (e) {
    console.error(e);
    status.className = 'err';
    status.textContent = `Structure error: ${e.message}`;
  }
}

document.getElementById('json-apply').addEventListener('click', handleJsonApply);

// =========================================================
// RESIZE
// =========================================================

function handleResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  updateOverviewSize();
}
window.addEventListener('resize', handleResize);

// =========================================================
// ANIMATION LOOP
// =========================================================

function animate(now) {
  requestAnimationFrame(animate);

  // Focus camera animation
  if (state.anim.active) {
    const dt = (now - state.anim.lastTime) / 1000;
    state.anim.lastTime = now;
    state.anim.t += dt / state.anim.duration;
    const t = Math.min(state.anim.t, 1);
    const e = t * t * (3 - 2 * t);  // smoothstep
    camera.position.lerpVectors(state.anim.fromCam, state.anim.toCam, e);
    controls.target.lerpVectors(state.anim.fromLook, state.anim.toLook, e);
    if (t >= 1) state.anim.active = false;
  }

  controls.update();

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);

  overviewRenderer.render(overviewScene, overviewCamera);
  overviewLabelRenderer.render(overviewScene, overviewCamera);
}
requestAnimationFrame(animate);
