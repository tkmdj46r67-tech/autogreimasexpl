<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greimas Square — Auto Subterms</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070d; color: #e9edf7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .lbl {
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(0,0,0,0.92), 0 1px 2px rgba(0,0,0,0.9);
  }
  .lbl.main { font-size: 14px; font-weight: 600; }
  .lbl.main b {
    font-weight: 500; font-size: 10px; opacity: 0.55;
    margin-right: 5px; letter-spacing: 0.06em;
  }
  .lbl.mid { font-size: 13px; font-weight: 600; }
  .lbl.mid b {
    font-weight: 500; font-size: 9.5px; opacity: 0.55;
    margin-right: 5px; letter-spacing: 0.06em;
  }
  .lbl.corner { font-size: 12px; font-weight: 500; opacity: 0.92; }
  .lbl.corner b {
    font-weight: 400; font-size: 9px; opacity: 0.55;
    margin-right: 4px; letter-spacing: 0.06em;
  }
  .lbl.layer {
    font-size: 12px; font-weight: 500; font-style: italic; letter-spacing: 0.03em;
  }
  .lbl.layer b {
    font-style: normal; font-weight: 600; font-size: 10.5px;
    margin-right: 5px; opacity: 0.72; letter-spacing: 0.06em;
  }

  #ui {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 10;
    width: 272px;
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    padding: 12px;
    border-radius: 12px;
    background: rgba(9, 13, 22, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    font-size: 12px;
    line-height: 1.4;
  }
  #ui::-webkit-scrollbar { width: 6px; }
  #ui::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 3px; }
  #ui h1 {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #ui h1 span {
    display: inline-block; margin-left: 6px; padding: 1px 5px;
    font-size: 9px; letter-spacing: 0.12em; border-radius: 4px;
    color: #0a0e1c; vertical-align: 2px;
    background: linear-gradient(120deg, #22a884, #fde725);
  }
  .hint {
    margin: 0 0 10px; font-size: 10px; color: #7e8aa8; letter-spacing: 0.02em;
  }

  .sec {
    margin-bottom: 9px; padding-bottom: 7px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .sec:last-of-type { border-bottom: none; margin-bottom: 4px; }
  .sec-title {
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #7e8aa8; margin-bottom: 6px;
  }

  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .row .sym {
    flex: 0 0 36px; font-size: 11px; font-weight: 600; text-align: right;
    letter-spacing: 0.02em;
  }
  .row .sym.dot {
    flex: 0 0 36px; display: flex; justify-content: flex-end;
  }
  .row .sym.dot i {
    display: block; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 8px currentColor;
  }
  .row input {
    flex: 1; min-width: 0; padding: 5px 8px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e9edf7; font: inherit; font-size: 11.5px; outline: none;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s;
  }
  .row input:focus {
    border-color: rgba(126, 160, 255, 0.5);
    background: rgba(126, 160, 255, 0.10);
  }
  .row input[readonly] {
    cursor: default;
    background: rgba(255, 255, 255, 0.02);
    border-color: rgba(255, 255, 255, 0.05);

  .row.sub input { font-size: 10.5px; color: #a8b3cc; }

  .buttons { display: flex; gap: 7px; margin: 8px 0 6px; }

  .legend span { display: inline-flex; align-items: center; gap: 5px; }

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* =====================================================================
   DATA
   ===================================================================== */
const INNER_KEYS = ['s1', 's2', 'ns1', 'ns2'];
const M_KEYS     = ['m1', 'm2', 'm3', 'm4'];
const C_KEYS     = ['c1', 'c2', 'c3', 'c4'];
const ALL_KEYS   = [...INNER_KEYS, ...M_KEYS, ...C_KEYS];

const SYMBOLS = {
  s1: 'S₁', s2: 'S₂', ns1: '~S₁', ns2: '~S₂',
  m1: 'M₁', m2: 'M₂', m3: 'M₃', m4: 'M₄',
  c1: 'C₁', c2: 'C₂', c3: 'C₃', c4: 'C₄',
};

const DEFAULTS = {
  s1:  { name: 'Being',       subs: 'Phenomenon, Noumenon' },
  s2:  { name: 'Seeming',     subs: 'Appearance, Illusion' },
  ns1: { name: 'Non-being',   subs: 'Void, Absence' },
  ns2: { name: 'Non-seeming', subs: 'Invisibility, Latency' },
  m1:  { name: 'Truth',       subs: 'Verity, Authenticity' },
  m2:  { name: 'Lie',         subs: 'Fabrication, Perjury' },
  m3:  { name: 'Falsehood',   subs: 'Error, Fallacy' },
  m4:  { name: 'Secret',      subs: 'Concealment, Mystery' },
  c1:  { name: 'Paradox',     subs: 'Contradiction, Antinomy' },
  c2:  { name: 'Deception',   subs: 'Trickery, Fraud' },
  c3:  { name: 'Subterfuge',  subs: 'Evasion, Stratagem' },
  c4:  { name: 'Revelation',  subs: 'Disclosure, Epiphany' },
};

const state = JSON.parse(JSON.stringify(DEFAULTS));

/* =====================================================================
   LAYER CONFIG
   ===================================================================== */
const Z_DEPTH = 4.2;

const LAYERS = [
  { id: 'back',   sign: -1, hex: 0x414487, text: '#8a8fd4', dim: 0.58, prefix: '−' },
  { id: 'center', sign:  0, hex: 0x22a884, text: '#5bcfa0', dim: 1.00, prefix: ''  },
  { id: 'front',  sign: +1, hex: 0xfde725, text: '#fde725', dim: 0.78, prefix: '+' },
];

/* =====================================================================
   POSITIONS
   ===================================================================== */
const H = 2.0;
const D = 4.5;

const POS = {
  s1:  new THREE.Vector3(-H,  H, 0),
  s2:  new THREE.Vector3( H,  H, 0),
  ns1: new THREE.Vector3(-H, -H, 0),
  ns2: new THREE.Vector3( H, -H, 0),
  m1:  new THREE.Vector3( 0,  D, 0),
  m2:  new THREE.Vector3( D,  0, 0),
  m3:  new THREE.Vector3( 0, -D, 0),
  m4:  new THREE.Vector3(-D,  0, 0),
  c1:  new THREE.Vector3( D,  D, 0),
  c2:  new THREE.Vector3( D, -D, 0),
  c3:  new THREE.Vector3(-D, -D, 0),
  c4:  new THREE.Vector3(-D,  D, 0),
};

function posAt(k, z) {
  const p = POS[k];
  return new THREE.Vector3(p.x, p.y, z);
}

/* =====================================================================
   SUBTERM PROVIDER  —  Datamuse + cache + fallbacks
   ===================================================================== */
const CACHE_KEY = 'greimas-subterm-cache-v1';
const subtermCache = new Map();

(function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    for (const k of Object.keys(obj)) {
      const v = obj[k];
      if (v && typeof v.front === 'string' && typeof v.back === 'string') {
        subtermCache.set(k, v);
      }
    }
  } catch (e) { /* ignore */ }
})();

function persistCache() {
  try {
    const obj = {};
    for (const [k, v] of subtermCache) obj[k] = v;
    localStorage.setItem(CACHE_KEY, JSON.stringify(obj));
  } catch (e) { /* ignore */ }
}

function normalizeTerm(term) {
  return String(term || '').trim().toLowerCase()
    .replace(/[^\w\s-]/g, '').replace(/\s+/g, ' ').trim();
}

function titleCase(s) {
  return s.split(/\s+/)
    .map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w)
    .join(' ');
}

async function fetchDatamuse(rel, term, signal) {
  const url = `https://api.datamuse.com/words?rel=${rel}=${encodeURIComponent(term)}&max=25`;
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error('datamuse ' + res.status);
  return res.json();
}

/* Pick a single-word, non-trivial, unused candidate. */
function pickBest(candidates, query, used) {
  if (!candidates || !candidates.length) return null;
  const q = query.toLowerCase().trim();

  const filtered = [];
  for (const c of candidates) {
    const w = String(c.word || '').toLowerCase().trim();
    if (!w) continue;
    if (w === q) continue;
    if (w.includes(' ')) continue;         // single words only
    if (w === q + 's' || w === q + "'s") continue;
    if (w === q.replace(/s$/, '')) continue;
    if (used.has(w)) continue;
    filtered.push({ word: w, score: c.score || 0 });
  }
  if (!filtered.length) return null;

  filtered.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    return a.word.localeCompare(b.word);
  });
  return filtered[0].word;
}

/* Greimas-flavoured negation fallback for the back layer. */
function fallbackBack(term, used) {
  const t = String(term || '').trim();
  const tries = [];
  if (/^non-/i.test(t)) tries.push(t.replace(/^non-/i, ''));
  if (/^un-/i.test(t))  tries.push(t.replace(/^un-/i, ''));
  tries.push('non-' + t.toLowerCase());
  tries.push('anti-' + t.toLowerCase());
  tries.push('un-' + t.toLowerCase());
  for (const c of tries) {
    if (c && !used.has(c.toLowerCase())) return c;
  }
  return '';
}

/* Resolve every term. Parallel fetches, sequential selection. */
async function resolveAll(termNames, signal) {
  const used = new Set(termNames.map(t => t.toLowerCase().trim()));
  const results = new Map();          // normalized key -> {front, back}

  // 1. Cache hits first
  const uncached = [];
  const seen = new Set();
  for (const t of termNames) {
    const key = normalizeTerm(t);
    if (!key) continue;
    if (seen.has(key)) continue;
    seen.add(key);

    if (subtermCache.has(key)) {
      const r = subtermCache.get(key);
      results.set(key, r);
      if (r.front) used.add(r.front.toLowerCase());
      if (r.back)  used.add(r.back.toLowerCase());
    } else {
      uncached.push(t);
    }
  }

  // 2. Fetch uncached in parallel
  const fetched = await Promise.all(uncached.map(async t => {
    try {
      const [syns, ants] = await Promise.all([
        fetchDatamuse('syn', t, signal).catch(e => { if (e.name === 'AbortError') throw e; return []; }),
        fetchDatamuse('ant', t, signal).catch(e => { if (e.name === 'AbortError') throw e; return []; }),
      ]);
      return { term: t, syns, ants };
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      return { term: t, syns: [], ants: [] };
    }
  }));

  // 3. Select sequentially so `used` stays coherent
  for (const { term, syns, ants } of fetched) {
    if (signal?.aborted) throw new DOMException('aborted', 'AbortError');

    const frontRaw = pickBest(syns, term, used);
    const backRaw  = pickBest(ants, term, used) || fallbackBack(term, used);

    const front = frontRaw ? titleCase(frontRaw) : '';
    const back  = backRaw  ? titleCase(backRaw)  : '';

    if (front) used.add(front.toLowerCase());
    if (back)  used.add(back.toLowerCase());

    const key = normalizeTerm(term);
    const r = { front, back };
    subtermCache.set(key, r);
    results.set(key, r);
  }

  persistCache();
  return results;
}

/* =====================================================================
   SCENE
   ===================================================================== */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 250);
camera.position.set(5.5, 4.0, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, {
  position: 'absolute', top: '0', left: '0',
  pointerEvents: 'none', zIndex: '1'
});
app.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.08;
controls.rotateSpeed     = 0.85;
controls.minDistance     = 5;
controls.maxDistance     = 48;
controls.autoRotateSpeed = 0.9;

/* =====================================================================
   GROUPS
   ===================================================================== */
const structureGroup = new THREE.Group();
const frontGroup     = new THREE.Group();
const backGroup      = new THREE.Group();
const labelGroup     = new THREE.Group();
scene.add(structureGroup, labelGroup, frontGroup, backGroup);

/* =====================================================================
   HELPERS
   ===================================================================== */
const glowTex = (() => {
  const s = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1.0)');
  g.addColorStop(0.30, 'rgba(255,255,255,0.7)');
  g.addColorStop(0.65, 'rgba(255,255,255,0.15)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const lineMaterials = [];

function makeLine(p1, p2, opts = {}) {
  const {
    color = 0xffffff, width = 2, opacity = 1,
    dashed = false, dash = 0.2, gap = 0.15
  } = opts;

  const geo = new LineGeometry();
  geo.setPositions([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z]);

  const mat = new LineMaterial({
    color, linewidth: width,
    transparent: true, opacity,
    dashed, dashSize: dash, gapSize: gap,
    depthWrite: false
  });
  mat.resolution.set(innerWidth, innerHeight);
  lineMaterials.push(mat);

  const line = new Line2(geo, mat);
  line.computeLineDistances();
  return line;
}

function makeDot(pos, color, scale, opacity = 0.95) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color,
    blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity
  }));
  sprite.position.copy(pos);
  sprite.scale.setScalar(scale);
  return sprite;
}

function makeLabel(symbol, name, textColor, cls) {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  el.style.color = textColor;
  const b = document.createElement('b');
  b.textContent = symbol;
  el.append(b, document.createTextNode(name));
  return new CSS2DObject(el);
}

/* =====================================================================
   EDGE TOPOLOGY
   ===================================================================== */
const LAYER_EDGES = [
  { a:'s1',  b:'s2',  width: 2.2, opacity: 1.00, dashed: false },
  { a:'ns1', b:'ns2', width: 2.2, opacity: 1.00, dashed: false },
  { a:'s1',  b:'ns1', width: 2.2, opacity: 1.00, dashed: false },
  { a:'s2',  b:'ns2', width: 2.2, opacity: 1.00, dashed: false },
  { a:'s1',  b:'ns2', width: 2.0, opacity: 0.90, dashed: true, dash: 0.22, gap: 0.16 },
  { a:'s2',  b:'ns1', width: 2.0, opacity: 0.90, dashed: true, dash: 0.22, gap: 0.16 },
  { a:'s1',  b:'m1',  width: 1.5, opacity: 0.65, dashed: true, dash: 0.10, gap: 0.12 },
  { a:'s1',  b:'m4',  width: 1.5, opacity: 0.65, dashed: true, dash: 0.10, gap: 0.12 },
  { a:'s2',  b:'m1',  width: 1.5, opacity: 0.65, dashed: true, dash: 0.10, gap: 0.12 },
  { a:'s2',  b:'m2',  width: 1.5, opacity: 0.65, dashed: true, dash: 0.10, gap: 0.12 },
  { a:'ns1', b:'m4',  width: 1.5, opacity: 0.65, dashed: true, dash: 0.10, gap: 0.12 },
  { a:'ns1', b:'m3',  width: 1.5, opacity: 0.65, dashed: true, dash: 0.10, gap: 0.12 },
  { a:'ns2', b:'m2',  width: 1.5, opacity: 0.65, dashed: true, dash: 0.10, gap: 0.12 },
  { a:'ns2', b:'m3',  width: 1.5, opacity: 0.65, dashed: true, dash: 0.10, gap: 0.12 },
  { a:'c4', b:'c1', width: 1.6, opacity: 0.75, dashed: true, dash: 0.12, gap: 0.13 },
  { a:'c1', b:'c2', width: 1.6, opacity: 0.75, dashed: true, dash: 0.12, gap: 0.13 },
  { a:'c2', b:'c3', width: 1.6, opacity: 0.75, dashed: true, dash: 0.12, gap: 0.13 },
  { a:'c3', b:'c4', width: 1.6, opacity: 0.75, dashed: true, dash: 0.12, gap: 0.13 },
];

/* =====================================================================
   BUILD STATE
   ===================================================================== */
let mainLabels = [];
let subLabels  = [];

const animTargets = {
  front: { materials: [], baseOpacities: [], labels: [] },
  back:  { materials: [], baseOpacities: [], labels: [] },
  cross: [],
};

const anim = { progress: 0, target: 0 };
let labelsOn = true;
let currentAbort = null;

/* =====================================================================
   CLEAR
   ===================================================================== */
function clearGroup(g) {
  g.traverse(obj => {
    if (obj.isLine2) { obj.geometry.dispose(); obj.material.dispose(); }
    if (obj.isSprite && obj.material) obj.material.dispose();
  });
  g.clear();
}

function clearAll() {
  clearGroup(structureGroup);
  clearGroup(frontGroup);
  clearGroup(backGroup);
  clearGroup(labelGroup);

  for (const c of animTargets.cross) {
    scene.remove(c.line);
    c.line.geometry.dispose();
    c.line.material.dispose();
  }
  animTargets.cross.length = 0;
  for (const id of ['front', 'back']) {
    animTargets[id].materials.length = 0;
    animTargets[id].baseOpacities.length = 0;
    animTargets[id].labels.length = 0;
  }
  lineMaterials.length = 0;
}

/* =====================================================================
   BUILD
   ===================================================================== */
function build() {
  clearAll();
  mainLabels = [];
  subLabels  = [];

  /* ---------- CENTER LAYER ---------- */
  const center = LAYERS.find(L => L.id === 'center');

  for (const e of LAYER_EDGES) {
    structureGroup.add(makeLine(posAt(e.a, 0), posAt(e.b, 0), {
      color: center.hex,
      width: e.width,
      opacity: e.opacity,
      dashed: e.dashed,
      dash: e.dash || 0.2,
      gap: e.gap || 0.15
    }));
  }

  for (const k of ALL_KEYS) {
    const isInner = INNER_KEYS.includes(k);
    structureGroup.add(makeDot(posAt(k, 0), center.hex, isInner ? 0.72 : 0.55, 0.95));
  }

  for (const k of ALL_KEYS) {
    const p = posAt(k, 0);
    let dir, cls;
    if (INNER_KEYS.includes(k)) {
      dir = new THREE.Vector3(p.x, p.y, 0).normalize();
      cls = 'main';
    } else {
      dir = new THREE.Vector3(-p.x, -p.y, 0).normalize();
      cls = M_KEYS.includes(k) ? 'mid' : 'corner';
    }
    const label = makeLabel(SYMBOLS[k], state[k].name, center.text, cls);
    label.position.copy(p).addScaledVector(dir, 0.5);
    labelGroup.add(label);
    mainLabels.push(label);
  }

  /* ---------- FRONT + BACK LAYERS ---------- */
  for (const layer of LAYERS) {
    if (layer.id === 'center') continue;

    const group = layer.id === 'front' ? frontGroup : backGroup;
    const slot  = animTargets[layer.id];

    group.position.z = 0;
    group.scale.setScalar(1);

    for (const e of LAYER_EDGES) {
      const line = makeLine(posAt(e.a, 0), posAt(e.b, 0), {
        color: layer.hex,
        width: e.width * 0.94,
        opacity: e.opacity * layer.dim,
        dashed: e.dashed,
        dash: e.dash || 0.2,
        gap: e.gap || 0.15
      });
      group.add(line);
      slot.materials.push(line.material);
      slot.baseOpacities.push(e.opacity * layer.dim);
    }

    for (const k of ALL_KEYS) {
      const isInner = INNER_KEYS.includes(k);
      const p = posAt(k, 0);

      const dot = makeDot(p, layer.hex, isInner ? 0.42 : 0.34, layer.dim);
      group.add(dot);
      slot.materials.push(dot.material);
      slot.baseOpacities.push(layer.dim);

      const subs = (state[k].subs || '')
        .split(',').map(s => s.trim()).filter(Boolean);
      const subName = layer.id === 'front' ? (subs[0] || '') : (subs[1] || '');

      if (subName) {
        const dir = isInner
          ? new THREE.Vector3(p.x, p.y, 0).normalize()
          : new THREE.Vector3(-p.x, -p.y, 0).normalize();

        const label = makeLabel(
          layer.prefix + SYMBOLS[k],
          subName,
          layer.text,
          'layer'
        );
        label.position.copy(p).addScaledVector(dir, isInner ? 0.5 : 0.4);
        group.add(label);
        subLabels.push(label);
        slot.labels.push(label);
      }

      const pC = posAt(k, 0);
      const line = makeLine(pC, pC, {
        color: layer.hex,
        width: 1.1,
        opacity: 0.30 * layer.dim,
        dashed: true,
        dash: 0.08,
        gap: 0.11
      });
      scene.add(line);
      animTargets.cross.push({
        line, key: k, sign: layer.sign,
        baseOpacity: 0.30 * layer.dim,
      });
    }
  }

  applyExpandState(1);
  applyVisibility();
}

/* =====================================================================
   EXPAND / COLLAPSE
   ===================================================================== */
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

function applyExpandState(flickerFactor) {
  const e = easeOutCubic(anim.progress);

  frontGroup.position.z = e * Z_DEPTH;
  backGroup.position.z  = -e * Z_DEPTH;

  const scale = 0.86 + 0.14 * e;
  frontGroup.scale.setScalar(scale);
  backGroup.scale.setScalar(scale);

  const layersVisible = e > 0.005;
  frontGroup.visible = layersVisible;
  backGroup.visible  = layersVisible;

  for (const id of ['front', 'back']) {
    const slot = animTargets[id];
    for (let i = 0; i < slot.materials.length; i++) {
      slot.materials[i].opacity = slot.baseOpacities[i] * e * flickerFactor;
    }
    for (const lbl of slot.labels) {
      const op = Math.min(1, e * flickerFactor);
      lbl.element.style.opacity = op.toFixed(3);
      lbl.visible = labelsOn && op > 0.06;
    }
  }

  for (const c of animTargets.cross) {
    const pC = posAt(c.key, 0);
    const pL = posAt(c.key, c.sign * e * Z_DEPTH);
    c.line.geometry.setPositions([pC.x, pC.y, pC.z, pL.x, pL.y, pL.z]);
    c.line.computeLineDistances();
    c.line.material.opacity = c.baseOpacity * e * flickerFactor;
    c.line.visible = layersVisible;
  }
}

function updateExpandAnimation(dt) {
  const delta = anim.target - anim.progress;
  const transitioning = Math.abs(delta) > 0.001;

  if (transitioning) {
    const speed = 1.45;
    const step = Math.sign(delta) * Math.min(Math.abs(delta), speed * dt);
    anim.progress += step;
  } else {
    anim.progress = anim.target;
  }

  const stillTransitioning = Math.abs(anim.target - anim.progress) > 0.001;

  let flicker = 1;
  if (stillTransitioning) {
    if (Math.random() < 0.08) {
      flicker = 0;
    } else {
      flicker = 0.5 + Math.random() * 0.7;
    }
    const settle = 1 - Math.min(1, Math.abs(delta) * 2.5);
    flicker = 1 + (flicker - 1) * (1 - settle * 0.35);
  }

  applyExpandState(flicker);
}

/* =====================================================================
   VISIBILITY
   ===================================================================== */
const toggleAuto    = document.getElementById('t-auto');
const toggleLabels  = document.getElementById('t-labels');
const toggleRotate  = document.getElementById('t-rotate');
const expandBtn     = document.getElementById('expand');
const expandLabel   = document.getElementById('expand-label');
const applyBtn      = document.getElementById('apply');

function applyVisibility() {
  labelsOn = toggleLabels.checked;
  for (const l of mainLabels) l.visible = labelsOn;
}

function updateExpandButton() {
  const expanded = anim.target === 1;
  expandBtn.classList.toggle('expanded', expanded);
  expandLabel.textContent = expanded ? 'Collapse' : 'Expand';
}

expandBtn.addEventListener('click', () => {
  anim.target = anim.target === 1 ? 0 : 1;
  updateExpandButton();
});

toggleLabels.addEventListener('change', applyVisibility);
toggleRotate.addEventListener('change', () => {
  controls.autoRotate = toggleRotate.checked;
});

/* =====================================================================
   INPUTS
   ===================================================================== */
const inputs = {};
document.querySelectorAll('#ui input[data-k]').forEach(el => {
  const k = el.dataset.k, f = el.dataset.f;
  if (!inputs[k]) inputs[k] = {};
  inputs[k][f] = el;
});

function syncInputsFromState() {
  for (const k of ALL_KEYS) {
    if (inputs[k]?.name) inputs[k].name.value = state[k].name || '';
    if (inputs[k]?.subs) inputs[k].subs.value = state[k].subs || '';
  }
}

function syncSubsFromState() {
  for (const k of ALL_KEYS) {
    if (inputs[k]?.subs) inputs[k].subs.value = state[k].subs || '';
  }
}

function applyAutoState() {
  const auto = toggleAuto.checked;
  for (const k of ALL_KEYS) {
    if (inputs[k]?.subs) {
      inputs[k].subs.readOnly = auto;
      inputs[k].subs.placeholder = auto
        ? 'auto-generated on update'
        : 'front, back';
    }
  }
}

toggleAuto.addEventListener('change', applyAutoState);

/* =====================================================================
   APPLY
   ===================================================================== */
function setButtonLoading(on) {
  applyBtn.disabled = on;
  applyBtn.textContent = on ? 'Resolving…' : 'Update';
}

async function applyInputs() {
  // 1. Read names
  for (const k of ALL_KEYS) {
    if (inputs[k]?.name) {
      const v = inputs[k].name.value.trim();
      state[k].name = v || DEFAULTS[k].name;
    }
  }

  const auto = toggleAuto.checked;

  if (!auto) {
    // Manual mode
    for (const k of ALL_KEYS) {
      if (inputs[k]?.subs) {
        state[k].subs = inputs[k].subs.value.trim();
      }
    }
    build();
    return;
  }

  // 2. Auto mode — resolve subterms
  if (currentAbort) currentAbort.abort();
  currentAbort = new AbortController();
  const signal = currentAbort.signal;

  setButtonLoading(true);
  try {
    const names = ALL_KEYS.map(k => state[k].name);
    const resolved = await resolveAll(names, signal);

    for (const k of ALL_KEYS) {
      const key = normalizeTerm(state[k].name);
      const r = resolved.get(key);
      if (r) {
        const parts = [r.front, r.back].filter(Boolean);
        state[k].subs = parts.join(', ');
      } else {
        state[k].subs = '';
      }
    }

    syncSubsFromState();
    build();
  } catch (e) {
    if (e.name !== 'AbortError') console.error('[subterms]', e);
  } finally {
    if (!signal.aborted) setButtonLoading(false);
  }
}

applyBtn.addEventListener('click', applyInputs);

document.getElementById('reset').addEventListener('click', () => {
  for (const k of ALL_KEYS) {
    state[k].name = DEFAULTS[k].name;
    state[k].subs = DEFAULTS[k].subs;
  }
  syncInputsFromState();
  build();
});

document.querySelectorAll('#ui input[data-k]').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      applyInputs();
      el.blur();
    }
  });
});

document.getElementById('clear-cache').addEventListener('click', () => {
  subtermCache.clear();
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
});

/* =====================================================================
   RESIZE
   ===================================================================== */
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  lineMaterials.forEach(m => m.resolution.set(w, h));
}
addEventListener('resize', onResize);

/* =====================================================================
   LOOP
   ===================================================================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  updateExpandAnimation(dt);
  controls.update();

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* =====================================================================
   BOOT
   ===================================================================== */
syncInputsFromState();
applyAutoState();
build();
updateExpandButton();
animate();
</script>
</body>
</html>
