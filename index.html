<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greimas Squares — Nested</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070d; color: #e9edf7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .lbl {
    pointer-events: none; user-select: none; white-space: nowrap;
    text-shadow: 0 0 8px rgba(0,0,0,0.92), 0 1px 2px rgba(0,0,0,0.9);
    color: #fff;
  }
  .lbl.main { font-size: 13px; font-weight: 600; }
  .lbl.main b { font-weight: 500; font-size: 9.5px; opacity: 0.55; margin-right: 5px; letter-spacing: 0.06em; }
  .lbl.mid { font-size: 12px; font-weight: 600; }
  .lbl.mid b { font-weight: 500; font-size: 9px; opacity: 0.55; margin-right: 5px; letter-spacing: 0.06em; }
  .lbl.corner { font-size: 11px; font-weight: 500; opacity: 0.92; }
  .lbl.corner b { font-weight: 400; font-size: 8.5px; opacity: 0.55; margin-right: 4px; letter-spacing: 0.06em; }
  .lbl.layer { font-size: 11px; font-weight: 500; font-style: italic; letter-spacing: 0.03em; }
  .lbl.layer b { font-style: normal; font-weight: 600; font-size: 10px; margin-right: 5px; opacity: 0.72; letter-spacing: 0.06em; }

  #ui {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    width: 340px; max-height: calc(100vh - 28px); overflow-y: auto;
    padding: 14px 16px; border-radius: 12px;
    background: rgba(9, 13, 22, 0.90);
    border: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    font-size: 12px; line-height: 1.4;
  }
  #ui::-webkit-scrollbar { width: 7px; }
  #ui::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 4px; }
  #ui h1 { margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  #ui h1 span {
    display: inline-block; margin-left: 6px; padding: 1px 5px;
    font-size: 9px; letter-spacing: 0.12em; border-radius: 4px;
    color: #0a0e1c; vertical-align: 2px;
    background: linear-gradient(120deg, #4C8A8A, #A9D583);
  }
  .hint { margin: 0 0 12px; font-size: 10px; color: #7e8aa8; }

  #current {
    margin: 0 0 10px; padding: 10px 12px;
    border-radius: 8px;
    background: rgba(126,160,255,0.10);
    border: 1px solid rgba(126,160,255,0.25);
    font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: #cfe0ff;
  }
  #current .sub {
    display: block; margin-top: 2px; font-size: 10.5px; font-weight: 400;
    color: #8a96b4; letter-spacing: 0.04em;
  }
  #current .anchor-note {
    display: block; margin-top: 4px; font-size: 10px; font-weight: 400;
    color: #6fa8ff; letter-spacing: 0.04em;
  }

  .group { margin: 0 0 8px; padding: 0 0 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .group:last-of-type { border-bottom: none; padding-bottom: 0; }
  .group-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #7e8aa8; margin: 0 0 6px 2px;
  }
  .group-label i {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    flex: 0 0 auto; box-shadow: 0 0 6px currentColor;
  }
  .btn-row { display: flex; gap: 4px; margin-bottom: 4px; }
  .btn-row:last-child { margin-bottom: 0; }
  .btn-row .indent {
    flex: 0 0 36px; font-size: 9px; letter-spacing: 0.08em; color: #5f6a86;
    display: flex; align-items: center; padding-right: 4px; justify-content: flex-end;
  }
  .btn-row button {
    flex: 1; padding: 6px 4px; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 10.5px; letter-spacing: 0.04em; color: #c8d0e6;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-row button:hover:not(:disabled) {
    background: rgba(126,160,255,0.16);
    border-color: rgba(126,160,255,0.4); color: #fff;
  }
  .btn-row button.active {
    background: rgba(126,160,255,0.28);
    border-color: rgba(126,160,255,0.7);
    color: #fff; font-weight: 600;
  }
  .btn-row button:disabled { opacity: 0.4; cursor: progress; }

  /* Swatch dot inside the L1 buttons, colored by group */
  .btn-row button .grp {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    margin-right: 5px;
    vertical-align: 1px;
    box-shadow: 0 0 5px currentColor;
  }

  #overview {
    width: 100%; padding: 9px 10px; margin: 6px 0 10px;
    border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #b6f0ff;
    background: linear-gradient(135deg, rgba(56,189,248,0.16), rgba(167,139,250,0.14));
    border: 1px solid rgba(56,189,248,0.42);
  }
  #overview:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(56,189,248,0.30), rgba(167,139,250,0.24));
    border-color: rgba(56,189,248,0.75);
  }
  #overview:disabled { opacity: 0.4; cursor: progress; }

  .sec { margin-bottom: 4px; }
  .sec-title {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding: 8px 2px; cursor: pointer; user-select: none;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #7e8aa8;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .sec-title:hover { color: #a3adff; }
  .sec-title .chev { display: inline-block; font-size: 9px; opacity: 0.65; transition: transform 0.28s ease; }
  .sec.collapsed .sec-title .chev { transform: rotate(-90deg); }
  .sec-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.28s ease; }
  .sec.collapsed .sec-body { grid-template-rows: 0fr; }
  .sec-clip { overflow: hidden; min-height: 0; }
  .sec-content { padding: 6px 0 4px; }

  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .row .sym { flex: 0 0 42px; font-size: 11px; font-weight: 600; text-align: right; }
  .row .sym.dot { flex: 0 0 42px; display: flex; justify-content: flex-end; }
  .row .sym.dot i {
    display: block; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 6px currentColor;
  }
  .row input {
    flex: 1; min-width: 0; padding: 5px 9px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e9edf7; font: inherit; font-size: 11.5px; outline: none;
  }
  .row input:focus { border-color: rgba(126, 160, 255, 0.5); background: rgba(126, 160, 255, 0.10); }
  .row.sub input { font-size: 10.5px; color: #a8b3cc; }
  .row.sub { margin-bottom: 7px; }

  .buttons { display: flex; gap: 7px; margin: 10px 0 6px; }
  button {
    flex: 1; padding: 8px 4px; border-radius: 7px; cursor: pointer;
    font: inherit; font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: #e9edf7;
    background: rgba(126, 160, 255, 0.18);
    border: 1px solid rgba(126, 160, 255, 0.4);
  }
  button:hover:not(:disabled) { background: rgba(126, 160, 255, 0.32); }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.ghost {
    flex: 0 0 78px;
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.10);
  }
  button.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.11); }

  .export-row { display: flex; gap: 7px; margin: 0 0 6px; }
  .export-row button {
    flex: 1; padding: 8px 4px; border-radius: 7px; cursor: pointer;
    font: inherit; font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: #b8e8c4;
    background: linear-gradient(135deg, rgba(34,168,132,0.14), rgba(110,200,140,0.08));
    border: 1px solid rgba(34,168,132,0.4);
    transition: background 0.15s, border-color 0.15s;
  }
  .export-row button:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(34,168,132,0.28), rgba(110,200,140,0.16));
    border-color: rgba(34,168,132,0.75);
    color: #e6fff0;
  }
  .export-row button:disabled { opacity: 0.4; cursor: not-allowed; }

  #expand {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 9px 12px; margin: 0 0 8px;
    border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #fde725;
    background: linear-gradient(135deg, rgba(34,168,132,0.18), rgba(253,231,37,0.10));
    border: 1px solid rgba(253,231,37,0.35);
  }
  #expand.expanded {
    color: #a3adff;
    background: linear-gradient(135deg, rgba(65,68,135,0.30), rgba(34,168,132,0.14));
    border-color: rgba(65,68,135,0.55);
  }
  #expand:disabled { opacity: 0.35; cursor: not-allowed; }

  .toggles {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .toggles label {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 8px; border-radius: 7px; cursor: pointer; user-select: none;
    font-size: 10px; letter-spacing: 0.03em;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .toggles label:hover { background: rgba(255, 255, 255, 0.09); }
  .toggles input { display: none; }
  .toggles label:has(input:checked) {
    background: rgba(126, 160, 255, 0.16);
    border-color: rgba(126, 160, 255, 0.4);
    color: #fff;
  }

  .footer-link {
    margin-top: 8px; font-size: 9.5px; letter-spacing: 0.04em;
    color: #5f6a86; text-align: right;
  }
  .footer-link a { color: #7e8aa8; cursor: pointer; text-decoration: none; border-bottom: 1px dotted rgba(126,138,168,0.4); }
  .footer-link a:hover { color: #a3adff; }
</style>
</head>
<body>

<div id="app"></div>

<div id="ui">
  <h1>Greimas Squares<span>Nested</span></h1>
  <p class="hint">drag to orbit · scroll to zoom</p>

  <div id="current"></div>
  <button id="overview">Overview</button>

  <div class="group">
    <div class="group-label"><i style="background:#FF7A45;color:#FF7A45"></i>L3 · Narrative</div>
    <div class="btn-row" id="row-L3"></div>
  </div>
  <div class="group">
    <div class="group-label"><i style="background:#FDE725;color:#FDE725"></i>L2 · Argument</div>
    <div class="btn-row" id="row-L2"></div>
  </div>
  <div class="group">
    <div class="group-label"><i style="background:#6DD4C4;color:#6DD4C4"></i>L1 · Proposition</div>
    <div id="l1-rows"></div>
  </div>

  <div class="buttons">
    <button id="apply">Update</button>
    <button id="reset" class="ghost">Reset All</button>
  </div>

  <div class="export-row">
    <button id="export-current">Export current diagram</button>
    <button id="export-all">Export all</button>
  </div>

  <button id="expand"><span class="chev">▸</span><span id="expand-label">Expand</span></button>

  <div class="sec collapsed" data-sec>
    <div class="sec-title"><span>Inner Square</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-clip"><div class="sec-content">
      <div class="row"><span class="sym" style="color:#5bcfa0">S₁</span><input type="text" data-k="s1" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="s1" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">S₂</span><input type="text" data-k="s2" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="s2" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">~S₁</span><input type="text" data-k="ns1" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="ns1" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">~S₂</span><input type="text" data-k="ns2" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="ns2" data-f="subs" placeholder="syn, ant"></div>
    </div></div></div>
  </div>

  <div class="sec collapsed" data-sec>
    <div class="sec-title"><span>Outer Midpoints</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-clip"><div class="sec-content">
      <div class="row"><span class="sym" style="color:#5bcfa0">M₁</span><input type="text" data-k="m1" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="m1" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">M₂</span><input type="text" data-k="m2" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="m2" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">M₃</span><input type="text" data-k="m3" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="m3" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">M₄</span><input type="text" data-k="m4" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="m4" data-f="subs" placeholder="syn, ant"></div>
    </div></div></div>
  </div>

  <div class="sec collapsed" data-sec>
    <div class="sec-title"><span>Outer Corners</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-clip"><div class="sec-content">
      <div class="row"><span class="sym" style="color:#5bcfa0">C₁</span><input type="text" data-k="c1" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="c1" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">C₂</span><input type="text" data-k="c2" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="c2" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">C₃</span><input type="text" data-k="c3" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="c3" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">C₄</span><input type="text" data-k="c4" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="c4" data-f="subs" placeholder="syn, ant"></div>
    </div></div></div>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="t-labels" checked><span>Labels</span></label>
    <label><input type="checkbox" id="t-rotate"><span>Rotate</span></label>
  </div>

  <div class="footer-link"><a id="clear-cache">clear word cache</a></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* =====================================================================
   CONSTANTS
   ===================================================================== */
const INNER_KEYS = ['s1','s2','ns1','ns2'];
const M_KEYS     = ['m1','m2','m3','m4'];
const C_KEYS     = ['c1','c2','c3','c4'];
const ALL_KEYS   = [...INNER_KEYS, ...M_KEYS, ...C_KEYS];

const SYMBOLS = {
  s1:'S₁', s2:'S₂', ns1:'~S₁', ns2:'~S₂',
  m1:'M₁', m2:'M₂', m3:'M₃', m4:'M₄',
  c1:'C₁', c2:'C₂', c3:'C₃', c4:'C₄',
};

const DIAGRAM_P = { s1:'P1', s2:'P2', ns1:'P3', ns2:'P4' };
/* Order of corner keys by P index — used for tree-link targets */
const P_CORNER_KEYS = ['s1', 's2', 'ns1', 'ns2'];

const SIDE    = { 3: 120, 2: 60, 1: 30 };
const Z_PLANE = { 3: 400, 2: 200, 1: 0 };

/* ---------------------------------------------------------------------
   Colors
   ---------------------------------------------------------------------
   L3 and L2 use a single fixed triple (center/front/back).
   L1 diagrams are color-coded by their L2 parent group:
     D1–D4   → group 0   (children of L2 D1)
     D5–D8   → group 1   (children of L2 D2)
     D9–D12  → group 2   (children of L2 D3)
     D13–D16 → group 3   (children of L2 D4)
   Each group has a distinct center color sampled from the mako family
   (blue → teal → green → yellow-green). Front and back layers are
   derived as lighter / darker variants of that same hue.
   --------------------------------------------------------------------- */
const L3_COLORS = { center: 0xFF7A45, front: 0xFFBB7A, back: 0xC7477A };
const L2_COLORS = { center: 0xFDE725, front: 0xFF9A3D, back: 0x7ECB65 };

const L1_GROUP_CENTERS = [
  0x4C6EAF,   // group 0 — medium blue
  0x4C9BA5,   // group 1 — teal
  0x70C89A,   // group 2 — green-teal
  0xA9D583,   // group 3 — yellow-green
];

function l1TripleFor(index) {
  const group = Math.floor(index / 4);
  const center = L1_GROUP_CENTERS[group];
  const c = new THREE.Color(center);
  const hsl = {};
  c.getHSL(hsl);
  const front = new THREE.Color().setHSL(
    hsl.h + 0.03,
    Math.max(0, hsl.s - 0.15),
    Math.min(0.88, hsl.l + 0.22)
  );
  const back = new THREE.Color().setHSL(
    hsl.h - 0.06,
    Math.min(1, hsl.s + 0.05),
    Math.max(0.18, hsl.l - 0.20)
  );
  return { center, front: front.getHex(), back: back.getHex() };
}

function layerTripleFor(level, index) {
  if (level === 1) return l1TripleFor(index);
  if (level === 2) return L2_COLORS;
  return L3_COLORS;
}

function centerColorFor(level, index) {
  return layerTripleFor(level, index).center;
}

function l1GroupColor(index) {
  return L1_GROUP_CENTERS[Math.floor(index / 4)];
}

const LEVEL_NAMES = { 3: 'Narrative', 2: 'Argument', 1: 'Proposition' };

function hexOf(c) { return '#' + c.toString(16).padStart(6, '0'); }

const SPREAD = 2.2;

const GREIMAS_LOCAL = {
  s1:  new THREE.Vector3(-2,  2, 0),
  s2:  new THREE.Vector3( 2,  2, 0),
  ns1: new THREE.Vector3(-2, -2, 0),
  ns2: new THREE.Vector3( 2, -2, 0),
  m1:  new THREE.Vector3( 0,  4.5, 0),
  m2:  new THREE.Vector3( 4.5, 0, 0),
  m3:  new THREE.Vector3( 0, -4.5, 0),
  m4:  new THREE.Vector3(-4.5, 0, 0),
  c1:  new THREE.Vector3( 4.5,  4.5, 0),
  c2:  new THREE.Vector3( 4.5, -4.5, 0),
  c3:  new THREE.Vector3(-4.5, -4.5, 0),
  c4:  new THREE.Vector3(-4.5,  4.5, 0),
};
const GREIMAS_EXTENT = 9;
const GREIMAS_INNER  = 4;

const LAYER_Z = 2.7;

const EDGES = [
  { a:'s1',  b:'s2',  kind:'solid' },
  { a:'ns1', b:'ns2', kind:'solid' },
  { a:'s1',  b:'ns1', kind:'solid' },
  { a:'s2',  b:'ns2', kind:'solid' },
  { a:'s1',  b:'ns2', kind:'dashed' },
  { a:'s2',  b:'ns1', kind:'dashed' },
  { a:'s1',  b:'m1',  kind:'faint' },
  { a:'s1',  b:'m4',  kind:'faint' },
  { a:'s2',  b:'m1',  kind:'faint' },
  { a:'s2',  b:'m2',  kind:'faint' },
  { a:'ns1', b:'m4',  kind:'faint' },
  { a:'ns1', b:'m3',  kind:'faint' },
  { a:'ns2', b:'m2',  kind:'faint' },
  { a:'ns2', b:'m3',  kind:'faint' },
  { a:'c4', b:'c1', kind:'faint' },
  { a:'c1', b:'c2', kind:'faint' },
  { a:'c2', b:'c3', kind:'faint' },
  { a:'c3', b:'c4', kind:'faint' },
];
const OPACITY = { solid: 0.95, dashed: 0.55, faint: 0.32 };

const EDGE_POSITIONS_BY_KIND = {};
const EDGE_KINDS = ['solid','dashed','faint'];
for (const kind of EDGE_KINDS) {
  const kindEdges = EDGES.filter(e => e.kind === kind);
  const positions = new Float32Array(kindEdges.length * 6);
  let p = 0;
  for (const e of kindEdges) {
    const a = GREIMAS_LOCAL[e.a];
    const b = GREIMAS_LOCAL[e.b];
    positions[p++] = a.x; positions[p++] = a.y; positions[p++] = a.z;
    positions[p++] = b.x; positions[p++] = b.y; positions[p++] = b.z;
  }
  EDGE_POSITIONS_BY_KIND[kind] = positions;
}

const POS_ORDER = ['s1','s2','ns1','ns2','m1','m2','m3','m4','c1','c2','c3','c4'];

  m1:  { name:'Truth',       syn:'Verity',       ant:'Falsehood' },
  m2:  { name:'Lie',         syn:'Fabrication',  ant:'Truth' },
  m3:  { name:'Falsehood',   syn:'Error',        ant:'Truth' },
  m4:  { name:'Secret',      syn:'Concealment',  ant:'Disclosure' },
  c1:  { name:'Paradox',     syn:'Contradiction',ant:'Consistency' },
  c2:  { name:'Deception',   syn:'Trickery',     ant:'Honesty' },

function blankDiagram() {
  const d = {};
  for (const k of ALL_KEYS) d[k] = { name:'', syn:'', ant:'' };
  return d;
}
function defaultDiagram() {
  const d = {};
  for (const k of ALL_KEYS) d[k] = {
    name: DEFAULTS[k].name, syn: DEFAULTS[k].syn, ant: DEFAULTS[k].ant,
  };
  return d;
}

/* =====================================================================
   LAYOUT
   ===================================================================== */
function scaleFor(L) { return SIDE[L] / GREIMAS_EXTENT; }
function innerHalf(L) { return (GREIMAS_INNER * scaleFor(L)) / 2; }

const P_LOCAL = [
  { x: -1, y:  1, label: 'P1' },
  { x:  1, y:  1, label: 'P2' },
  { x: -1, y: -1, label: 'P3' },
  { x:  1, y: -1, label: 'P4' },
];

const LAYOUT = {};

LAYOUT['3-0'] = {
  level: 3, index: 0,
  center: new THREE.Vector3(0, 0, Z_PLANE[3]),
  scale: scaleFor(3),
};

for (let i = 0; i < 4; i++) {
  const p = P_LOCAL[i];
  const off = innerHalf(3) * SPREAD;
  LAYOUT[`2-${i}`] = {
    level: 2, index: i,
    parentKey: '3-0', parentCorner: i,
    center: new THREE.Vector3(p.x * off, p.y * off, Z_PLANE[2]),
    scale: scaleFor(2),
  };
}

for (let i = 0; i < 4; i++) {
  for (let j = 0; j < 4; j++) {
    const p = P_LOCAL[j];
    const off = innerHalf(2) * SPREAD;
    const parent = LAYOUT[`2-${i}`];
    const idx = i * 4 + j;
    LAYOUT[`1-${idx}`] = {
      level: 1, index: idx,
      parentKey: `2-${i}`, parentCorner: j,
      center: new THREE.Vector3(
        parent.center.x + p.x * off,
        parent.center.y + p.y * off,
        Z_PLANE[1]
      ),
      scale: scaleFor(1),
    };
  }
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function makePoint(pos, color, radius) {
  const geo = new THREE.SphereGeometry(radius, 10, 6);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 1, depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  return mesh;
}

function makeLabel(symbol, name, textColor, cls) {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  el.style.color = textColor;
  const b = document.createElement('b');
  b.textContent = symbol;
  el.append(b, document.createTextNode(name));
  return new CSS2DObject(el);
}

/* =====================================================================
   DIAGRAM BUILDER
   ===================================================================== */
function buildDiagram(layout) {
  const { level, index, center, scale } = layout;
  const colors = layerTripleFor(level, index);

  const group = new THREE.Group();
  group.position.copy(center);
  group.scale.setScalar(scale);
  scene.add(group);

  const centerGroup = new THREE.Group();
  const frontGroup  = new THREE.Group();
  const backGroup   = new THREE.Group();
  group.add(centerGroup, frontGroup, backGroup);

  const dotR = level === 3 ? 0.30 : level === 2 ? 0.24 : 0.20;

  function fillLayer(g, layerColor) {
    const edgeMats = [];
    for (const kind of EDGE_KINDS) {
      const positions = EDGE_POSITIONS_BY_KIND[kind];
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const op = OPACITY[kind];
      const mat = new THREE.LineBasicMaterial({
        color: layerColor, transparent: true, opacity: op, depthWrite: false,
      });
      const seg = new THREE.LineSegments(geo, mat);
      g.add(seg);
      edgeMats.push({ mat, base: op });
    }

    const pointMats = [];
    for (const k of ALL_KEYS) {
      const isInner = INNER_KEYS.includes(k);
      const pos = GREIMAS_LOCAL[k].clone();
      const mesh = makePoint(pos, layerColor, isInner ? dotR : dotR * 0.75);
      g.add(mesh);
      pointMats.push({ mat: mesh.material, base: 1 });
    }

    return { edgeMats, pointMats };
  }

  const centerMats = fillLayer(centerGroup, colors.center);
  const frontMats  = fillLayer(frontGroup,  colors.front);
  const backMats   = fillLayer(backGroup,   colors.back);

  frontGroup.position.z = 0;
  backGroup.position.z  = 0;

  return {
    key: `${level}-${index}`,
    layout,
    level, index,
    group, scale, center: center.clone(),
    centerGroup, frontGroup, backGroup,
    centerMats, frontMats, backMats,
    outerAlpha: 0,
    expansion: 0,
    expansionTarget: 0,
    centerLabels: [],
    frontLabels:  [],
    backLabels:   [],
  };
}

const diagrams = {};
for (const key of Object.keys(LAYOUT)) {
  diagrams[key] = buildDiagram(LAYOUT[key]);
}

/* =====================================================================
   TREE LINKS
   ---------------------------------------------------------------------
   Each child diagram connects from its own P4 corner to the P-corner
   of its parent where it is anchored. So L1 D1 → from L1 D1's P4 to
   L2 D1's P1; L1 D2 → from L1 D2's P4 to L2 D1's P2; etc.
   ===================================================================== */
const treeGroup = new THREE.Group();
scene.add(treeGroup);
const treeLinks = [];

for (const key of Object.keys(LAYOUT)) {
  const lo = LAYOUT[key];
  if (!lo.parentKey) continue;

  const parent = LAYOUT[lo.parentKey];

  /* Child source point — its own P4 corner, in world coords */
  const childLocal = GREIMAS_LOCAL.ns2;
  const startWorld = new THREE.Vector3(
    lo.center.x + childLocal.x * lo.scale,
    lo.center.y + childLocal.y * lo.scale,
    lo.center.z + childLocal.z * lo.scale
  );

  /* Parent target — the P-corner it anchors to, in world coords */
  const parentCornerKey = P_CORNER_KEYS[lo.parentCorner];
  const parentLocal = GREIMAS_LOCAL[parentCornerKey];
  const endWorld = new THREE.Vector3(
    parent.center.x + parentLocal.x * parent.scale,
    parent.center.y + parentLocal.y * parent.scale,
    parent.center.z + parentLocal.z * parent.scale
  );

  const geo = new THREE.BufferGeometry().setFromPoints([startWorld, endWorld]);
  const mat = new THREE.LineBasicMaterial({
    color: centerColorFor(lo.level, lo.index),
    transparent: true, opacity: 0, depthWrite: false,
  });
  const line = new THREE.Line(geo, mat);
  treeGroup.add(line);
  treeLinks.push({ line, opacity: 0 });
}

/* =====================================================================
   DATA PER DIAGRAM
   ===================================================================== */
const diagramData = {};
for (const key of Object.keys(LAYOUT)) {
  diagramData[key] = (key === '1-0') ? defaultDiagram() : blankDiagram();
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
let currentKey = '1-0';
let fadeState  = 'steady';
let flight     = null;
let labelFade  = 1;

const STATE0_DIR = new THREE.Vector3(0.55, 0.42, 0.72).normalize();

function state0Offset(key) {
  const d = diagrams[key];
  return STATE0_DIR.clone().multiplyScalar(d.scale * GREIMAS_EXTENT * 2.2);
}

function easeInOutCubic(x) {
  return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
}

function startFlight(endTarget, endOffset, duration, onArrive) {
  const startTarget = controls.target.clone();
  const startOffset = camera.position.clone().sub(startTarget);
  const s0 = new THREE.Spherical().setFromVector3(startOffset);
  const s1 = new THREE.Spherical().setFromVector3(endOffset);

  let dTheta = s1.theta - s0.theta;
  while (dTheta >  Math.PI) dTheta -= 2 * Math.PI;
  while (dTheta < -Math.PI) dTheta += 2 * Math.PI;

  flight = {
    startTarget, endTarget,
    s0: { r: s0.radius, phi: s0.phi, theta: s0.theta },
    s1: { r: s1.radius, phi: s1.phi, theta: s0.theta + dTheta },
    startTime: performance.now(),
    duration: duration * 1000,
    onArrive,
  };
  controls.enabled = false;
}

function updateFlight(now) {
  if (!flight) return;

  const t = Math.min(1, (now - flight.startTime) / flight.duration);
  const e = easeInOutCubic(t);

  const targetNow = flight.startTarget.clone().lerp(flight.endTarget, e);
  const r     = flight.s0.r     + (flight.s1.r     - flight.s0.r)     * e;
  const phi   = flight.s0.phi   + (flight.s1.phi   - flight.s0.phi)   * e;
  const theta = flight.s0.theta + (flight.s1.theta - flight.s0.theta) * e;
  const arcBoost = 1 + 0.35 * Math.sin(Math.PI * t);

  const off = new THREE.Vector3().setFromSphericalCoords(r * arcBoost, phi, theta);
  camera.position.copy(targetNow).add(off);
  controls.target.copy(targetNow);
  camera.lookAt(targetNow);

  if (t >= 1) {
    const cb = flight.onArrive;
    flight = null;
    controls.enabled = true;
    controls.update();
    if (cb) cb();
  }
}

function goToDiagram(L, D) {
  if (flight) return;
  const key = `${L}-${D}`;
  if (!diagrams[key]) return;

  const isSame = (key === currentKey);

  saveInputsToCurrentDiagram();

  /* Collapse any expanded diagram — expansion state is not preserved
     across navigation. */
  if (!isSame) {
    for (const k of Object.keys(diagrams)) {
      diagrams[k].expansionTarget = 0;
    }
  }

  currentKey = key;
  fadeState = 'navigating';
  updateUI();
  updateExpandButton();
  rebuildLabels();

  const targetWorld = diagrams[key].center.clone();
  const worldOffset = state0Offset(key);

  startFlight(targetWorld, worldOffset, 1.5, () => {
    fadeState = 'steady';
    updateUI();
  });
}

function goToOverview() {
  if (flight) return;
  saveInputsToCurrentDiagram();

  /* Also collapse everything when entering overview */
  for (const k of Object.keys(diagrams)) {
    diagrams[k].expansionTarget = 0;
  }
  updateExpandButton();

  fadeState = 'overview';
  updateUI();

  const overviewTarget = new THREE.Vector3(0, 0, 200);
  const overviewPos    = new THREE.Vector3(650, 520, 1500);

  startFlight(overviewTarget, overviewPos.clone().sub(overviewTarget), 1.8, () => {});
}

/* =====================================================================
   ALPHA ANIMATIONS
   ===================================================================== */
function targetAlphaFor(key) {
  if (fadeState === 'overview' || fadeState === 'navigating') return 1;
  if (key === currentKey) return 1;
  const lo = LAYOUT[currentKey];
  if (lo.parentKey === key) return 0.20;
  return 0;
}

function updateOuterAlphas(dt) {
  const k = 1 - Math.exp(-1.5 * dt);
  for (const key of Object.keys(diagrams)) {
    const inst = diagrams[key];
    const target = targetAlphaFor(key);
    inst.outerAlpha += (target - inst.outerAlpha) * k;
    if (Math.abs(inst.outerAlpha - target) < 0.004) inst.outerAlpha = target;
  }
}

function updateExpansions(dt) {
  const k = 1 - Math.exp(-3.5 * dt);
  for (const key of Object.keys(diagrams)) {
    const inst = diagrams[key];
    const t = inst.expansionTarget;
    inst.expansion += (t - inst.expansion) * k;
    if (Math.abs(inst.expansion - t) < 0.004) inst.expansion = t;

    inst.frontGroup.position.z =  inst.expansion * LAYER_Z;
    inst.backGroup.position.z  = -inst.expansion * LAYER_Z;
  }
}

function updateLinks(dt) {
  const k = 1 - Math.exp(-3.0 * dt);
  const ov = (fadeState === 'overview' || fadeState === 'navigating');
  const target = ov ? (fadeState === 'overview' ? 0.55 : 0.35) : 0;

  for (const t of treeLinks) {
    t.opacity += (target - t.opacity) * k;
    if (Math.abs(t.opacity - target) < 0.004) t.opacity = target;
    t.line.material.opacity = t.opacity;
    t.line.visible = t.opacity > 0.004;
  }
}

function updateLabelFade(dt) {
  const target = fadeState === 'overview' ? 0 : 1;
  labelFade += (target - labelFade) * (1 - Math.exp(-2.5 * dt));
  if (Math.abs(labelFade - target) < 0.004) labelFade = target;
}

/* =====================================================================
   OPACITY APPLICATION
   ===================================================================== */
const lastApply = { labelFade: -1, states: {} };

function applyOpacities() {
  const lfChanged = (labelFade !== lastApply.labelFade);
  lastApply.labelFade = labelFade;

  for (const key of Object.keys(diagrams)) {
    const inst = diagrams[key];
    const a = inst.outerAlpha;
    const e = inst.expansion;

    const prev = lastApply.states[key];
    if (!lfChanged && prev && prev.a === a && prev.e === e) continue;
    lastApply.states[key] = { a, e };

    inst.group.visible = a > 0.004;

    for (const em of inst.centerMats.edgeMats) em.mat.opacity = em.base * a;
    for (const pm of inst.centerMats.pointMats) pm.mat.opacity = pm.base * a;
    for (const em of inst.frontMats.edgeMats) em.mat.opacity = em.base * a * e;
    for (const pm of inst.frontMats.pointMats) pm.mat.opacity = pm.base * a * e;
    for (const em of inst.backMats.edgeMats) em.mat.opacity = em.base * a * e;
    for (const pm of inst.backMats.pointMats) pm.mat.opacity = pm.base * a * e;

    for (const lbl of inst.centerLabels) {
      const op = a * labelFade;
      lbl.element.style.opacity = op.toFixed(3);
      const vis = labelsOn && op > 0.03;
      lbl.visible = vis;
      lbl.element.style.display = vis ? '' : 'none';
    }
    for (const lbl of inst.frontLabels) {
      const op = a * e * labelFade;
      lbl.element.style.opacity = op.toFixed(3);
      const vis = labelsOn && op > 0.03;
      lbl.visible = vis;
      lbl.element.style.display = vis ? '' : 'none';
    }
    for (const lbl of inst.backLabels) {
      const op = a * e * labelFade;
      lbl.element.style.opacity = op.toFixed(3);
      const vis = labelsOn && op > 0.03;
      lbl.visible = vis;
      lbl.element.style.display = vis ? '' : 'none';
    }
  }
}

/* =====================================================================
   LABELS
   ===================================================================== */
let labelsOn = true;

function clearLabels() {
  for (const key of Object.keys(diagrams)) {
    const inst = diagrams[key];
    for (const l of inst.centerLabels) inst.centerGroup.remove(l);
    for (const l of inst.frontLabels)  inst.frontGroup.remove(l);
    for (const l of inst.backLabels)   inst.backGroup.remove(l);
    inst.centerLabels = [];
    inst.frontLabels = [];
    inst.backLabels = [];
  }
}

function rebuildLabels() {
  clearLabels();
  const inst = diagrams[currentKey];
  const data = diagramData[currentKey];
  const colors = layerTripleFor(inst.level, inst.index);

  const centerHex = hexOf(colors.center);
  const frontHex  = hexOf(colors.front);
  const backHex   = hexOf(colors.back);

  for (const k of ALL_KEYS) {
    const pos = GREIMAS_LOCAL[k].clone();
    let dir, cls;
    if (INNER_KEYS.includes(k)) {
      dir = new THREE.Vector3(pos.x, pos.y, 0).normalize();
      cls = 'main';
    } else {
      dir = new THREE.Vector3(-pos.x, -pos.y, 0).normalize();
      cls = M_KEYS.includes(k) ? 'mid' : 'corner';
    }

    const centerLbl = makeLabel(SYMBOLS[k], data[k].name, centerHex, cls);
    centerLbl.position.copy(pos).addScaledVector(dir, 0.7);
    inst.centerGroup.add(centerLbl);
    inst.centerLabels.push(centerLbl);

    const frontLbl = makeLabel('+' + SYMBOLS[k], data[k].syn, frontHex, 'layer');
    frontLbl.position.copy(pos).addScaledVector(dir, 0.7);
    inst.frontGroup.add(frontLbl);
    inst.frontLabels.push(frontLbl);

    const backLbl = makeLabel('−' + SYMBOLS[k], data[k].ant, backHex, 'layer');
    backLbl.position.copy(pos).addScaledVector(dir, 0.7);
    inst.backGroup.add(backLbl);
    inst.backLabels.push(backLbl);
  }
}

const inputs = {};
document.querySelectorAll('#ui input[data-k]').forEach(el => {

function syncInputsFromState() {
  const data = diagramData[currentKey];
  for (const k of ALL_KEYS) {
    if (inputs[k]?.name) inputs[k].name.value = data[k].name || '';
    if (inputs[k]?.subs) {
      const syn = data[k].syn || '';
      const ant = data[k].ant || '';
      inputs[k].subs.value = [syn, ant].filter(Boolean).join(', ');
    }
  }
}

function saveInputsToCurrentDiagram() {
  const data = diagramData[currentKey];
  for (const k of ALL_KEYS) {
    if (inputs[k]?.name) data[k].name = inputs[k].name.value;
    if (inputs[k]?.subs) {
      const parts = (inputs[k].subs.value || '').split(',').map(x => x.trim());
      data[k].syn = parts[0] || '';
      data[k].ant = parts[1] || '';
    }
  }
}

/* =====================================================================
   CSV EXPORT
   ===================================================================== */
function csvEscape(v) {
  const s = (v == null) ? '' : String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildCSVRows(keys) {
  const rows = [[
    'L','D','Parent','Parent_P','Position','Diagram_P','Name','Expanded_Syn','Expanded_Ant',
  ]];

  for (const key of keys) {
    const lo = LAYOUT[key];
    const data = diagramData[key];
    const L = lo.level;
    const D = lo.index + 1;

    let parentLabel = '';
    let parentP = '';
    if (lo.parentKey) {
      const parentLo = LAYOUT[lo.parentKey];
      parentLabel = `L${parentLo.level} D${parentLo.index + 1}`;
      parentP = `P${lo.parentCorner + 1}`;
    }

    for (const pos of POS_ORDER) {
      const entry = data[pos] || { name:'', syn:'', ant:'' };
      rows.push([
        L, D, parentLabel, parentP,
        SYMBOLS[pos], DIAGRAM_P[pos] || '',
        entry.name, entry.syn, entry.ant,
      ]);
    }
  }

  return rows;
}

function downloadCSV(rows, filename) {
  const body = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + body], { type: 'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCurrentD() {
  saveInputsToCurrentDiagram();
  const lo = LAYOUT[currentKey];
  const rows = buildCSVRows([currentKey]);
  downloadCSV(rows, `greimas-L${lo.level}-D${lo.index + 1}.csv`);
}

function exportAll() {
  saveInputsToCurrentDiagram();
  const keys = Object.keys(LAYOUT).sort((a, b) => {
    const [la, da] = a.split('-').map(Number);
    const [lb, db] = b.split('-').map(Number);
    if (lb !== la) return lb - la;
    return da - db;
  });
  const rows = buildCSVRows(keys);
  downloadCSV(rows, 'greimas-nested-full.csv');
}

      b.appendChild(grp);

      const txt = document.createTextNode(`D${idx + 1}`);
      b.appendChild(txt);

      b.addEventListener('click', () => goToDiagram(1, idx));
      row.appendChild(b);
    }
    l1rows.appendChild(row);
  }
}

function updateUI() {
  const card = document.getElementById('current');

  if (fadeState === 'overview') {
    card.innerHTML = `Overview<span class="sub">all diagrams visible</span>`;
  } else {
    const inst = diagrams[currentKey];
    const lo = LAYOUT[currentKey];

    let anchorNote = '';
    if (lo.parentKey) {
      const parent = LAYOUT[lo.parentKey];
      const corner = P_LOCAL[lo.parentCorner].label;
      anchorNote = `<span class="anchor-note">sits at ${corner} of L${parent.level}·D${parent.index + 1}</span>`;
    } else {
      anchorNote = `<span class="anchor-note">root — no parent</span>`;
    }

    card.innerHTML = `L${inst.level} · D${inst.index + 1}`
      + `<span class="sub">${LEVEL_NAMES[inst.level]} level</span>`
      + anchorNote;
  }

  document.querySelectorAll('#ui button[data-key]').forEach(b => {
    const active = fadeState !== 'overview' && b.dataset.key === currentKey;
    b.classList.toggle('active', active);
    b.disabled = !!flight;
  });
  document.getElementById('overview').disabled = !!flight;
  document.getElementById('apply').disabled = !!flight;
  document.getElementById('reset').disabled = !!flight;
  document.getElementById('expand').disabled = !!flight || fadeState === 'overview';
  document.getElementById('export-current').disabled = !!flight;
  document.getElementById('export-all').disabled = !!flight;
}

document.getElementById('t-labels').addEventListener('change', e => {
  labelsOn = e.target.checked;
  applyOpacities();
});
document.getElementById('t-rotate').addEventListener('change', e => {
  controls.autoRotate = e.target.checked;
  controls.autoRotateSpeed = 0.9;
});
document.querySelectorAll('.sec[data-sec]').forEach(sec => {
  sec.querySelector('.sec-title').addEventListener('click', () => sec.classList.toggle('collapsed'));
});

document.getElementById('apply').addEventListener('click', () => {
  if (flight) return;
  saveInputsToCurrentDiagram();
  rebuildLabels();
});
document.getElementById('reset').addEventListener('click', () => {
  if (flight) return;
  for (const key of Object.keys(diagramData)) {
    diagramData[key] = (key === '1-0') ? defaultDiagram() : blankDiagram();
  }
  for (const key of Object.keys(diagrams)) {
    diagrams[key].expansionTarget = 0;
  }
  syncInputsFromState();
  rebuildLabels();
  updateExpandButton();
});

function updateExpandButton() {
  const inst = diagrams[currentKey];
  const expanded = inst.expansionTarget === 1;
  const btn = document.getElementById('expand');
  btn.classList.toggle('expanded', expanded);
  document.getElementById('expand-label').textContent = expanded ? 'Collapse' : 'Expand';
}

document.getElementById('expand').addEventListener('click', () => {
  if (flight || fadeState === 'overview') return;
  const inst = diagrams[currentKey];
  inst.expansionTarget = inst.expansionTarget === 1 ? 0 : 1;
  updateExpandButton();
});

document.getElementById('export-current').addEventListener('click', () => {
  if (flight) return;
  exportCurrentD();
});
document.getElementById('export-all').addEventListener('click', () => {
  if (flight) return;
  exportAll();
});

document.getElementById('overview').addEventListener('click', goToOverview);
document.getElementById('clear-cache').addEventListener('click', () => {
  try { localStorage.removeItem('greimas-words-v3'); } catch (e) {}
});
document.querySelectorAll('#ui input[data-k]').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveInputsToCurrentDiagram();
      rebuildLabels();
      el.blur();
    }
  });
});

/* =====================================================================
   RESIZE + LOOP
   ===================================================================== */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = Math.min(0.1, clock.getDelta());

  updateFlight(now);
  updateOuterAlphas(dt);
  updateExpansions(dt);
  updateLinks(dt);
  updateLabelFade(dt);
  applyOpacities();

  if (!flight) controls.update();

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* =====================================================================
   BOOT
   ===================================================================== */
buildUI();
currentKey = '1-0';
syncInputsFromState();
rebuildLabels();

for (const key of Object.keys(diagrams)) {
  diagrams[key].outerAlpha = (key === '1-0') ? 1 : 0;
}
for (const t of treeLinks) t.opacity = 0;

{
  const inst = diagrams['1-0'];
  controls.target.copy(inst.center);
  camera.position.copy(inst.center).add(state0Offset('1-0'));
  camera.lookAt(inst.center);
}

updateExpandButton();
updateUI();
animate();
</script>
</body>
</html>
