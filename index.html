<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested Squares — 3D Structure</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070d; color: #e9edf7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  #ui {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    width: 300px; max-height: calc(100vh - 28px); overflow-y: auto;
    padding: 14px 15px; border-radius: 12px;
    background: rgba(9, 13, 22, 0.9);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.55);
    font-size: 12px; line-height: 1.4;
  }
  #ui::-webkit-scrollbar { width: 6px; }
  #ui::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  #ui h1 {
    margin: 0 0 3px; font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .hint {
    margin: 0 0 12px; font-size: 10px; color: #7e8aa8;
  }

  #current {
    margin: 0 0 12px; padding: 10px 12px;
    border-radius: 8px;
    background: rgba(126,160,255,0.10);
    border: 1px solid rgba(126,160,255,0.25);
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.05em;
    color: #cfe0ff;
  }
  #current .sub {
    display: block;
    margin-top: 2px;
    font-size: 10.5px; font-weight: 400;
    color: #8a96b4;
    letter-spacing: 0.04em;
  }

  .group {
    margin: 0 0 10px;
    padding: 0 0 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .group:last-child { border-bottom: none; padding-bottom: 0; }

  .group-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #7e8aa8; margin: 0 0 6px 2px;
  }
  .group-label i {
    display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: 0 0 6px currentColor;
  }

  .btn-row {
    display: flex; gap: 4px;
    margin-bottom: 4px;
  }
  .btn-row:last-child { margin-bottom: 0; }

  .btn-row .indent {
    flex: 0 0 34px;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: #5f6a86;
    display: flex; align-items: center;
    padding-right: 4px;
    justify-content: flex-end;
  }

  .btn-row button {
    flex: 1;
    padding: 6px 4px;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: #c8d0e6;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-row button:hover {
    background: rgba(126,160,255,0.16);
    border-color: rgba(126,160,255,0.4);
    color: #fff;
  }
  .btn-row button.active {
    background: rgba(126,160,255,0.28);
    border-color: rgba(126,160,255,0.7);
    color: #fff;
    font-weight: 600;
  }

  #overview {
    width: 100%;
    padding: 9px 10px;
    margin: 8px 0 4px;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b6f0ff;
    background: linear-gradient(135deg, rgba(56,189,248,0.16), rgba(167,139,250,0.14));
    border: 1px solid rgba(56,189,248,0.42);
    transition: background 0.2s, border-color 0.2s;
  }
  #overview:hover {
    background: linear-gradient(135deg, rgba(56,189,248,0.30), rgba(167,139,250,0.24));
    border-color: rgba(56,189,248,0.75);
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="ui">
  <h1>Nested Squares</h1>
  <p class="hint">drag to orbit · scroll to zoom · right-drag to pan</p>

  <div id="current"></div>

  <button id="overview">Overview</button>

  <div class="group">
    <div class="group-label"><i style="background:#FF7A45;color:#FF7A45"></i>L3 · Narrative</div>
    <div class="btn-row" id="row-L3"></div>
  </div>

  <div class="group">
    <div class="group-label"><i style="background:#FDE725;color:#FDE725"></i>L2 · Argument</div>
    <div class="btn-row" id="row-L2"></div>
  </div>

  <div class="group">
    <div class="group-label"><i style="background:#6DD4C4;color:#6DD4C4"></i>L1 · Proposition</div>
    <div id="l1-rows"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   CONSTANTS — three planes, stacked 200 apart
   ===================================================================== */
const SQ3 = 120;   // side of the L3 square
const SQ2 = 60;    // side of each L2 square
const SQ1 = 30;    // side of each L1 square

const Z3 = 400;    // L3 plane height
const Z2 = 200;    // L2 plane height
const Z1 = 0;      // L1 plane height

const LEVEL_COLORS = {
  3: 0xFF7A45,     // orange  — Narrative
  2: 0xFDE725,     // yellow  — Argument
  1: 0x6DD4C4,     // teal    — Proposition
};
const LEVEL_NAMES = { 3: 'Narrative', 2: 'Argument', 1: 'Proposition' };

/* =====================================================================
   GEOMETRY — compute every square's position
   ===================================================================== */
function squareCorners(cx, cy, z, side) {
  const h = side / 2;
  return [
    new THREE.Vector3(cx - h, cy - h, z),
    new THREE.Vector3(cx + h, cy - h, z),
    new THREE.Vector3(cx + h, cy + h, z),
    new THREE.Vector3(cx - h, cy + h, z),
  ];
}

// --- L3: one square, centred at origin on plane z = Z3 ---
const L3 = {
  level: 3,
  index: 0,
  center: new THREE.Vector3(0, 0, Z3),
  side: SQ3,
  corners: squareCorners(0, 0, Z3, SQ3),
};

// --- L2: one square at each L3 corner, on plane z = Z2 ---
const L2 = L3.corners.map((c, i) => ({
  level: 2,
  index: i,
  center: new THREE.Vector3(c.x, c.y, Z2),
  side: SQ2,
  corners: squareCorners(c.x, c.y, Z2, SQ2),
}));

// --- L1: one square at each L2 corner, on plane z = Z1 ---
const L1 = [];
for (let i = 0; i < L2.length; i++) {
  for (let j = 0; j < 4; j++) {
    const c = L2[i].corners[j];
    L1.push({
      level: 1,
      index: i * 4 + j,
      parentIndex: i,
      parentCornerIndex: j,
      center: new THREE.Vector3(c.x, c.y, Z1),
      side: SQ1,
      corners: squareCorners(c.x, c.y, Z1, SQ1),
    });
  }
}

// Index every square by a stable string key: "3-0", "2-2", "1-7" etc.
const ALL_SQUARES = {};
for (const s of [L3, ...L2, ...L1]) {
  ALL_SQUARES[`${s.level}-${s.index}`] = s;
}

/* =====================================================================
   SCENE
   ===================================================================== */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 8000);
camera.position.set(400, 350, 900);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.08;
controls.rotateSpeed     = 0.85;
controls.zoomSpeed       = 0.9;
controls.panSpeed        = 0.8;
controls.target.set(0, 0, 200);
controls.minDistance     = 20;
controls.maxDistance     = 3000;

/* =====================================================================
   VISUAL HELPERS
   ===================================================================== */
const glowTex = (() => {
  const s = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1.0)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

// Track everything so we can dim / highlight per square later.
const squareObjects = {};   // key -> { line, dots: [Sprite], connectors: [Line] }

function makeSquareObject(sq) {
  const color = LEVEL_COLORS[sq.level];
  const group = new THREE.Group();
  scene.add(group);

  // The square outline
  const pts = [...sq.corners, sq.corners[0]];
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const lineMat = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: 1,
    linewidth: 1,   // ignored on most platforms, but harmless
  });
  const line = new THREE.Line(lineGeo, lineMat);
  group.add(line);

  // Corner dots
  const dots = [];
  const dotScale = sq.level === 3 ? 11 : sq.level === 2 ? 6.5 : 4;
  for (const c of sq.corners) {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color,
      blending: THREE.AdditiveBlending,
      transparent: true, depthWrite: false, opacity: 1,
    }));
    sprite.position.copy(c);
    sprite.scale.setScalar(dotScale);
    group.add(sprite);
    dots.push(sprite);
  }

  return {
    key: `${sq.level}-${sq.index}`,
    group,
    line,
    dots,
    connectors: [],   // filled in a second pass
  };
}

// Build every square
for (const sq of [L3, ...L2, ...L1]) {
  squareObjects[`${sq.level}-${sq.index}`] = makeSquareObject(sq);
}

// --- Connectors: dashed verticals linking each parent corner to its child centre ---
function makeDashedConnector(a, b, color, opacity = 0.4) {
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const mat = new THREE.LineDashedMaterial({
    color, transparent: true, opacity,
    dashSize: 6, gapSize: 6,
  });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  return line;
}

// L3 corner -> L2 square centre
for (let i = 0; i < L2.length; i++) {
  const a = L3.corners[i];               // corner on L3 plane
  const b = L2[i].center;                // same XY, lower plane
  const conn = makeDashedConnector(a, b, LEVEL_COLORS[3], 0.35);
  scene.add(conn);
  squareObjects[`2-${i}`].connectors.push(conn);
  squareObjects[`3-0`].connectors.push(conn);
}

// L2 corner -> L1 square centre
for (let i = 0; i < L2.length; i++) {
  for (let j = 0; j < 4; j++) {
    const a = L2[i].corners[j];          // corner on L2 plane
    const l1idx = i * 4 + j;
    const b = L1[l1idx].center;          // same XY, lower plane
    const conn = makeDashedConnector(a, b, LEVEL_COLORS[2], 0.3);
    scene.add(conn);
    squareObjects[`1-${l1idx}`].connectors.push(conn);
    squareObjects[`2-${i}`].connectors.push(conn);
  }
}

/* =====================================================================
   CAMERA FLIGHT
   ===================================================================== */
const VIEW_DIR = new THREE.Vector3(0.55, 0.35, 0.75).normalize();

let flying = false;

function easeInOutCubic(x) {
  return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
}

function flyTo(targetPos, lookAt, duration = 1.6) {
  const startPos    = camera.position.clone();
  const startTarget = controls.target.clone();
  const startTime   = performance.now();
  flying = true;

  function tick() {
    const t = Math.min(1, (performance.now() - startTime) / (duration * 1000));
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(startPos, targetPos, e);
    controls.target.lerpVectors(startTarget, lookAt, e);
    if (t < 1) {
      requestAnimationFrame(tick);
    } else {
      flying = false;
    }
  }
  tick();
}

function flyToSquare(level, index, duration = 1.6) {
  const sq = ALL_SQUARES[`${level}-${index}`];
  if (!sq) return;
  const dist      = sq.side * 2.6;
  const targetPos = sq.center.clone().add(VIEW_DIR.clone().multiplyScalar(dist));
  flyTo(targetPos, sq.center.clone(), duration);
}

/* =====================================================================
   STATE + UI
   ===================================================================== */
let current = { level: 3, index: 0 };

function goTo(level, index, duration = 1.6) {
  current = { level, index };
  flyToSquare(level, index, duration);
  updateUI();
}

function buildUI() {
  const rowL3 = document.getElementById('row-L3');
  rowL3.innerHTML = '';
  const b3 = document.createElement('button');
  b3.textContent = 'D1';
  b3.dataset.key = '3-0';
  b3.addEventListener('click', () => goTo(3, 0));
  rowL3.appendChild(b3);

  const rowL2 = document.getElementById('row-L2');
  rowL2.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('button');
    b.textContent = `D${i + 1}`;
    b.dataset.key = `2-${i}`;
    b.addEventListener('click', () => goTo(2, i));
    rowL2.appendChild(b);
  }

  const l1rows = document.getElementById('l1-rows');
  l1rows.innerHTML = '';
  for (let g = 0; g < 4; g++) {
    const row = document.createElement('div');
    row.className = 'btn-row';

    const indent = document.createElement('span');
    indent.className = 'indent';
    indent.textContent = `L2·${g + 1}`;
    row.appendChild(indent);

    for (let j = 0; j < 4; j++) {
      const idx = g * 4 + j;
      const b = document.createElement('button');
      b.textContent = `D${idx + 1}`;
      b.dataset.key = `1-${idx}`;
      b.addEventListener('click', () => goTo(1, idx));
      row.appendChild(b);
    }
    l1rows.appendChild(row);
  }
}

function updateUI() {
  // Current-square card
  const card = document.getElementById('current');
  const name = LEVEL_NAMES[current.level];
  card.innerHTML = `L${current.level} · D${current.index + 1}`
    + `<span class="sub">${name} level</span>`;

  // Highlight the active button in every group
  document.querySelectorAll('#ui button[data-key]').forEach(b => {
    b.classList.toggle('active', b.dataset.key === `${current.level}-${current.index}`);
  });

  // Dim / brighten the 3D squares
  const currentKey = `${current.level}-${current.index}`;
  for (const key of Object.keys(squareObjects)) {
    const obj = squareObjects[key];
    const isCurrent = key === currentKey;

    // For non-current squares, dim gently — but keep squares on the same
    // parent line slightly brighter so the hierarchy reads.
    let op = 1;
    if (!isCurrent) {
      // Squares on the same level as the current one stay a bit brighter.
      const lvl = parseInt(key.split('-')[0], 10);
      op = (lvl === current.level) ? 0.55 : 0.28;
    }

    obj.line.material.opacity = op;
    for (const d of obj.dots) d.material.opacity = op;
    for (const c of obj.connectors) c.material.opacity = op * 0.5;
  }
}

/* =====================================================================
   OVERVIEW BUTTON
   ===================================================================== */
document.getElementById('overview').addEventListener('click', () => {
  const pos    = new THREE.Vector3(420, 360, 940);
  const lookAt = new THREE.Vector3(0, 0, 200);
  flyTo(pos, lookAt, 1.9);
});

/* =====================================================================
   RESIZE + RENDER LOOP
   ===================================================================== */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  if (!flying) controls.update();
  renderer.render(scene, camera);
}

/* =====================================================================
   BOOT
   ===================================================================== */
buildUI();
updateUI();
animate();
</script>
</body>
</html>
