<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architectonic Greimas Viewer — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(9,13,22,0.92);
    --text: #e9edf7;
    --text-dim: #8a93ab;
    --accent: #1F9E89;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Archivo', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  input, textarea, button { font-family: inherit; }

  #canvas-container { position: fixed; inset: 0; z-index: 1; }

  #top-bar {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap; max-width: 62vw;
  }
  .btn {
    padding: 10px 14px; min-height: 40px;
    border-radius: 9px; cursor: pointer;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: #c8d0e6; background: var(--panel);
    border: 1px solid rgba(31,158,137,0.20);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: background .15s, border-color .15s, color .15s, opacity .15s;
    user-select: none;
  }
  .btn:hover:not(.disabled) { background: rgba(31,158,137,.20); border-color: rgba(31,158,137,.55); color: #fff; }
  .btn:active:not(.disabled) { transform: translateY(1px); }
  .btn.disabled { opacity: 0.35; cursor: not-allowed; border-color: rgba(31,158,137,0.08); }
  .btn.level-btn { border-color: rgba(253,231,37,0.35); color: #FDE725; }
  .btn.level-btn:hover:not(.disabled) { background: rgba(253,231,37,0.15); border-color: rgba(253,231,37,0.7); color: #fff; }
  .btn.lattice-btn { border-color: rgba(62,74,137,0.55); color: #7A9AD6; }
  .btn.lattice-btn:hover:not(.disabled) { background: rgba(62,74,137,0.28); border-color: rgba(122,154,214,0.85); color: #fff; }
  .btn.lattice-btn.active { background: rgba(62,74,137,0.45); border-color: rgba(180,222,44,0.85); color: #FDE725; }
  .btn.focus-btn { border-color: rgba(201,162,39,0.55); color: #D4AF37; }
  .btn.focus-btn:hover:not(.disabled) { background: rgba(201,162,39,0.18); border-color: rgba(212,175,55,0.85); color: #FFF; }
  .btn.focus-btn.active { background: rgba(201,162,39,0.35); border-color: rgba(253,231,37,0.9); color: #FDE725; }

  #ui {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    width: 380px; max-height: calc(100vh - 28px); overflow-y: auto;
    padding: 14px 16px; border-radius: 12px;
    background: var(--panel);
    border: 1px solid rgba(31,158,137,0.16);
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    transition: transform .3s, opacity .3s;
  }
  body.panels-hidden #ui { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }

  .sec { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 10px 0; }
  .sec:last-child { border-bottom: none; }
  .sec-title {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);
    user-select: none;
  }
  .sec-title:hover { color: #c8d0e6; }
  .sec-body { max-height: 0; overflow: hidden; transition: max-height .3s; }
  .sec.open .sec-body { max-height: 2000px; }
  .sec-content { padding: 10px 0 4px; }
  .chev { font-size: 10px; transition: transform .25s; }
  .sec.open .chev { transform: rotate(180deg); }

  #json-input {
    width: 100%; min-height: 100px; resize: vertical;
    background: #0a0d1a; color: var(--text);
    border: 1px solid rgba(31,158,137,0.18); border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; line-height: 1.5;
  }
  #json-status { font-size: 11px; margin-top: 6px; }
  #json-status.ok { color: #35B779; }
  #json-status.err { color: #ff6b6b; }

  #node-info {
    padding: 10px 12px;
    background: rgba(15,20,32,0.8); border-radius: 8px;
    border: 1px solid rgba(31,158,137,0.12);
    font-size: 11.5px; line-height: 1.55;
    max-height: 260px; overflow-y: auto;
    min-height: 80px;
  }
  #node-info h4 { margin: 0 0 6px; font-size: 12.5px; color: #FDE725; }
  #node-info .kv { margin-bottom: 5px; }
  #node-info .k { color: var(--text-dim); }
  #node-info .chip {
    display: inline-block; padding: 1px 7px; border-radius: 8px;
    background: rgba(31,158,137,0.18); color: #35B779; font-size: 10.5px;
    margin: 2px 3px 2px 0;
  }

  .legend {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; color: var(--text-dim); padding: 8px 0;
  }
  .legend span { display: flex; align-items: center; }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px;
    margin-right: 8px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  #overview-container {
    position: fixed; left: 14px; bottom: 14px;
    width: 220px; height: 220px; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(31,158,137,0.30); background: #05070d;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6); z-index: 8;
  }
  #minimap-svg { display: block; width: 100%; height: 100%; }
  #overview-title {
    position: absolute; top: 6px; left: 10px;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(200,208,230,0.6); pointer-events: none; z-index: 2;
  }
  #minimap-status {
    position: absolute; bottom: 6px; left: 8px; right: 8px;
    font-size: 9px; font-weight: 600;
    color: #c8d0e6;
    text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1);
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 2;
  }

  @media (max-width: 720px) {
    #overview-container { width: 140px; height: 140px; }
    #overview-title { font-size: 8px; }
    #minimap-status { font-size: 7.5px; }
  }

  .label {
    color: #B4DE2C; font-size: 11px; font-weight: 600;
    text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1);
    pointer-events: none; user-select: none; white-space: nowrap;
    transform: translate(-50%, -50%); padding: 1px 4px; border-radius: 4px;
    transition: color .15s, opacity .15s;
  }
  .label.square-header {
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .label.square-header .parent {
    color: var(--text-dim); font-weight: 500; font-style: italic;
    text-transform: none; letter-spacing: 0; font-size: 11.5px;
  }
  .label.highlighted { color: #FDE725 !important; text-shadow: 0 0 12px rgba(253,231,37,0.9), 0 0 3px rgba(0,0,0,1); }
  .label.dimmed { color: #1c3a48 !important; }
  .label.lattice-label { font-size: 8.5px; opacity: 0.85; }

  .loading {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: var(--bg); color: var(--text-dim);
    font-size: 13px; z-index: 100; transition: opacity .5s;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }

  #lattice-mode-badge {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 8px;
    background: rgba(62,74,137,0.6); color: #FDE725;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    border: 1px solid rgba(180,222,44,0.5);
    backdrop-filter: blur(10px);
    z-index: 15;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  #lattice-mode-badge.visible { opacity: 1; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="lattice-mode-badge">Architectonic Lattice — Level 3</div>

<div id="top-bar">
  <button class="btn" id="panel-toggle">◱ Hide Panels</button>
  <button class="btn lattice-btn" id="lattice-btn">⊞ Lattice View</button>
  <button class="btn level-btn" id="level-btn">→ B Level</button>
  <button class="btn disabled" id="cycle-btn">▸ Next B</button>
  <button class="btn focus-btn disabled" id="node-focus-btn">⊙ Focus Node</button>
  <button class="btn" id="view-reset">⌖ Reset View</button>
  <button class="btn" id="view-top">▣ Top</button>
  <button class="btn" id="view-front">▤ Front</button>
</div>

<div id="ui">
  <div class="sec open" data-sec>
    <div class="sec-title"><span>Load JSON</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <textarea id="json-input" spellcheck="false" placeholder="Paste the architectonic JSON."></textarea>
      <div id="json-status"></div>
      <button class="btn" id="json-apply" style="margin-top:8px; width:100%;">Update</button>
    </div></div>
  </div>

  <div class="sec open" data-sec>
    <div class="sec-title"><span>Node Info</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <div id="node-info"><em style="color:var(--text-dim);">Hover or click a node.</em></div>
    </div></div>
  </div>

  <div class="sec open" data-sec>
    <div class="sec-title"><span>Legend</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <div class="legend" id="legend"></div>
    </div></div>
  </div>
</div>

<div id="overview-container">
  <svg id="minimap-svg" viewBox="0 0 220 220" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="overview-title">Minimap</div>
  <div id="minimap-status"></div>
</div>

<div class="loading" id="loading">Building architectonic...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// =========================================================
// PALETTE
// =========================================================

const VIRIDIS = { 'A': 0xFDE725, 'S1': 0xB4DE2C, 'S2': 0x35B779, '~S1': 0x1F9E89, '~S2': 0x3E4A89 };
const VIRIDIS_HEX = { 'A': '#FDE725', 'S1': '#B4DE2C', 'S2': '#35B779', '~S1': '#1F9E89', '~S2': '#3E4A89' };
const NEUTRAL_COLOR = 0x888888;
const NEUTRAL_HEX = '#888888';
const CONNECTOR_COLOR = 0xC9A227;

function colorForSquare(k) { return VIRIDIS[k] ?? 0xB4DE2C; }
function hexForSquare(k)   { return VIRIDIS_HEX[k] ?? '#B4DE2C'; }

const HIGHLIGHT_HOVER = 0xFDE725;
const HIGHLIGHT_ABOVE = 0xF08C42;
const HIGHLIGHT_BELOW = 0xE0555A;
const HIGHLIGHT_DIMMED = 0x2a2e3d;

const MM_COLOR_DEFAULT = '#3a4060';
const MM_COLOR_YELLOW = '#D4AF37';
const MM_COLOR_RED = '#E0555A';
const MM_COLOR_DIM = '#151a28';

// =========================================================
// SQUARE GEOMETRY
// =========================================================

const SQ_POS = {
  top: [0.0, 3.20],
  M21: [-2.20, 2.20], M22: [-0.75, 2.20], M23: [0.75, 2.20], M24: [2.20, 2.20],
  M11: [0.0, 1.40],
  S1: [-1.10, 0.70], S2: [1.10, 0.70],
  M13: [-2.20, 0.00], Mixed1: [-0.75, 0.00], Mixed2: [0.75, 0.00], M14: [2.20, 0.00],
  '~S2': [-1.10, -0.70], '~S1': [1.10, -0.70],
  M12: [0.0, -1.40],
  bottom: [0.0, -3.20],
};

const SQ_EDGES = [
  ['top','M21'],['top','M22'],['top','M23'],['top','M24'],
  ['M21','M11'],['M21','M13'],['M22','M11'],['M22','M14'],
  ['M23','M12'],['M23','M13'],['M24','M12'],['M24','M14'],
  ['M11','S1'],['M11','S2'],['M12','~S2'],['M12','~S1'],
  ['M13','S1'],['M13','~S2'],['M14','S2'],['M14','~S1'],
  ['Mixed1','S1'],['Mixed1','~S1'],['Mixed2','S2'],['Mixed2','~S2'],
  ['S1','bottom'],['S2','bottom'],['~S2','bottom'],['~S1','bottom'],
  ['S1','S2'],['~S2','~S1'],['S1','~S2'],['S2','~S1'],
  ['S1','~S1'],['S2','~S2'],
];

function isInnerSquareEdge(a, b) {
  const inner = new Set(['S1','S2','~S2','~S1']);
  return inner.has(a) && inner.has(b);
}

// =========================================================
// LAYOUT
// =========================================================

const LAYOUT = {
  A:     { position: { x: 0,    y: 0,    z: 10 }, scale: 1.15 },
  S1:    { position: { x: -5.5, y:  6.5, z: -6 }, scale: 0.95 },
  S2:    { position: { x:  5.5, y:  6.5, z: -6 }, scale: 0.95 },
  '~S2': { position: { x: -5.5, y: -6.5, z: -6 }, scale: 0.95 },
  '~S1': { position: { x:  5.5, y: -6.5, z: -6 }, scale: 0.95 },
};

const B_INDEX = { 'S1': 'B1', 'S2': 'B2', '~S2': 'B3', '~S1': 'B4' };
const B_DISPLAY = { 'S1': 'S1-B1', 'S2': 'S2-B2', '~S2': '~S2-B3', '~S1': '~S1-B4' };

const B_CYCLE_ORDER = ['S1', 'S2', '~S1', '~S2'];

const VIEW_OFFSETS = {
  default: new THREE.Vector3(5, 3, 14),
  top:     new THREE.Vector3(4, 14, 4),
  front:   new THREE.Vector3(0, 0, 15),
  lattice: new THREE.Vector3(0, 2, 32),
};

const VP2_OFFSET = new THREE.Vector3(1.6, 1.1, 2.2);

// =========================================================
// SCENE SETUP
// =========================================================

const container = document.getElementById('canvas-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.FogExp2(0x05070d, 0.007);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(14, 12, 26);

// Performance: cap pixel ratio at 1.5 (down from 2), request high-performance GPU.
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
labelRenderer.domElement.style.zIndex = '2';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 120;

scene.add(new THREE.AmbientLight(0xffffff, 1));

// =========================================================
// STATE
// =========================================================

const state = {
  data: null,
  squares: [],
  nodesById: new Map(),
  hoverTarget: null,
  pinnedTarget: null,
  raycaster: new THREE.Raycaster(),
  mouse: new THREE.Vector2(-10, -10),

  focusedKey: 'A',
  level: 'A',
  lastDiagramKey: 'A',

  viewMode: 'diagram',
  viewpointLevel: 1,

  diagramGroup: new THREE.Group(),
  latticeGroup: null,
  latticeData: null,
  latticeHoverTarget: null,
  latticePinnedTarget: null,

  diagramOpacity: 1.0,
  latticeOpacity: 0.0,

  minimap: null,

  anim: { active: false, t: 0, duration: 0.6,
    fromCam: new THREE.Vector3(), toCam: new THREE.Vector3(),
    fromLook: new THREE.Vector3(), toLook: new THREE.Vector3(),
    lastTime: 0 },

  fade: { active: false, t: 0, duration: 1.4, to: 'lattice', lastTime: 0 },
};

scene.add(state.diagramGroup);

// Performance: track render demand. When nothing is moving and nothing is
// scheduled, we skip both WebGL and CSS2D renders entirely.
let lastCamHash = 0;
let renderPending = true;

function hashCamera() {
  const p = camera.position;
  const t = controls.target;
  return (Math.round(p.x * 100) * 73856093)
       ^ (Math.round(p.y * 100) * 19349663)
       ^ (Math.round(p.z * 100) * 83492791)
       ^ (Math.round(t.x * 100) * 51773313)
       ^ (Math.round(t.y * 100) * 27309839)
       ^ (Math.round(t.z * 100) * 12653951);
}

function markDirty() { renderPending = true; }

// =========================================================
// DISPOSAL
// =========================================================

function disposeGroup(group) {
  if (!group) return;
  group.traverse(obj => {
    if (obj.element && obj.element.parentNode) {
      obj.element.parentNode.removeChild(obj.element);
    }
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
}

// =========================================================
// SQUARE CONSTRUCTION
// =========================================================

const CUBE_SIZE = 0.09;
const NODE_OPACITY = 0.88;
const EDGE_OPACITY = 0.55;
const EDGE_OPACITY_INNER = 0.72;

function buildSquare(squareData, squareKey, title, parentTerm, position, scale, displayKey) {
  const group = new THREE.Group();
  group.position.set(position.x, position.y, position.z);
  group.scale.setScalar(scale);

  const nodeMeshes = {};
  const nodeLabels = {};
  const nodePositions3D = {};
  const squareColor = colorForSquare(squareKey);
  const labelColor = hexForSquare(squareKey);

  SQ_EDGES.forEach(([a, b]) => {
    if (!SQ_POS[a] || !SQ_POS[b]) return;
    const [x1, y1] = SQ_POS[a];
    const [x2, y2] = SQ_POS[b];
    const dashed = isInnerSquareEdge(a, b);
    const opacity = dashed ? EDGE_OPACITY_INNER : EDGE_OPACITY;

    const geom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x1, y1, 0),
      new THREE.Vector3(x2, y2, 0),
    ]);

    let mat, obj;
    if (dashed) {
      mat = new THREE.LineDashedMaterial({ color: squareColor, dashSize: 0.18, gapSize: 0.10,
        transparent: true, opacity, depthWrite: false });
      obj = new THREE.Line(geom, mat);
      obj.computeLineDistances();
    } else {
      mat = new THREE.LineBasicMaterial({ color: squareColor, transparent: true, opacity, depthWrite: false });
      obj = new THREE.Line(geom, mat);
    }
    obj.userData.baseOpacity = opacity;
    obj.userData.isSquareEdge = true;
    group.add(obj);
  });

  Object.entries(SQ_POS).forEach(([pos, [x, y]]) => {
    const geom = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
    const mat = new THREE.MeshBasicMaterial({
      color: squareColor, transparent: true, opacity: NODE_OPACITY, depthWrite: false,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(x, y, 0);
    mesh.userData = {
      squareKey, position: pos, term: squareData[pos] || '',
      baseColor: squareColor, baseOpacity: NODE_OPACITY,
    };
    group.add(mesh);

    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.style.color = labelColor;
    const termText = squareData[pos] || '';
    labelEl.textContent = termText.length > 18 ? termText.slice(0, 17) + '…' : termText;
    const label = new CSS2DObject(labelEl);
    label.position.set(x, y - CUBE_SIZE - 0.22, 0);
    group.add(label);

    const posEl = document.createElement('div');
    posEl.className = 'label';
    posEl.style.fontSize = '9px';
    posEl.style.color = labelColor;
    posEl.style.opacity = '0.75';
    posEl.textContent = pos;
    const posLabel = new CSS2DObject(posEl);
    posLabel.position.set(x, y + CUBE_SIZE + 0.14, 0);
    group.add(posLabel);

    nodeMeshes[pos] = mesh;
    nodeLabels[pos] = { termEl: labelEl, posEl };
    nodePositions3D[pos] = new THREE.Vector3(x, y, 0);

    state.nodesById.set(mesh.uuid, { squareKey, position: pos, term: squareData[pos] });
  });

  const headerEl = document.createElement('div');
  headerEl.className = 'label square-header';
  headerEl.style.color = labelColor;
  const keySpan = document.createElement('span');
  keySpan.textContent = displayKey || squareKey;
  headerEl.appendChild(keySpan);
  if (parentTerm) {
    const parentSpan = document.createElement('span');
    parentSpan.className = 'parent';
    parentSpan.textContent = ` of ${parentTerm}`;
    headerEl.appendChild(parentSpan);
  }
  const headerLabel = new CSS2DObject(headerEl);
  headerLabel.position.set(0, 3.85, 0);
  group.add(headerLabel);

  state.diagramGroup.add(group);

  return { key: squareKey, title, parentTerm, squareData, group, nodeMeshes, nodeLabels, nodePositions3D };
}

// ---- Connectors ----

function buildConnectingLines() {
  const toRemove = [];
  state.diagramGroup.traverse(obj => {
    if (obj.userData && obj.userData.isConnector) toRemove.push(obj);
  });
  toRemove.forEach(obj => {
    if (obj.parent) obj.parent.remove(obj);
    obj.geometry.dispose();
    obj.material.dispose();
  });

  const A_group = state.squares.find(s => s.key === 'A');
  if (!A_group) return;

  const pairs = [
    { semePos: 'S1',  bKey: 'S1' },
    { semePos: 'S2',  bKey: 'S2' },
    { semePos: '~S2', bKey: '~S2' },
    { semePos: '~S1', bKey: '~S1' },
  ];

  const aLayout = LAYOUT['A'];

  pairs.forEach(({ semePos, bKey }) => {
    const aLocal = A_group.nodePositions3D[semePos];
    if (!aLocal) return;
    const aWorld = new THREE.Vector3(
      aLayout.position.x + aLocal.x * aLayout.scale,
      aLayout.position.y + aLocal.y * aLayout.scale,
      aLayout.position.z + aLocal.z * aLayout.scale
    );

    const bGroup = state.squares.find(s => s.key === bKey);
    if (!bGroup) return;
    const bLocal = bGroup.nodePositions3D['top'];
    if (!bLocal) return;
    const bLayout = LAYOUT[bKey];
    const bWorld = new THREE.Vector3(
      bLayout.position.x + bLocal.x * bLayout.scale,
      bLayout.position.y + bLocal.y * bLayout.scale,
      bLayout.position.z + bLocal.z * bLayout.scale
    );

    const geom = new THREE.BufferGeometry().setFromPoints([aWorld, bWorld]);
    const mat = new THREE.LineBasicMaterial({
      color: CONNECTOR_COLOR, transparent: true, opacity: 0.32, depthWrite: false,
    });
    const line = new THREE.Line(geom, mat);
    line.userData.isConnector = true;
    line.userData.baseOpacity = 0.32;
    state.diagramGroup.add(line);
  });
}

function clearScene() {
  while (state.diagramGroup.children.length > 0) {
    const c = state.diagramGroup.children[0];
    state.diagramGroup.remove(c);
    disposeGroup(c);
  }
  if (state.latticeGroup) {
    const latticeNode = state.latticeGroup.group;
    if (latticeNode) {
      scene.remove(latticeNode);
      disposeGroup(latticeNode);
    }
    state.latticeGroup = null;
  }
  state.squares = [];
  state.nodesById.clear();
  state.hoverTarget = null;
  state.pinnedTarget = null;
  state.latticeData = null;
  state.latticeHoverTarget = null;
  state.latticePinnedTarget = null;
  state.diagramOpacity = 1.0;
  state.latticeOpacity = 0.0;
  state.viewMode = 'diagram';
  state.viewpointLevel = 1;
  state.minimap = null;
  labelVisibilityCache.clear();
}

// =========================================================
// LATTICE
// =========================================================

function computeLatticeLayout(concepts, edges) {
  const idToIdx = {};
  concepts.forEach((c, i) => idToIdx[c.id] = i);

  const parents = Array.from({length: concepts.length}, () => []);
  const children = Array.from({length: concepts.length}, () => []);
  edges.forEach(([a, b]) => {
    const ai = idToIdx[a], bi = idToIdx[b];
    if (ai === undefined || bi === undefined) return;
    parents[bi].push(ai);
    children[ai].push(bi);
  });

  const rank = Array(concepts.length).fill(0);
  let changed = true, guard = 0;
  while (changed && guard++ < 200) {
    changed = false;
    for (let i = 0; i < concepts.length; i++) {
      for (const p of parents[i]) {
        if (rank[p] < rank[i] + 1) { rank[p] = rank[i] + 1; changed = true; }
      }
    }
  }

  const byRank = {};
  concepts.forEach((c, i) => { (byRank[rank[i]] ||= []).push(i); });
  for (const r in byRank) {
    byRank[r].sort((a, b) => {
      const oa = concepts[a].origin || 'A';
      const ob = concepts[b].origin || 'A';
      if (oa !== ob) return oa.localeCompare(ob);
      return String(concepts[a].id).localeCompare(String(concepts[b].id));
    });
  }

  const ySpacing = 1.85, xSpacing = 1.15;
  const maxRank = Math.max(...rank, 0);
  const positions = {};
  for (const r in byRank) {
    const list = byRank[r];
    const n = list.length;
    const totalWidth = (n - 1) * xSpacing;
    list.forEach((idx, k) => {
      const x = -totalWidth / 2 + k * xSpacing;
      const y = (Number(r) - maxRank / 2) * ySpacing;
      positions[concepts[idx].id] = { x, y, z: 2 };
    });
  }
  return { positions, rank, parents, children, idToIdx };
}

function buildLatticeScene(parsed) {
  const arch = parsed.architectonic;
  if (!arch || !Array.isArray(arch.concepts) || !Array.isArray(arch.edges)) return null;
  if (arch.concepts.length === 0) return null;

  const layout = computeLatticeLayout(arch.concepts, arch.edges);

  const group = new THREE.Group();
  group.visible = false;

  const meshes = {};
  const labels = {};

  const ancestors = [], descendants = [];
  for (let i = 0; i < arch.concepts.length; i++) {
    const anc = new Set(); const stack = [...layout.parents[i]];
    while (stack.length) { const j = stack.pop(); if (anc.has(j)) continue; anc.add(j); stack.push(...layout.parents[j]); }
    ancestors.push(anc);
    const desc = new Set(); const s2 = [...layout.children[i]];
    while (s2.length) { const j = s2.pop(); if (desc.has(j)) continue; desc.add(j); s2.push(...layout.children[j]); }
    descendants.push(desc);
  }

  const LATTICE_CUBE = 0.18;

  arch.concepts.forEach(c => {
    const p = layout.positions[c.id];
    if (!p) return;
    let baseColor, hex;
    if (c.role === 'shared_bottom' || c.role === 'architectonic_top') {
      baseColor = NEUTRAL_COLOR; hex = NEUTRAL_HEX;
    } else {
      baseColor = colorForSquare(c.origin || 'A');
      hex = hexForSquare(c.origin || 'A');
    }

    const geom = new THREE.BoxGeometry(LATTICE_CUBE, LATTICE_CUBE, LATTICE_CUBE);
    const mat = new THREE.MeshBasicMaterial({ color: baseColor, transparent: true, opacity: 0, depthWrite: false });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(p.x, p.y, p.z);
    mesh.userData = { conceptId: c.id, baseColor, baseOpacity: 0.95, role: c.role, origin: c.origin };
    group.add(mesh);
    meshes[c.id] = mesh;

    const labelEl = document.createElement('div');
    labelEl.className = 'label lattice-label';
    labelEl.style.color = hex;
    let text = c.short || c.label || '';
    if (text.length > 18) text = text.slice(0, 17) + '…';
    labelEl.textContent = text;
    const label = new CSS2DObject(labelEl);
    label.position.set(p.x, p.y + LATTICE_CUBE + 0.22, p.z);
    group.add(label);
    labels[c.id] = labelEl;
  });

  const edgeLines = [];
  arch.edges.forEach(([a, b]) => {
    const pa = layout.positions[a], pb = layout.positions[b];
    if (!pa || !pb) return;
    const geom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(pa.x, pa.y, pa.z), new THREE.Vector3(pb.x, pb.y, pb.z),
    ]);
    const mat = new THREE.LineBasicMaterial({ color: 0x556070, transparent: true, opacity: 0, depthWrite: false });
    const line = new THREE.Line(geom, mat);
    line.userData.baseOpacity = 0.55;
    group.add(line);
    edgeLines.push(line);
  });

  scene.add(group);
  return { group, meshes, labels, positions: layout.positions,
    concepts: arch.concepts, edges: arch.edges, idToIdx: layout.idToIdx,
    parents: layout.parents, children: layout.children,
    ancestors, descendants, edgeLines };
}

// =========================================================
// LABEL VISIBILITY CACHE
//
// We cache the last-applied dimmed-status per square so that label
// visibility toggling only happens when focus actually changes,
// not on every frame during a fade.
// =========================================================

const labelVisibilityCache = new Map();   // squareKey -> boolean (dimmed)

function refreshLabelVisibility(focusKey) {
  state.squares.forEach(sq => {
    const dimmed = !!(focusKey && sq.key !== focusKey);
    const prev = labelVisibilityCache.get(sq.key);
    if (prev === dimmed) return;
    labelVisibilityCache.set(sq.key, dimmed);

    sq.group.traverse(obj => {
      if (obj.isCSS2DObject) {
        const el = obj.element;
        if (!el) return;
        // Keep the square header visible so the diagram remains identifiable.
        const isHeader = el.classList && el.classList.contains('square-header');
        if (isHeader) return;
        obj.visible = !dimmed;
      }
    });
  });
}

// =========================================================
// PER-SQUARE OPACITY
// =========================================================

const DIM_MULTIPLIER = 0.30;

function refreshDiagramOpacities() {
  if (!state.squares.length) return;

  let focusKey = null;
  if (state.viewMode === 'diagram') {
    if (state.viewpointLevel === 2 && state.pinnedTarget) {
      focusKey = state.pinnedTarget.squareKey;
    } else {
      focusKey = state.focusedKey;
    }
  }

  // Toggle label visibility only when focus changes.
  refreshLabelVisibility(focusKey);

  state.squares.forEach(sq => {
    const dimmed = focusKey && sq.key !== focusKey;
    const multiplier = dimmed ? DIM_MULTIPLIER : 1.0;
    const squareOpacity = state.diagramOpacity * multiplier;

    sq.group.traverse(obj => {
      if (obj.material) {
        const base = obj.userData.baseOpacity ?? 1.0;
        const top = obj.userData.overrideOpacity !== undefined
          ? obj.userData.overrideOpacity
          : base;
        obj.material.opacity = top * squareOpacity;
      }
      if (obj.element) {
        obj.element.style.opacity = String(squareOpacity);
      }
    });

    sq.group.visible = squareOpacity > 0.01;
  });

  state.diagramGroup.children.forEach(child => {
    if (child.userData && child.userData.isConnector) {
      const base = child.userData.baseOpacity ?? 1.0;
      child.material.opacity = base * state.diagramOpacity;
      child.visible = state.diagramOpacity > 0.01;
    }
  });

  state.diagramGroup.visible = state.diagramOpacity > 0.01;
}

// =========================================================
// HIGHLIGHT — diagram
// =========================================================

function setNodeState(mesh, mode) {
  const mat = mesh.material;
  const baseColor = mesh.userData.baseColor;
  if (mode === 'highlight') {
    mat.color.setHex(HIGHLIGHT_HOVER);
    mesh.userData.overrideOpacity = 1.0;
    mesh.scale.setScalar(1.6);
  } else if (mode === 'dim') {
    mat.color.setHex(baseColor);
    mesh.userData.overrideOpacity = 0.14;
    mesh.scale.setScalar(0.72);
  } else {
    mat.color.setHex(baseColor);
    delete mesh.userData.overrideOpacity;
    mesh.scale.setScalar(1);
  }
}

function applyHighlight(target) {
  state.squares.forEach(sq => {
    Object.entries(sq.nodeMeshes).forEach(([pos, mesh]) => {
      setNodeState(mesh, 'normal');
      const lbl = sq.nodeLabels[pos];
      if (lbl) lbl.termEl.classList.remove('highlighted', 'dimmed');
    });
  });

  if (!target) { refreshDiagramOpacities(); markDirty(); return; }

  const targetSq = state.squares.find(s => s.key === target.squareKey);
  if (!targetSq) return;
  const targetTerm = targetSq.squareData[target.position] || '';

  state.squares.forEach(sq => {
    Object.entries(sq.nodeMeshes).forEach(([pos, mesh]) => {
      const term = sq.squareData[pos] || '';
      const matchByPos = (sq.key === target.squareKey && pos === target.position);
      const matchByTerm = term && term === targetTerm;
      if (matchByPos || matchByTerm) {
        setNodeState(mesh, 'highlight');
        const lbl = sq.nodeLabels[pos];
        if (lbl) lbl.termEl.classList.add('highlighted');
      } else {
        setNodeState(mesh, 'dim');
        const lbl = sq.nodeLabels[pos];
        if (lbl) lbl.termEl.classList.add('dimmed');
      }
    });
  });

  refreshDiagramOpacities();
  markDirty();
}

// =========================================================
// HIGHLIGHT — lattice
// =========================================================

function applyLatticeHighlight(conceptId) {
  const L = state.latticeData;
  if (!L) return;
  Object.values(L.meshes).forEach(m => {
    m.material.color.setHex(m.userData.baseColor);
    m.userData.overrideOpacity = 1.0;
    m.scale.setScalar(1);
  });
  Object.values(L.labels).forEach(el => el.classList.remove('highlighted', 'dimmed'));
  L.edgeLines.forEach(l => { l.material.color.setHex(0x556070); l.userData.overrideOpacity = 0.55; });

  if (conceptId === null || conceptId === undefined) {
    applyGroupOpacity(state.latticeGroup, state.latticeOpacity);
    markDirty();
    return;
  }
  const idx = L.idToIdx[conceptId];
  if (idx === undefined) return;
  const ancSet = L.ancestors[idx];
  const descSet = L.descendants[idx];

  Object.entries(L.meshes).forEach(([id, mesh]) => {
    const thisIdx = L.idToIdx[id];
    if (id === conceptId) {
      mesh.material.color.setHex(HIGHLIGHT_HOVER);
      mesh.userData.overrideOpacity = 1.0;
      mesh.scale.setScalar(1.7);
      L.labels[id].classList.add('highlighted');
    } else if (ancSet.has(thisIdx)) {
      mesh.material.color.setHex(HIGHLIGHT_ABOVE);
      mesh.userData.overrideOpacity = 0.95;
      mesh.scale.setScalar(1.15);
      L.labels[id].classList.add('highlighted');
    } else if (descSet.has(thisIdx)) {
      mesh.material.color.setHex(HIGHLIGHT_BELOW);
      mesh.userData.overrideOpacity = 0.95;
      mesh.scale.setScalar(1.15);
      L.labels[id].classList.add('highlighted');
    } else {
      mesh.material.color.setHex(HIGHLIGHT_DIMMED);
      mesh.userData.overrideOpacity = 0.35;
      mesh.scale.setScalar(0.85);
      L.labels[id].classList.add('dimmed');
    }
  });

  L.edges.forEach((e, i) => {
    const line = L.edgeLines[i];
    if (!line) return;
    const [a, b] = e;
    const ai = L.idToIdx[a], bi = L.idToIdx[b];
    if (ai === undefined || bi === undefined) return;
    if (a === conceptId || b === conceptId) {
      line.material.color.setHex(HIGHLIGHT_HOVER);
      line.userData.overrideOpacity = 0.9;
    } else if (ancSet.has(ai) && ancSet.has(bi)) {
      line.material.color.setHex(HIGHLIGHT_ABOVE);
      line.userData.overrideOpacity = 0.75;
    } else if (descSet.has(ai) && descSet.has(bi)) {
      line.material.color.setHex(HIGHLIGHT_BELOW);
      line.userData.overrideOpacity = 0.75;
    } else if (ancSet.has(ai) || ancSet.has(bi)) {
      line.material.color.setHex(HIGHLIGHT_ABOVE);
      line.userData.overrideOpacity = 0.55;
    } else if (descSet.has(ai) || descSet.has(bi)) {
      line.material.color.setHex(HIGHLIGHT_BELOW);
      line.userData.overrideOpacity = 0.55;
    } else {
      line.material.color.setHex(0x2a2e3d);
      line.userData.overrideOpacity = 0.2;
    }
  });

  applyGroupOpacity(state.latticeGroup, state.latticeOpacity);
  markDirty();
}

// =========================================================
// GROUP OPACITY (lattice only)
// =========================================================

function applyGroupOpacity(groupOrWrapper, opacity) {
  if (!groupOrWrapper) return;
  const group = (groupOrWrapper.isObject3D === true) ? groupOrWrapper : groupOrWrapper.group;
  if (!group || typeof group.traverse !== 'function') return;
  const rootOpacity = opacity;
  group.visible = rootOpacity > 0.01;
  group.traverse(obj => {
    if (obj.material) {
      const base = obj.userData.baseOpacity ?? 1.0;
      if (obj.userData.overrideOpacity !== undefined) {
        obj.material.opacity = obj.userData.overrideOpacity * rootOpacity;
      } else {
        obj.material.opacity = base * rootOpacity;
      }
    }
    if (obj.element) obj.element.style.opacity = rootOpacity;
  });
}

// =========================================================
// MINIMAP
// =========================================================

const POS_TO_LOCAL_ID = {
  'bottom': 0,
  'S1': 1, 'S2': 2, '~S1': 3, '~S2': 4,
  'M11': 5, 'M12': 6, 'M13': 7, 'M14': 8, 'Mixed1': 9, 'Mixed2': 10,
  'M21': 11, 'M22': 12, 'M23': 13, 'M24': 14,
  'top': 15,
};

function positionToLatticeId(squareKey, position) {
  const localId = POS_TO_LOCAL_ID[position];
  if (localId === undefined) return null;
  if (squareKey === 'A') {
    if (position === 'S1') return 'S1:15';
    if (position === 'S2') return 'S2:15';
    if (position === '~S1') return '~S1:15';
    if (position === '~S2') return '~S2:15';
    if (position === 'bottom') return 'A:0';
    if (position === 'top') return 'A:15';
    return `A:${localId}`;
  }
  if (position === 'bottom') return 'A:0';
  return `${squareKey}:${localId}`;
}

function buildMinimap() {
  const svg = document.getElementById('minimap-svg');
  svg.innerHTML = '';
  state.minimap = null;

  const L = state.latticeData;
  if (!L) return;

  const positions = L.positions;
  const concepts = L.concepts;
  const edges = L.edges;

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  Object.values(positions).forEach(p => {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });
  const bbW = Math.max(maxX - minX, 0.001);
  const bbH = Math.max(maxY - minY, 0.001);

  const VW = 220, VH = 220;
  const pad = 20;
  const scale = Math.min((VW - 2*pad) / bbW, (VH - 2*pad) / bbH);
  const cx = VW / 2, cy = VH / 2;
  const bbCx = (minX + maxX) / 2, bbCy = (minY + maxY) / 2;

  function toScreen(p) {
    return { x: cx + (p.x - bbCx) * scale, y: cy - (p.y - bbCy) * scale };
  }

  const edgeEls = [];
  edges.forEach((e) => {
    const pa = positions[e[0]], pb = positions[e[1]];
    if (!pa || !pb) return;
    const sa = toScreen(pa), sb = toScreen(pb);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', sa.x.toFixed(2));
    line.setAttribute('y1', sa.y.toFixed(2));
    line.setAttribute('x2', sb.x.toFixed(2));
    line.setAttribute('y2', sb.y.toFixed(2));
    line.setAttribute('stroke', MM_COLOR_DEFAULT);
    line.setAttribute('stroke-width', '0.6');
    line.setAttribute('stroke-opacity', '0.85');
    svg.appendChild(line);
    edgeEls.push({ line, a: e[0], b: e[1] });
  });

  const nodeEls = {};
  concepts.forEach(c => {
    const p = positions[c.id];
    if (!p) return;
    const s = toScreen(p);
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', (s.x - 1.9).toFixed(2));
    rect.setAttribute('y', (s.y - 1.9).toFixed(2));
    rect.setAttribute('width', '3.8');
    rect.setAttribute('height', '3.8');
    rect.setAttribute('fill', MM_COLOR_DEFAULT);
    svg.appendChild(rect);
    nodeEls[c.id] = rect;
  });

  state.minimap = {
    svg, nodeEls, edgeEls, positions, concepts,
    conceptById: Object.fromEntries(concepts.map(c => [c.id, c])),
  };

  updateMinimap();
}

function updateMinimap() {
  const mm = state.minimap;
  if (!mm) return;

  const inLattice = state.viewMode === 'lattice';
  const focusOrigin = state.focusedKey;
  const showDiagramYellow = !inLattice && state.viewpointLevel === 1;

  let pinnedLatticeId = null;
  if (state.pinnedTarget) {
    pinnedLatticeId = positionToLatticeId(state.pinnedTarget.squareKey, state.pinnedTarget.position);
  }

  Object.entries(mm.nodeEls).forEach(([id, rect]) => {
    const concept = mm.conceptById[id];
    if (!concept) return;
    let fill;
    if (inLattice) {
      fill = MM_COLOR_DIM;
    } else if (id === pinnedLatticeId) {
      fill = MM_COLOR_RED;
    } else if (showDiagramYellow && concept.origin === focusOrigin) {
      fill = MM_COLOR_YELLOW;
    } else {
      fill = MM_COLOR_DEFAULT;
    }
    rect.setAttribute('fill', fill);
  });

  mm.edgeEls.forEach(({ line, a, b }) => {
    const ca = mm.conceptById[a];
    const cb = mm.conceptById[b];
    if (!ca || !cb) return;
    let stroke, width;
    if (inLattice) {
      stroke = MM_COLOR_DIM; width = '0.6';
    } else if (showDiagramYellow && (ca.origin === focusOrigin || cb.origin === focusOrigin)) {
      stroke = MM_COLOR_YELLOW; width = '1.0';
    } else {
      stroke = MM_COLOR_DEFAULT; width = '0.6';
    }
    line.setAttribute('stroke', stroke);
    line.setAttribute('stroke-width', width);
  });

  const parts = [];
  if (inLattice) {
    parts.push('Lattice View');
  } else {
    const label = state.focusedKey === 'A' ? 'A1' : (B_INDEX[state.focusedKey] || state.focusedKey);
    parts.push(`Viewing ${label}`);
  }
  if (state.pinnedTarget) {
    const sq = state.squares.find(s => s.key === state.pinnedTarget.squareKey);
    if (sq) {
      const term = sq.squareData[state.pinnedTarget.position] || '';
      if (term) parts.push(`📌 ${term}`);
    }
  }
  const statusEl = document.getElementById('minimap-status');
  statusEl.textContent = parts.join(' · ');
}

// =========================================================
// BUILD ARCHITECTONIC
// =========================================================

function buildArchitectonic(parsed) {
  clearScene();

  const layer_1 = parsed.layer_1;
  const layer_2 = parsed.layer_2;
  if (!layer_1 || !layer_1.square) throw new Error('Missing layer_1.square');
  if (!layer_2 || typeof layer_2 !== 'object') throw new Error('Missing layer_2');

  state.data = parsed;

  const A = buildSquare(layer_1.square, 'A', 'Layer 1', null,
    LAYOUT.A.position, LAYOUT.A.scale, 'A1');
  state.squares.push(A);

  ['S1','S2','~S1','~S2'].forEach(semeKey => {
    const b = layer_2[semeKey];
    if (!b || !b.square) return;
    const sq = buildSquare(b.square, semeKey, 'Decomposition', b.parent_term || '',
      LAYOUT[semeKey].position, LAYOUT[semeKey].scale, B_DISPLAY[semeKey]);
    state.squares.push(sq);
  });

  buildConnectingLines();

  state.latticeGroup = buildLatticeScene(parsed);
  state.latticeData = state.latticeGroup;

  refreshDiagramOpacities();
  if (state.latticeGroup) applyGroupOpacity(state.latticeGroup, state.latticeOpacity);

  updateNodeInfo(null);
  renderLegend();
  buildMinimap();

  state.focusedKey = 'A';
  state.level = 'A';
  state.lastDiagramKey = 'A';
  setFocus('A', false, 'default');
  updateNavButtons();
  markDirty();
}

// =========================================================
// NODE INFO
// =========================================================

const COMPOSITIONS = {
  'S1': 'S1 + S2 → M11 · S1 + ~S2 → M13 · S1 + ~S1 → Mixed1',
  'S2': 'S1 + S2 → M11 · S2 + ~S1 → M14 · S2 + ~S2 → Mixed2',
  '~S2': '~S1 + ~S2 → M12 · S1 + ~S2 → M13 · S2 + ~S2 → Mixed2',
  '~S1': '~S1 + ~S2 → M12 · S2 + ~S1 → M14 · S1 + ~S1 → Mixed1',
  'M11': 'complex axis: S1 + S2',
  'M12': 'neutral axis: ~S1 + ~S2',
  'M13': 'positive deixis: S1 + ~S2',
  'M14': 'negative deixis: S2 + ~S1',
  'M21': 'contains S1, S2, ~S2 (omits ~S1)',
  'M22': 'contains S1, S2, ~S1 (omits ~S2)',
  'M23': 'contains S1, ~S1, ~S2 (omits S2)',
  'M24': 'contains S2, ~S1, ~S2 (omits S1)',
  'Mixed1': 'undifferentiated axis: S1 + ~S1',
  'Mixed2': 'undifferentiated axis: S2 + ~S2',
  'top': 'all four inner semes',
  'bottom': 'empty extent, all M2 attributes',
};

function displayLabelFor(sq) {
  if (!sq) return '';
  if (sq.key === 'A') return 'A1';
  return B_DISPLAY[sq.key] || sq.key;
}

function updateNodeInfo(target) {
  const el = document.getElementById('node-info');
  if (!target) {
    el.innerHTML = '<em style="color:var(--text-dim);">Hover or click a node.</em>';
    return;
  }

  if (target.mode === 'lattice') {
    const L = state.latticeData;
    if (!L) { el.innerHTML = ''; return; }
    const concept = L.concepts.find(c => c.id === target.conceptId);
    if (!concept) return;
    let html = `<h4>${concept.label}</h4>`;
    html += `<div class="kv"><span class="k">id:</span> <code>${concept.id}</code></div>`;
    if (concept.role) html += `<div class="kv"><span class="k">role:</span> ${concept.role.replace(/_/g, ' ')}</div>`;
    if (concept.origin) html += `<div class="kv"><span class="k">origin:</span> ${concept.origin}</div>`;
    if (concept.extent && concept.extent.length) {
      html += `<div class="kv"><span class="k">extent:</span> `;
      html += concept.extent.map(e => `<span class="chip">${e}</span>`).join(' ');
      html += `</div>`;
    }
    if (concept.intent && concept.intent.length) {
      html += `<div class="kv"><span class="k">intent:</span> `;
      html += concept.intent.map(e => `<span class="chip">${e}</span>`).join(' ');
      html += `</div>`;
    }
    const idx = L.idToIdx[concept.id];
    if (idx !== undefined) {
      html += `<div class="kv"><span class="k">ancestors:</span> ${L.ancestors[idx].size}</div>`;
      html += `<div class="kv"><span class="k">descendants:</span> ${L.descendants[idx].size}</div>`;
    }
    el.innerHTML = html;
    return;
  }

  const sq = state.squares.find(s => s.key === target.squareKey);
  if (!sq) { el.innerHTML = ''; return; }
  const pos = target.position;
  const term = sq.squareData[pos] || '';

  let html = `<h4 style="color:${hexForSquare(sq.key)}">${displayLabelFor(sq)} · ${pos}</h4>`;
  html += `<div class="kv"><span class="k">Term:</span> ${term || '—'}</div>`;
  if (sq.parentTerm) html += `<div class="kv"><span class="k">Decomposes:</span> ${sq.parentTerm}</div>`;
  if (COMPOSITIONS[pos]) html += `<div class="kv"><span class="k">Structure:</span> ${COMPOSITIONS[pos]}</div>`;

  if (term) {
    const appearances = [];
    state.squares.forEach(other => {
      if (other.key === target.squareKey) return;
      Object.entries(other.squareData).forEach(([p, t]) => {
        if (t === term) appearances.push(`${displayLabelFor(other)}·${p}`);
      });
    });
    if (appearances.length) {
      html += `<div class="kv"><span class="k">Also appears on:</span><br>`;
      appearances.forEach(a => { html += `<span class="chip">${a}</span>`; });
      html += `</div>`;
    }
  }
  el.innerHTML = html;
}

// =========================================================
// RAYCASTING
// =========================================================

function updateMouseFromEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  state.mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  state.mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
}

function pickNode() {
  state.raycaster.setFromCamera(state.mouse, camera);

  if (state.viewMode === 'lattice' && state.latticeData) {
    const meshes = Object.values(state.latticeData.meshes);
    const hits = state.raycaster.intersectObjects(meshes, false);
    if (hits.length === 0) return null;
    return { mode: 'lattice', conceptId: hits[0].object.userData.conceptId };
  }

  const meshes = [];
  state.squares.forEach(sq => {
    Object.values(sq.nodeMeshes).forEach(m => meshes.push(m));
  });
  const hits = state.raycaster.intersectObjects(meshes, false);
  if (hits.length === 0) return null;
  const mesh = hits[0].object;
  const data = state.nodesById.get(mesh.uuid);
  return data ? { mode: 'diagram', squareKey: data.squareKey, position: data.position } : null;
}

// Raycast throttling: cap to ~30 Hz for hover picking.
let lastRaycastTime = 0;
const RAYCAST_INTERVAL_MS = 33;
let rafPending = false;

renderer.domElement.addEventListener('pointermove', (ev) => {
  updateMouseFromEvent(ev);
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;

    const now = performance.now();
    if (now - lastRaycastTime < RAYCAST_INTERVAL_MS) return;
    lastRaycastTime = now;

    if (state.viewMode === 'lattice') {
      if (state.latticePinnedTarget !== null && state.latticePinnedTarget !== undefined) return;
      const hit = pickNode();
      const newId = hit ? hit.conceptId : null;
      if (state.latticeHoverTarget !== newId) {
        state.latticeHoverTarget = newId;
        applyLatticeHighlight(newId);
        if (newId !== null) {
          updateNodeInfo({ mode: 'lattice', conceptId: newId });
          document.body.style.cursor = 'pointer';
        } else {
          if (state.latticePinnedTarget === null) updateNodeInfo(null);
          document.body.style.cursor = 'default';
        }
      }
      return;
    }

    if (state.pinnedTarget) return;
    const hit = pickNode();
    if (hit) {
      const prev = state.hoverTarget;
      if (!prev || hit.squareKey !== prev.squareKey || hit.position !== prev.position) {
        state.hoverTarget = hit;
        applyHighlight(hit);
        updateNodeInfo(hit);
        document.body.style.cursor = 'pointer';
      }
    } else {
      if (state.hoverTarget) {
        state.hoverTarget = null;
        if (state.pinnedTarget) {
          applyHighlight(state.pinnedTarget);
          updateNodeInfo(state.pinnedTarget);
        } else {
          applyHighlight(null);
          updateNodeInfo(null);
        }
        document.body.style.cursor = 'default';
      }
    }
  });
});

renderer.domElement.addEventListener('click', (ev) => {
  updateMouseFromEvent(ev);
  const hit = pickNode();

  if (state.viewMode === 'lattice') {
    if (!hit) {
      if (state.latticePinnedTarget !== null) {
        state.latticePinnedTarget = null;
        const hoverId = state.latticeHoverTarget;
        applyLatticeHighlight(hoverId);
        updateNodeInfo(hoverId !== null ? { mode: 'lattice', conceptId: hoverId } : null);
      }
      return;
    }
    const id = hit.conceptId;
    if (state.latticePinnedTarget === id) {
      state.latticePinnedTarget = null;
      const hoverId = state.latticeHoverTarget;
      applyLatticeHighlight(hoverId);
      updateNodeInfo(hoverId !== null ? { mode: 'lattice', conceptId: hoverId } : null);
    } else {
      state.latticePinnedTarget = id;
      applyLatticeHighlight(id);
      updateNodeInfo({ mode: 'lattice', conceptId: id });
    }
    return;
  }

  if (!hit) {
    if (state.viewpointLevel === 2) {
      exitViewpoint2();
    } else if (state.pinnedTarget) {
      state.pinnedTarget = null;
      if (state.hoverTarget) {
        applyHighlight(state.hoverTarget);
        updateNodeInfo(state.hoverTarget);
      } else {
        applyHighlight(null);
        updateNodeInfo(null);
      }
      updateNavButtons();
      updateMinimap();
      refreshDiagramOpacities();
    }
    return;
  }

  const same = state.pinnedTarget
    && state.pinnedTarget.squareKey === hit.squareKey
    && state.pinnedTarget.position === hit.position;

  if (same) {
    if (state.viewpointLevel === 1) {
      enterViewpoint2(state.pinnedTarget);
    } else {
      exitViewpoint2();
    }
  } else {
    state.pinnedTarget = hit;
    applyHighlight(hit);
    updateNodeInfo(hit);
    if (state.viewpointLevel === 2) {
      enterViewpoint2(hit);
    } else {
      updateNavButtons();
    }
    updateMinimap();
    refreshDiagramOpacities();
  }
});

// =========================================================
// VIEWPOINT 2
// =========================================================

function getNodeWorldPosition(squareKey, position) {
  const sq = state.squares.find(s => s.key === squareKey);
  if (!sq) return null;
  const local = sq.nodePositions3D[position];
  if (!local) return null;
  const layout = LAYOUT[squareKey];
  if (!layout) return null;
  return new THREE.Vector3(
    layout.position.x + local.x * layout.scale,
    layout.position.y + local.y * layout.scale,
    layout.position.z + local.z * layout.scale
  );
}

function animateCameraTo(camPos, target) {
  state.anim.active = true;
  state.anim.t = 0;
  state.anim.lastTime = performance.now();
  state.anim.fromCam.copy(camera.position);
  state.anim.toCam.copy(camPos);
  state.anim.fromLook.copy(controls.target);
  state.anim.toLook.copy(target);
  markDirty();
}

function enterViewpoint2(pin) {
  if (!pin) return;
  const nodePos = getNodeWorldPosition(pin.squareKey, pin.position);
  if (!nodePos) return;
  state.viewpointLevel = 2;
  const camPos = nodePos.clone().add(VP2_OFFSET);
  animateCameraTo(camPos, nodePos.clone());
  controls.minDistance = 0.8;
  controls.maxDistance = 20;
  updateNavButtons();
  updateMinimap();
  refreshDiagramOpacities();
}

function exitViewpoint2() {
  state.viewpointLevel = 1;
  controls.minDistance = 3;
  controls.maxDistance = 120;
  setFocus(state.focusedKey, true, 'default');
  updateNavButtons();
  updateMinimap();
  refreshDiagramOpacities();
}

// =========================================================
// FOCUS / CAMERA
// =========================================================

function computeFocusCamera(key, mode) {
  const layout = LAYOUT[key];
  if (!layout) return null;
  const focusPos = new THREE.Vector3(layout.position.x, layout.position.y, layout.position.z);
  const offset = (VIEW_OFFSETS[mode] || VIEW_OFFSETS.default).clone();
  return { camPos: focusPos.clone().add(offset), focusPos };
}

function computeLatticeCamera(mode) {
  const focusPos = new THREE.Vector3(0, 0, 2);
  const offset = (VIEW_OFFSETS[mode] || VIEW_OFFSETS.lattice).clone();
  return { camPos: focusPos.clone().add(offset), focusPos };
}

function setFocus(key, animate=true, mode='default') {
  if (!LAYOUT[key]) return;
  state.focusedKey = key;
  state.level = (key === 'A') ? 'A' : 'B';
  state.lastDiagramKey = key;

  if (state.viewpointLevel === 2) {
    state.viewpointLevel = 1;
    controls.minDistance = 3;
    controls.maxDistance = 120;
  }

  const target = computeFocusCamera(key, mode);
  if (!target) return;

  if (!animate) {
    camera.position.copy(target.camPos);
    controls.target.copy(target.focusPos);
    controls.update();
  } else {
    animateCameraTo(target.camPos, target.focusPos);
  }

  updateNavButtons();
  updateMinimap();
  refreshDiagramOpacities();
  markDirty();
}

function setViewMode(mode) {
  if (state.viewMode === 'lattice') {
    const target = computeLatticeCamera(mode);
    animateCameraTo(target.camPos, target.focusPos);
  } else {
    if (state.viewpointLevel === 2) {
      state.viewpointLevel = 1;
      controls.minDistance = 3;
      controls.maxDistance = 120;
    }
    setFocus(state.focusedKey, true, mode);
  }
}

function updateNavButtons() {
  const levelBtn = document.getElementById('level-btn');
  const cycleBtn = document.getElementById('cycle-btn');
  const latticeBtn = document.getElementById('lattice-btn');
  const focusBtn = document.getElementById('node-focus-btn');

  if (state.viewMode === 'lattice') {
    levelBtn.classList.add('disabled'); levelBtn.disabled = true;
    cycleBtn.classList.add('disabled'); cycleBtn.disabled = true;
    latticeBtn.classList.add('active');
    latticeBtn.textContent = '⊟ Diagram View';
    focusBtn.classList.add('disabled'); focusBtn.disabled = true;
    focusBtn.classList.remove('active');
    focusBtn.textContent = '⊙ Focus Node';
    return;
  }

  latticeBtn.classList.remove('active');
  latticeBtn.textContent = '⊞ Lattice View';
  levelBtn.classList.remove('disabled'); levelBtn.disabled = false;

  if (state.level === 'A') {
    levelBtn.textContent = '→ B Level';
    cycleBtn.classList.add('disabled'); cycleBtn.disabled = true;
  } else {
    levelBtn.textContent = '→ A Level';
    cycleBtn.classList.remove('disabled'); cycleBtn.disabled = false;
  }

  if (!state.pinnedTarget) {
    focusBtn.classList.add('disabled'); focusBtn.disabled = true;
    focusBtn.classList.remove('active');
    focusBtn.textContent = '⊙ Focus Node';
  } else if (state.viewpointLevel === 1) {
    focusBtn.classList.remove('disabled'); focusBtn.disabled = false;
    focusBtn.classList.remove('active');
    focusBtn.textContent = '⊙ Focus Node';
  } else {
    focusBtn.classList.remove('disabled'); focusBtn.disabled = false;
    focusBtn.classList.add('active');
    focusBtn.textContent = '⊙ Exit Focus';
  }
}

function toggleLevel() {
  if (state.viewMode === 'lattice') return;
  if (state.level === 'A') setFocus(B_CYCLE_ORDER[0], true, 'default');
  else setFocus('A', true, 'default');
}

function cycleB(direction = 1) {
  if (state.viewMode === 'lattice') return;
  if (state.level !== 'B') return;
  const idx = B_CYCLE_ORDER.indexOf(state.focusedKey);
  const next = ((idx === -1 ? 0 : idx) + direction + B_CYCLE_ORDER.length) % B_CYCLE_ORDER.length;
  setFocus(B_CYCLE_ORDER[next], true, 'default');
}

// =========================================================
// LATTICE TOGGLE
// =========================================================

function toggleLatticeView() {
  if (!state.latticeData) return;
  const entering = state.viewMode === 'diagram';
  if (entering) state.lastDiagramKey = state.focusedKey;

  if (entering && state.viewpointLevel === 2) {
    state.viewpointLevel = 1;
    controls.minDistance = 3;
    controls.maxDistance = 120;
  }

  state.viewMode = entering ? 'lattice' : 'diagram';

  state.fade.active = true;
  state.fade.t = 0;
  state.fade.lastTime = performance.now();
  state.fade.to = entering ? 'lattice' : 'diagram';

  const target = entering
    ? computeLatticeCamera('lattice')
    : computeFocusCamera(state.lastDiagramKey, 'default');
  if (target) animateCameraTo(target.camPos, target.focusPos);

  document.getElementById('lattice-mode-badge').classList.toggle('visible', entering);

  applyHighlight(null);
  applyLatticeHighlight(null);
  state.latticeHoverTarget = null;
  state.latticePinnedTarget = null;
  state.hoverTarget = null;
  state.pinnedTarget = null;
  updateNodeInfo(null);

  updateNavButtons();
  updateMinimap();
  refreshDiagramOpacities();
  markDirty();
}

function handleJsonApply() {
  const ta = document.getElementById('json-input');
  const status = document.getElementById('json-status');
  const raw = ta.value.trim();
  if (!raw) { status.className = 'err'; status.textContent = 'Paste JSON first.'; return; }
  let parsed;
  try { parsed = JSON.parse(raw); }
  catch (e) { status.className = 'err'; status.textContent = `JSON parse error: ${e.message}`; return; }
  try {
    buildArchitectonic(parsed);
    status.className = 'ok';
    status.textContent = `Loaded ${state.squares.length} squares.`;
  } catch (e) {
    console.error(e);
    status.className = 'err';
    status.textContent = `Structure error: ${e.message}`;
  }
}

// =========================================================
// ANIMATION LOOP
// =========================================================

function smoothstep(t) { return t * t * (3 - 2 * t); }

function animate(now) {
  requestAnimationFrame(animate);

  let needsFrame = renderPending;

  if (state.anim.active) {
    const dt = (now - state.anim.lastTime) / 1000;
    state.anim.lastTime = now;
    state.anim.t += dt / state.anim.duration;
    const t = Math.min(state.anim.t, 1);
    const e = smoothstep(t);
    camera.position.lerpVectors(state.anim.fromCam, state.anim.toCam, e);
    controls.target.lerpVectors(state.anim.fromLook, state.anim.toLook, e);
    if (t >= 1) state.anim.active = false;
    needsFrame = true;
  }

  if (state.fade.active) {
    const dt = (now - state.fade.lastTime) / 1000;
    state.fade.lastTime = now;
    state.fade.t += dt / state.fade.duration;
    const t = Math.min(state.fade.t, 1);
    const e = smoothstep(t);

    if (state.fade.to === 'lattice') {
      state.diagramOpacity = 1 - e;
      state.latticeOpacity = e;
    } else {
      state.diagramOpacity = e;
      state.latticeOpacity = 1 - e;
    }
    refreshDiagramOpacities();
    if (state.latticeGroup) applyGroupOpacity(state.latticeGroup, state.latticeOpacity);

    if (t >= 1) {
      state.fade.active = false;
      if (state.fade.to === 'lattice') state.diagramGroup.visible = false;
      else if (state.latticeGroup) state.latticeGroup.visible = false;
    }
    needsFrame = true;
  }

  controls.update();

  const camHash = hashCamera();
  if (camHash !== lastCamHash) {
    lastCamHash = camHash;
    needsFrame = true;
  }

  if (needsFrame) {
    renderPending = false;
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
}
requestAnimationFrame(animate);

      for (let i = 1; i <= 14; i++) { if (i === 15) continue; add(`${k}:${i}`, `${k} ${i}`, `${k}:${i}`, 'layer_2_internal', k, 2, []); }
    });
    [['A:11'],['A:12'],['A:13'],['A:14']].forEach(([id]) => edges.push(['A:15', id]));
    edges.push(['A:11','A:9'],['A:11','A:7'],['A:11','A:10']);
    edges.push(['A:12','A:9'],['A:12','A:10']);
    edges.push(['A:13','A:6'],['A:13','A:7'],['A:13','A:9']);
    edges.push(['A:14','A:6'],['A:14','A:10']);
    edges.push(['A:9','S1:15'],['A:9','S2:15'],['A:9','~S1:15'],['A:9','~S2:15']);
    edges.push(['A:6','~S1:15'],['A:6','~S2:15']);
    edges.push(['A:7','S1:15'],['A:7','~S2:15']);
    edges.push(['A:10','S2:15'],['A:10','~S1:15']);
    ['S1','S2','~S1','~S2'].forEach(k => {
      for (let i = 11; i <= 14; i++) edges.push([`${k}:15`, `${k}:${i}`]);
      edges.push([`${k}:11`,`${k}:5`],[`${k}:11`,`${k}:7`],[`${k}:11`,`${k}:10`]);
      edges.push([`${k}:12`,`${k}:5`],[`${k}:12`,`${k}:8`],[`${k}:12`,`${k}:9`]);
      edges.push([`${k}:13`,`${k}:6`],[`${k}:13`,`${k}:7`],[`${k}:13`,`${k}:9`]);
      edges.push([`${k}:14`,`${k}:6`],[`${k}:14`,`${k}:8`],[`${k}:14`,`${k}:10`]);
      edges.push([`${k}:5`,`${k}:1`],[`${k}:5`,`${k}:2`]);
      edges.push([`${k}:6`,`${k}:4`],[`${k}:6`,`${k}:3`]);
      edges.push([`${k}:7`,`${k}:1`],[`${k}:7`,`${k}:3`]);
      edges.push([`${k}:8`,`${k}:2`],[`${k}:8`,`${k}:4`]);
      edges.push([`${k}:9`,`${k}:1`],[`${k}:9`,`${k}:4`]);
      edges.push([`${k}:10`,`${k}:2`],[`${k}:10`,`${k}:3`]);
      edges.push([`${k}:1`,'A:0'],[`${k}:2`,'A:0'],[`${k}:3`,'A:0'],[`${k}:4`,'A:0']);
    });
    return { concepts, edges };
  })(),
};

// =========================================================
// INIT
// =========================================================

(function init() {
  try {
    const ta = document.getElementById('json-input');
    ta.value = JSON.stringify(DEMO, null, 2);
    buildArchitectonic(DEMO);
    setFocus('A', false, 'default');
    updateNavButtons();
    updateMinimap();
    markDirty();
  } catch (err) {
    console.error('Init error:', err);
    const el = document.getElementById('loading');
    if (el) {
      el.innerHTML = '<div style="text-align:center; max-width:640px; padding:20px;">'
        + '<div style="color:#ff6b6b;font-size:14px;margin-bottom:10px;">Init error</div>'
        + '<div style="font-family:ui-monospace,monospace;font-size:11px;color:#8a93ab;'
        + 'white-space:pre-wrap;text-align:left;">'
        + (err.message || String(err)) + '\n\n' + (err.stack || '')
        + '</div></div>';
      return;
    }
  }
  setTimeout(() => {
    const el = document.getElementById('loading');
    if (el) el.classList.add('hidden');
  }, 300);
})();
</script>
