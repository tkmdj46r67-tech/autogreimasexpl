<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architectonic Greimas Viewer — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(9,13,22,0.92);
    --text: #e9edf7;
    --text-dim: #8a93ab;
    --accent: #5b9bd5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Archivo', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  input, textarea, button { font-family: inherit; }

  #canvas-container { position: fixed; inset: 0; }

  #top-bar {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .btn {
    padding: 10px 14px; min-height: 40px;
    border-radius: 9px; cursor: pointer;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: #c8d0e6; background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: background .15s, border-color .15s, color .15s;
    user-select: none;
  }
  .btn:hover { background: rgba(126,160,255,.16); border-color: rgba(126,160,255,.4); color: #fff; }
  .btn:active { transform: translateY(1px); }

  #ui {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    width: 380px; max-height: calc(100vh - 28px); overflow-y: auto;
    padding: 14px 16px; border-radius: 12px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    transition: transform .3s, opacity .3s;
  }
  body.panels-hidden #ui { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }

  .sec { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 10px 0; }
  .sec:last-child { border-bottom: none; }
  .sec-title {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);
    user-select: none;
  }
  .sec-title:hover { color: #c8d0e6; }
  .sec-body { max-height: 0; overflow: hidden; transition: max-height .3s; }
  .sec.open .sec-body { max-height: 2000px; }
  .sec-content { padding: 10px 0 4px; }
  .chev { font-size: 10px; transition: transform .25s; }
  .sec.open .chev { transform: rotate(180deg); }

  #json-input {
    width: 100%; min-height: 120px; resize: vertical;
    background: #0a0d1a; color: var(--text);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; line-height: 1.5;
  }
  #json-status { font-size: 11px; margin-top: 6px; }
  #json-status.ok { color: #6fdc8c; }
  #json-status.err { color: #ff6b6b; }

  #node-info {
    padding: 10px 12px;
    background: rgba(15,20,32,0.8); border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 11.5px; line-height: 1.55;
    max-height: 260px; overflow-y: auto;
    min-height: 80px;
  }
  #node-info h4 { margin: 0 0 6px; font-size: 12.5px; color: #ffd23f; }
  #node-info .kv { margin-bottom: 5px; }
  #node-info .k { color: var(--text-dim); }
  #node-info .chip {
    display: inline-block; padding: 1px 7px; border-radius: 8px;
    background: #22304d; color: #cce0ff; font-size: 10.5px;
    margin: 2px 3px 2px 0;
  }

  .legend {
    display: flex; flex-wrap: wrap; gap: 12px;
    font-size: 10.5px; color: var(--text-dim);
    padding: 8px 0;
  }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 5px;
    vertical-align: middle; position: relative; top: -1px;
  }

  /* 3D labels */
  .label {
    color: #c8d0e6;
    font-size: 11px;
    font-weight: 600;
    text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,1);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    padding: 1px 4px;
    border-radius: 4px;
    transition: color .15s;
  }
  .label.square-header {
    color: #ffd23f;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .label.square-header .parent {
    color: var(--text-dim); font-weight: 500; font-style: italic;
    text-transform: none; letter-spacing: 0; font-size: 11.5px;
  }
  .label.highlighted { color: #fff3c4; text-shadow: 0 0 12px rgba(255,210,63,1), 0 0 3px rgba(0,0,0,1); }
  .label.dimmed { color: #4a5170; }

  .loading {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: var(--bg); color: var(--text-dim);
    font-size: 13px; z-index: 100;
    transition: opacity .5s;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="top-bar">
  <button class="btn" id="panel-toggle">◱ Hide Panels</button>
  <button class="btn" id="view-reset">⌖ Reset View</button>
  <button class="btn" id="view-top">▣ Top</button>
  <button class="btn" id="view-front">▤ Front</button>
</div>

<div id="ui">
  <div class="sec open" data-sec>
    <div class="sec-title"><span>Load JSON</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <textarea id="json-input" spellcheck="false" placeholder="Paste the architectonic JSON from greimas_architectonic.py here."></textarea>
      <div id="json-status"></div>
      <button class="btn" id="json-apply" style="margin-top:8px; width:100%;">Update</button>
    </div></div>
  </div>

  <div class="sec open" data-sec>
    <div class="sec-title"><span>Node Info</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <div id="node-info"><em style="color:var(--text-dim);">Hover or click a node.</em></div>
    </div></div>
  </div>

  <div class="sec open" data-sec>
    <div class="sec-title"><span>Legend</span><span class="chev">▾</span></div>
    <div class="sec-body"><div class="sec-content">
      <div class="legend">
        <span><span class="dot" style="background:#ffd23f"></span>Inner semes</span>
        <span><span class="dot" style="background:#5b9bd5"></span>M1 meta-terms</span>
        <span><span class="dot" style="background:#3fa34d"></span>M2 meta-terms</span>
        <span><span class="dot" style="background:#c9a227"></span>Mixed</span>
        <span><span class="dot" style="background:#666"></span>Top / Bottom</span>
      </div>
    </div></div>
  </div>
</div>

<div class="loading" id="loading">Building architectonic...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// =========================================================
// GREIMAS SQUARE GEOMETRY
// =========================================================

// Local coordinates for each position, in the square's own XY plane.
// The square is roughly 4.4 units wide and 6.4 units tall.
const SQ_POS = {
  top:      [ 0.0,  3.20],
  M21:      [-2.20,  2.20],
  M22:      [-0.75,  2.20],
  M23:      [ 0.75,  2.20],
  M24:      [ 2.20,  2.20],
  M11:      [ 0.0,   1.40],
  S1:       [-1.10,  0.70],
  S2:       [ 1.10,  0.70],
  M13:      [-2.20,  0.00],
  Mixed1:   [-0.75,  0.00],
  Mixed2:   [ 0.75,  0.00],
  M14:      [ 2.20,  0.00],
  '~S2':    [-1.10, -0.70],
  '~S1':    [ 1.10, -0.70],
  M12:      [ 0.0,  -1.40],
  bottom:   [ 0.0,  -3.20],
};

// Edges of the Greimas square graph.
const SQ_EDGES = [
  ['top','M21'], ['top','M22'], ['top','M23'], ['top','M24'],
  ['M21','M11'], ['M21','M13'],
  ['M22','M11'], ['M22','M14'],
  ['M23','M12'], ['M23','M13'],
  ['M24','M12'], ['M24','M14'],
  ['M11','S1'], ['M11','S2'],
  ['M12','~S2'], ['M12','~S1'],
  ['M13','S1'], ['M13','~S2'],
  ['M14','S2'], ['M14','~S1'],
  ['Mixed1','S1'], ['Mixed1','~S1'],
  ['Mixed2','S2'], ['Mixed2','~S2'],
  ['S1','bottom'], ['S2','bottom'], ['~S2','bottom'], ['~S1','bottom'],
  ['S1','S2'], ['~S2','~S1'],
  ['S1','~S2'], ['S2','~S1'],
  ['S1','~S1'], ['S2','~S2'],
];

// Color per position.
function colorForPosition(pos) {
  if (['S1','S2','~S1','~S2'].includes(pos)) return 0xffd23f;
  if (pos.startsWith('M1')) return 0x5b9bd5;
  if (pos.startsWith('M2')) return 0x3fa34d;
  if (pos.startsWith('Mixed')) return 0xc9a227;
  if (pos === 'top' || pos === 'bottom') return 0x666666;
  return 0x5b9bd5;
}

// Edge style by relation type.
function styleForEdge(a, b) {
  const innerSq = new Set(['S1','S2','~S2','~S1']);
  if (innerSq.has(a) && innerSq.has(b)) return { color: 0xc9a227, dashed: true, width: 1.6 };
  if (a.startsWith('M1') || b.startsWith('M1')) return { color: 0x4a7bb5, dashed: false, width: 1.4 };
  if (a.startsWith('M2') || b.startsWith('M2')) return { color: 0x3a8544, dashed: false, width: 1.3 };
  if (a.startsWith('Mixed') || b.startsWith('Mixed')) return { color: 0x8a7033, dashed: false, width: 1.3 };
  return { color: 0x555555, dashed: false, width: 1.1 };
}

// =========================================================
// SCENE SETUP
// =========================================================

const container = document.getElementById('canvas-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.FogExp2(0x05070d, 0.012);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(14, 8, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 80;
controls.target.set(0, 2, 0);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(6, 12, 8);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x88aaff, 0.4);
fillLight.position.set(-8, 4, -6);
scene.add(fillLight);

// =========================================================
// STATE
// =========================================================

const state = {
  data: null,
  squares: [],          // [{key, title, parentTerm, squareData, group, nodeMeshes: {pos: mesh}, nodeLabels: {pos: labelEl}, nodePositions3D: {pos: vec3}}]
  nodesById: new Map(), // mesh.uuid -> {squareKey, position, term}
  hoverTarget: null,    // {squareKey, position}
  pinnedTarget: null,
  raycaster: new THREE.Raycaster(),
  mouse: new THREE.Vector2(-10, -10),
};

// =========================================================
// SQUARE CONSTRUCTION
// =========================================================

const NODE_RADIUS = 0.16;

function buildSquare(squareData, squareKey, title, parentTerm, position, scale) {
  const group = new THREE.Group();
  group.position.set(position.x, position.y, position.z);
  group.scale.setScalar(scale);

  const nodeMeshes = {};
  const nodeLabels = {};
  const nodePositions3D = {};

  // Build edges first (so nodes render on top)
  SQ_EDGES.forEach(([a, b]) => {
    if (!SQ_POS[a] || !SQ_POS[b]) return;
    const [x1, y1] = SQ_POS[a];
    const [x2, y2] = SQ_POS[b];
    const style = styleForEdge(a, b);

    const geom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x1, y1, 0),
      new THREE.Vector3(x2, y2, 0),
    ]);
    const matOpts = {
      color: style.color,
      transparent: true,
      opacity: style.dashed ? 0.9 : 0.65,
      linewidth: style.width,
    };
    const mat = new THREE.LineBasicMaterial(matOpts);
    if (style.dashed) {
      const dashMat = new THREE.LineDashedMaterial({
        color: style.color,
        dashSize: 0.15,
        gapSize: 0.08,
        transparent: true,
        opacity: 0.9,
      });
      const line = new THREE.Line(geom, dashMat);
      line.computeLineDistances();
      group.add(line);
    } else {
      const line = new THREE.Line(geom, mat);
      group.add(line);
    }
  });

  // Build nodes
  Object.entries(SQ_POS).forEach(([pos, [x, y]]) => {
    const color = colorForPosition(pos);
    const geom = new THREE.SphereGeometry(NODE_RADIUS, 20, 20);
    const mat = new THREE.MeshStandardMaterial({
      color,
      roughness: 0.45,
      metalness: 0.1,
      emissive: 0x000000,
      emissiveIntensity: 0,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(x, y, 0);
    mesh.userData = {
      squareKey,
      position: pos,
      term: squareData[pos] || '',
      baseColor: color,
    };
    group.add(mesh);

    // Term label (below node)
    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    const termText = squareData[pos] || '';
    labelEl.textContent = termText.length > 18 ? termText.slice(0, 17) + '…' : termText;
    const label = new CSS2DObject(labelEl);
    label.position.set(x, y - NODE_RADIUS - 0.24, 0);
    group.add(label);

    // Position marker (small, above node)
    const posEl = document.createElement('div');
    posEl.className = 'label';
    posEl.style.fontSize = '9px';
    posEl.style.color = '#8a93ab';
    posEl.textContent = pos;
    const posLabel = new CSS2DObject(posEl);
    posLabel.position.set(x, y + NODE_RADIUS + 0.16, 0);
    group.add(posLabel);

    nodeMeshes[pos] = mesh;
    nodeLabels[pos] = { termEl: labelEl, posEl };
    nodePositions3D[pos] = new THREE.Vector3(x, y, 0);

    state.nodesById.set(mesh.uuid, { squareKey, position: pos, term: squareData[pos] });
  });

  // Square header label
  const headerEl = document.createElement('div');
  headerEl.className = 'label square-header';
  const keySpan = document.createElement('span');
  keySpan.textContent = squareKey;
  headerEl.appendChild(keySpan);
  if (parentTerm) {
    const parentSpan = document.createElement('span');
    parentSpan.className = 'parent';
    parentSpan.textContent = ` of ${parentTerm}`;
    headerEl.appendChild(parentSpan);
  }
  const headerLabel = new CSS2DObject(headerEl);
  headerLabel.position.set(0, 3.75, 0);
  group.add(headerLabel);

  scene.add(group);

  return {
    key: squareKey,
    title,
    parentTerm,
    squareData,
    group,
    nodeMeshes,
    nodeLabels,
    nodePositions3D,
  };
}

function clearScene() {
  state.squares.forEach(sq => {
    scene.remove(sq.group);
    // Dispose
    sq.group.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) obj.material.dispose();
    });
  });
  state.squares = [];
  state.nodesById.clear();
  state.hoverTarget = null;
  state.pinnedTarget = null;
}

// =========================================================
// LAYOUT — Arrange the five squares
// =========================================================

// Layout: A on top, B_S1 .. B_~S2 in a row beneath.
// Adjust these offsets to taste.
const LAYOUT = {
  A:    { position: { x: 0,    y: 5.5,  z: 0 },  scale: 0.95 },
  S1:   { position: { x: -7.5, y: -2.5, z: 0 },  scale: 0.62 },
  S2:   { position: { x: -2.5, y: -2.5, z: 0 },  scale: 0.62 },
  '~S1':{ position: { x:  2.5, y: -2.5, z: 0 },  scale: 0.62 },
  '~S2':{ position: { x:  7.5, y: -2.5, z: 0 },  scale: 0.62 },
};

function buildArchitectonic(parsed) {
  clearScene();

  const layer_1 = parsed.layer_1;
  const layer_2 = parsed.layer_2;
  if (!layer_1 || !layer_1.square) throw new Error('Missing layer_1.square');
  if (!layer_2 || typeof layer_2 !== 'object') throw new Error('Missing layer_2');

  // Square A
  const A = buildSquare(
    layer_1.square, 'A', 'Layer 1',
    null,
    LAYOUT.A.position, LAYOUT.A.scale
  );
  state.squares.push(A);

  // Layer-2 squares
  ['S1','S2','~S1','~S2'].forEach(semeKey => {
    const b = layer_2[semeKey];
    if (!b || !b.square) return;
    const sq = buildSquare(
      b.square, semeKey, `Decomposition`,
      b.parent_term || '',
      LAYOUT[semeKey].position, LAYOUT[semeKey].scale
    );
    state.squares.push(sq);
  });

  state.data = parsed;
  updateNodeInfo(null);
}

// =========================================================
// HIGHLIGHTING
// =========================================================

const HIGHLIGHT_EMISSIVE = 0xffd23f;
const DIM_EMISSIVE = 0x000000;

function setNodeState(mesh, mode) {
  // mode: 'normal', 'highlight', 'dim'
  const mat = mesh.material;
  if (mode === 'highlight') {
    mat.emissive.setHex(HIGHLIGHT_EMISSIVE);
    mat.emissiveIntensity = 1.2;
    mesh.scale.setScalar(1.35);
  } else if (mode === 'dim') {
    mat.emissive.setHex(DIM_EMISSIVE);
    mat.emissiveIntensity = 0;
    mesh.scale.setScalar(0.75);
  } else {
    mat.emissive.setHex(DIM_EMISSIVE);
    mat.emissiveIntensity = 0;
    mesh.scale.setScalar(1);
  }
}

function applyHighlight(target) {
  // target = {squareKey, position} or null
  state.squares.forEach(sq => {
    Object.entries(sq.nodeMeshes).forEach(([pos, mesh]) => {
      setNodeState(mesh, 'normal');
      const lbl = sq.nodeLabels[pos];
      if (lbl) {
        lbl.termEl.classList.remove('highlighted', 'dimmed');
      }
    });
  });

  if (!target) return;

  // Identify target term
  const targetSq = state.squares.find(s => s.key === target.squareKey);
  if (!targetSq) return;
  const targetTerm = targetSq.squareData[target.position] || '';

  state.squares.forEach(sq => {
    Object.entries(sq.nodeMeshes).forEach(([pos, mesh]) => {
      const term = sq.squareData[pos] || '';
      const matchByPos = (sq.key === target.squareKey && pos === target.position);
      const matchByTerm = term && term === targetTerm;
      if (matchByPos || matchByTerm) {
        setNodeState(mesh, 'highlight');
        const lbl = sq.nodeLabels[pos];
        if (lbl) lbl.termEl.classList.add('highlighted');
      } else {
        setNodeState(mesh, 'dim');
        const lbl = sq.nodeLabels[pos];
        if (lbl) lbl.termEl.classList.add('dimmed');
      }
    });
  });
}

// =========================================================
// NODE INFO PANEL
// =========================================================

const COMPOSITIONS = {
  'S1': 'S1 + S2 → M11 · S1 + ~S2 → M13 · S1 + ~S1 → Mixed1',
  'S2': 'S1 + S2 → M11 · S2 + ~S1 → M14 · S2 + ~S2 → Mixed2',
  '~S2': '~S1 + ~S2 → M12 · S1 + ~S2 → M13 · S2 + ~S2 → Mixed2',
  '~S1': '~S1 + ~S2 → M12 · S2 + ~S1 → M14 · S1 + ~S1 → Mixed1',
  'M11': 'complex axis: S1 + S2',
  'M12': 'neutral axis: ~S1 + ~S2',
  'M13': 'positive deixis: S1 + ~S2',
  'M14': 'negative deixis: S2 + ~S1',
  'M21': 'contains S1, S2, ~S2 (omits ~S1)',
  'M22': 'contains S1, S2, ~S1 (omits ~S2)',
  'M23': 'contains S1, ~S1, ~S2 (omits S2)',
  'M24': 'contains S2, ~S1, ~S2 (omits S1)',
  'Mixed1': 'undifferentiated axis: S1 + ~S1',
  'Mixed2': 'undifferentiated axis: S2 + ~S2',
  'top': 'all four inner semes, no shared attribute',
  'bottom': 'empty extent, all M2 attributes',
};

function updateNodeInfo(target) {
  const el = document.getElementById('node-info');
  if (!target) {
    el.innerHTML = '<em style="color:var(--text-dim);">Hover or click a node.</em>';
    return;
  }
  const sq = state.squares.find(s => s.key === target.squareKey);
  if (!sq) return;
  const pos = target.position;
  const term = sq.squareData[pos] || '';

  let html = `<h4>${sq.key} · ${pos}</h4>`;
  html += `<div class="kv"><span class="k">Term:</span> ${term || '—'}</div>`;
  if (sq.parentTerm) {
    html += `<div class="kv"><span class="k">Decomposes:</span> ${sq.parentTerm}</div>`;
  }
  if (COMPOSITIONS[pos]) {
    html += `<div class="kv"><span class="k">Structure:</span> ${COMPOSITIONS[pos]}</div>`;
  }

  // Where else this term appears
  if (term) {
    const appearances = [];
    state.squares.forEach(other => {
      if (other.key === target.squareKey) return;
      Object.entries(other.squareData).forEach(([p, t]) => {
        if (t === term) appearances.push(`${other.key}·${p}`);
      });
    });
    if (appearances.length) {
      html += `<div class="kv"><span class="k">Also appears on:</span><br>`;
      appearances.forEach(a => { html += `<span class="chip">${a}</span>`; });
      html += `</div>`;
    }
  }

  el.innerHTML = html;
}

// =========================================================
// RAYCASTING FOR HOVER
// =========================================================

function updateMouseFromEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  state.mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  state.mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
}

function pickNode() {
  state.raycaster.setFromCamera(state.mouse, camera);
  const meshes = [];
  state.squares.forEach(sq => {
    Object.values(sq.nodeMeshes).forEach(m => meshes.push(m));
  });
  const hits = state.raycaster.intersectObjects(meshes, false);
  if (hits.length === 0) return null;
  const mesh = hits[0].object;
  const data = state.nodesById.get(mesh.uuid);
  return data ? { squareKey: data.squareKey, position: data.position } : null;
}

let rafPending = false;
renderer.domElement.addEventListener('pointermove', (ev) => {
  updateMouseFromEvent(ev);
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    if (state.pinnedTarget) return; // pinned takes priority
    const hit = pickNode();
    if (hit) {
      if (!state.hoverTarget || hit.squareKey !== state.hoverTarget.squareKey || hit.position !== state.hoverTarget.position) {
        state.hoverTarget = hit;
        applyHighlight(hit);
        updateNodeInfo(hit);
        document.body.style.cursor = 'pointer';
      }
    } else {
      if (state.hoverTarget) {
        state.hoverTarget = null;
        if (state.pinnedTarget) {
          applyHighlight(state.pinnedTarget);
          updateNodeInfo(state.pinnedTarget);
        } else {
          applyHighlight(null);
          updateNodeInfo(null);
        }
        document.body.style.cursor = 'default';
      }
    }
  });
});

renderer.domElement.addEventListener('click', (ev) => {
  updateMouseFromEvent(ev);
  const hit = pickNode();
  if (!hit) {
    // Click empty space: unpin
    if (state.pinnedTarget) {
      state.pinnedTarget = null;
      if (state.hoverTarget) {
        applyHighlight(state.hoverTarget);
        updateNodeInfo(state.hoverTarget);
      } else {
        applyHighlight(null);
        updateNodeInfo(null);
      }
    }
    return;
  }
  // Toggle pin
  if (state.pinnedTarget && state.pinnedTarget.squareKey === hit.squareKey && state.pinnedTarget.position === hit.position) {
    state.pinnedTarget = null;
    // Revert to hover
    if (state.hoverTarget) {
      applyHighlight(state.hoverTarget);
      updateNodeInfo(state.hoverTarget);
    } else {
      applyHighlight(null);
      updateNodeInfo(null);
    }
  } else {
    state.pinnedTarget = hit;
    applyHighlight(hit);
    updateNodeInfo(hit);
  }
});

// =========================================================
// VIEW PRESETS
// =========================================================

function setView(name) {
  switch (name) {
    case 'front':
      camera.position.set(0, 2, 22);
      controls.target.set(0, 2, 0);
      break;
    case 'top':
      camera.position.set(0, 20, 0.01);
      controls.target.set(0, 2, 0);
      break;
    case 'reset':
    default:
      camera.position.set(14, 8, 18);
      controls.target.set(0, 2, 0);
      break;
  }
  controls.update();
}

document.getElementById('view-reset').addEventListener('click', () => setView('reset'));
document.getElementById('view-front').addEventListener('click', () => setView('front'));
document.getElementById('view-top').addEventListener('click', () => setView('top'));

// =========================================================
// UI WIRING
// =========================================================

document.getElementById('panel-toggle').addEventListener('click', () => {
  document.body.classList.toggle('panels-hidden');
});

document.querySelectorAll('.sec-title').forEach(t => {
  t.addEventListener('click', () => t.closest('.sec').classList.toggle('open'));
});

function handleJsonApply() {
  const ta = document.getElementById('json-input');
  const status = document.getElementById('json-status');
  const raw = ta.value.trim();
  if (!raw) {
    status.className = 'err';
    status.textContent = 'Paste JSON first.';
    return;
  }
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    status.className = 'err';
    status.textContent = `JSON parse error: ${e.message}`;
    return;
  }
  try {
    buildArchitectonic(parsed);
    status.className = 'ok';
    status.textContent = `Loaded ${state.squares.length} squares.`;
  } catch (e) {
    console.error(e);
    status.className = 'err';
    status.textContent = `Structure error: ${e.message}`;
  }
}

document.getElementById('json-apply').addEventListener('click', handleJsonApply);

// =========================================================
// RESIZE
// =========================================================

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
});

// =========================================================
// ANIMATION LOOP
// =========================================================

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();
