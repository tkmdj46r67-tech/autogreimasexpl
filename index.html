<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greimas Square — Nesting Diagrams</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070d; color: #e9edf7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .lbl {
    pointer-events: none; user-select: none; white-space: nowrap;
    text-shadow: 0 0 8px rgba(0,0,0,0.92), 0 1px 2px rgba(0,0,0,0.9);
  }
  .lbl.main { font-size: 14px; font-weight: 600; }
  .lbl.main b {
    font-weight: 500; font-size: 10px; opacity: 0.55;
    margin-right: 5px; letter-spacing: 0.06em;
  }
  .lbl.mid { font-size: 13px; font-weight: 600; }
  .lbl.mid b {
    font-weight: 500; font-size: 9.5px; opacity: 0.55;
    margin-right: 5px; letter-spacing: 0.06em;
  }
  .lbl.corner { font-size: 12px; font-weight: 500; opacity: 0.92; }
  .lbl.corner b {
    font-weight: 400; font-size: 9px; opacity: 0.55;
    margin-right: 4px; letter-spacing: 0.06em;
  }
  .lbl.layer {
    font-size: 12px; font-weight: 500; font-style: italic; letter-spacing: 0.03em;
  }
  .lbl.layer b {
    font-style: normal; font-weight: 600; font-size: 10.5px;
    margin-right: 5px; opacity: 0.72; letter-spacing: 0.06em;
  }
  .lbl.cousin {
    font-size: 9.5px; font-weight: 400; font-style: italic;
    letter-spacing: 0.02em;
    filter: saturate(0.42) brightness(1.22);
  }

  #ui {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    width: 328px; max-height: calc(100vh - 28px); overflow-y: auto;
    padding: 12px 14px; border-radius: 12px;
    background: rgba(9, 13, 22, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    font-size: 12px; line-height: 1.4;
  }
  #ui::-webkit-scrollbar { width: 7px; }
  #ui::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 4px; }
  #ui h1 {
    margin: 0 0 2px; font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  #ui h1 span {
    display: inline-block; margin-left: 6px; padding: 1px 5px;
    font-size: 9px; letter-spacing: 0.12em; border-radius: 4px;
    color: #0a0e1c; vertical-align: 2px;
    background: linear-gradient(120deg, #22a884, #fde725);
  }
  .hint { margin: 0 0 10px; font-size: 10px; color: #7e8aa8; letter-spacing: 0.02em; }

  .legend {
    display: flex; gap: 12px; margin-bottom: 10px;
    font-size: 10px; letter-spacing: 0.05em; color: #97a2be;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; box-shadow: 0 0 6px currentColor;
  }

  /* ============ Breadcrumb ============ */
  #breadcrumb {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin: 0 0 10px; padding: 8px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 11px; min-height: 33px;
  }
  #breadcrumb .crumb {
    padding: 3px 9px; border-radius: 5px;
    cursor: pointer; user-select: none;
    color: #97a2be; font-weight: 600;
    letter-spacing: 0.04em;
    transition: background 0.15s, color 0.15s;
  }
  #breadcrumb .crumb:hover { background: rgba(126,160,255,0.14); color: #a3adff; }
  #breadcrumb .crumb.current {
    background: rgba(253,231,37,0.14);
    color: #fde725; cursor: default;
  }
  #breadcrumb .crumb.current:hover {
    background: rgba(253,231,37,0.14); color: #fde725;
  }
  #breadcrumb .crumb-sep { color: #5f6a86; font-size: 10px; }

  /* ============ Collapsible sections ============ */
  .sec { margin-bottom: 4px; }
  .sec-title {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding: 9px 2px; cursor: pointer; user-select: none;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #7e8aa8;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    transition: color 0.15s, border-color 0.2s;
  }
  .sec-title:hover { color: #a3adff; }
  .sec-title:focus-visible {
    outline: 1px solid rgba(126, 160, 255, 0.55);
    outline-offset: 2px; border-radius: 4px;
  }
  .sec-title .chev {
    display: inline-block; font-size: 9px; opacity: 0.65;
    transition: transform 0.28s ease;
  }
  .sec.collapsed .sec-title .chev { transform: rotate(-90deg); }

  .sec-body {
    display: grid; grid-template-rows: 1fr;
    transition: grid-template-rows 0.28s ease;
  }
  .sec.collapsed .sec-body { grid-template-rows: 0fr; }
  .sec-clip { overflow: hidden; min-height: 0; }
  .sec-content { padding: 8px 0 6px; }

  /* ============ Term rows ============ */
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .row .sym {
    flex: 0 0 42px; font-size: 11px; font-weight: 600; text-align: right;
    letter-spacing: 0.02em;
  }
  .row .sym.dot { flex: 0 0 42px; display: flex; justify-content: flex-end; }
  .row .sym.dot i {
    display: block; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 8px currentColor;
  }
  .row input {
    flex: 1; min-width: 0; padding: 6px 9px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e9edf7; font: inherit; font-size: 11.5px; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .row input:focus {
    border-color: rgba(126, 160, 255, 0.5);
    background: rgba(126, 160, 255, 0.10);
  }
  .row input[readonly] {
    cursor: default;
    background: rgba(255, 255, 255, 0.02);
    border-color: rgba(255, 255, 255, 0.05);
    color: #97a2be;
  }
  .row.sub input { font-size: 10.5px; color: #a8b3cc; }
  .row.sub { margin-bottom: 8px; }

  /* ============ Buttons ============ */
  .buttons { display: flex; gap: 7px; margin: 12px 0 6px; }
  button {
    flex: 1; padding: 8px 4px; border-radius: 7px; cursor: pointer;
    font: inherit; font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: #e9edf7;
    background: rgba(126, 160, 255, 0.18);
    border: 1px solid rgba(126, 160, 255, 0.4);
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled) { background: rgba(126, 160, 255, 0.32); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.ghost {
    flex: 0 0 78px;
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.10);
  }
  button.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.11); }

  #expand {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px 12px; margin: 0 0 8px;
    border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #fde725;
    background: linear-gradient(135deg, rgba(34,168,132,0.18), rgba(253,231,37,0.10));
    border: 1px solid rgba(253,231,37,0.35);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s, color 0.25s, opacity 0.25s;
  }
  #expand:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(34,168,132,0.32), rgba(253,231,37,0.22));
    border-color: rgba(253,231,37,0.60);
    box-shadow: 0 0 18px -4px rgba(253,231,37,0.5);
  }
  #expand.expanded {
    color: #a3adff;
    background: linear-gradient(135deg, rgba(65,68,135,0.30), rgba(34,168,132,0.14));
    border-color: rgba(65,68,135,0.55);
  }
  #expand.expanded:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(65,68,135,0.45), rgba(34,168,132,0.24));
    border-color: rgba(65,68,135,0.75);
    box-shadow: 0 0 18px -4px rgba(65,68,135,0.6);
  }
  #expand:disabled {
    opacity: 0.35; cursor: not-allowed;
    filter: grayscale(0.5); box-shadow: none;
  }
  #expand .chev {
    display: inline-block; width: 10px; text-align: center;
    transition: transform 0.3s ease;
  }
  #expand.expanded .chev { transform: rotate(180deg); }

  /* ============ Concentrate button ============ */
  #concentrate {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px 12px; margin: 0 0 10px;
    border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #b6f0ff;
    background: linear-gradient(135deg, rgba(56,189,248,0.16), rgba(167,139,250,0.14));
    border: 1px solid rgba(56,189,248,0.42);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s, opacity 0.25s;
  }
  #concentrate:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(56,189,248,0.30), rgba(167,139,250,0.24));
    border-color: rgba(56,189,248,0.75);
    box-shadow: 0 0 20px -4px rgba(56,189,248,0.55);
  }
  #concentrate:disabled {
    opacity: 0.4; cursor: not-allowed; box-shadow: none;
  }
  #concentrate .icon {
    display: inline-block; font-size: 12px; opacity: 0.85;
  }

  /* ============ Toggles ============ */
  .toggles {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .toggles + .toggles { margin-top: 0; }
  .toggles label {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 9px; border-radius: 7px; cursor: pointer; user-select: none;
    font-size: 10px; letter-spacing: 0.03em;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    transition: background 0.15s, border-color 0.15s, opacity 0.2s;
  }
  .toggles label:hover { background: rgba(255, 255, 255, 0.09); }
  .toggles input { display: none; }
  .toggles label:has(input:checked) {
    background: rgba(126, 160, 255, 0.16);
    border-color: rgba(126, 160, 255, 0.4);
    color: #fff;
  }
  #layer-toggles label i {
    width: 7px; height: 7px; border-radius: 50%;
    display: inline-block; flex: 0 0 auto; font-style: normal;
  }
  #layer-toggles.is-disabled { opacity: 0.32; pointer-events: none; }
  #layer-toggles.is-disabled label {
    cursor: not-allowed;
    background: rgba(255, 255, 255, 0.03);
    border-color: rgba(255, 255, 255, 0.05);
    color: #6b7794;
  }

  .footer-link {
    margin-top: 10px; font-size: 9.5px; letter-spacing: 0.04em;
    color: #5f6a86; text-align: right;
  }
  .footer-link a {
    color: #7e8aa8; cursor: pointer; text-decoration: none;
    border-bottom: 1px dotted rgba(126,138,168,0.4);
  }
  .footer-link a:hover { color: #a3adff; }

  @media (max-width: 620px) {
    #ui { width: 244px; padding: 10px 11px; font-size: 11px; }
    .hint, .legend { display: none; }
    #ui h1 { font-size: 11px; }
    .row .sym { flex: 0 0 34px; font-size: 10.5px; }
    .row .sym.dot { flex: 0 0 34px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="ui">
  <h1>Greimas Square<span>3L</span></h1>
  <p class="hint">drag · rotate | scroll · zoom | right-drag · pan</p>

  <div class="legend">
    <span><i style="color:#fde725; background:#fde725"></i>front · synonyms</span>
    <span><i style="color:#22a884; background:#22a884"></i>center</span>
    <span><i style="color:#414487; background:#414487"></i>back · antonyms</span>
  </div>

  <!-- ============ Breadcrumb ============ -->
  <div id="breadcrumb"></div>

  <!-- ============ INNER SQUARE ============ -->
  <div class="sec" data-sec>
    <div class="sec-title" role="button" tabindex="0" aria-expanded="true">
      <span>Inner Square</span>
      <span class="chev">▾</span>
    </div>
    <div class="sec-body"><div class="sec-clip"><div class="sec-content">
      <div class="row"><span class="sym" style="color:#5bcfa0">S₁</span><input type="text" data-k="s1" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="s1" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">S₂</span><input type="text" data-k="s2" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="s2" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">~S₁</span><input type="text" data-k="ns1" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="ns1" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">~S₂</span><input type="text" data-k="ns2" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="ns2" data-f="subs" placeholder="syn, ant"></div>
    </div></div></div>
  </div>

  <!-- ============ OUTER MIDPOINTS ============ -->
  <div class="sec" data-sec>
    <div class="sec-title" role="button" tabindex="0" aria-expanded="true">
      <span>Outer Midpoints</span>
      <span class="chev">▾</span>
    </div>
    <div class="sec-body"><div class="sec-clip"><div class="sec-content">
      <div class="row"><span class="sym" style="color:#5bcfa0">M₁</span><input type="text" data-k="m1" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="m1" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">M₂</span><input type="text" data-k="m2" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="m2" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">M₃</span><input type="text" data-k="m3" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="m3" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">M₄</span><input type="text" data-k="m4" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="m4" data-f="subs" placeholder="syn, ant"></div>
    </div></div></div>
  </div>

  <!-- ============ OUTER CORNERS ============ -->
  <div class="sec" data-sec>
    <div class="sec-title" role="button" tabindex="0" aria-expanded="true">
      <span>Outer Corners</span>
      <span class="chev">▾</span>
    </div>
    <div class="sec-body"><div class="sec-clip"><div class="sec-content">
      <div class="row"><span class="sym" style="color:#5bcfa0">C₁</span><input type="text" data-k="c1" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="c1" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">C₂</span><input type="text" data-k="c2" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="c2" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">C₃</span><input type="text" data-k="c3" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="c3" data-f="subs" placeholder="syn, ant"></div>
      <div class="row"><span class="sym" style="color:#5bcfa0">C₄</span><input type="text" data-k="c4" data-f="name"></div>
      <div class="row sub"><span class="sym dot" style="color:#fde725"><i></i></span><input type="text" data-k="c4" data-f="subs" placeholder="syn, ant"></div>
    </div></div></div>
  </div>

  <div class="buttons">
    <button id="apply">Update</button>
    <button id="reset" class="ghost">Reset</button>
  </div>

  <button id="expand"><span class="chev">▸</span><span id="expand-label">Expand</span></button>

  <button id="concentrate"><span class="icon">◈</span><span id="concentrate-label">Concentrate ↓</span></button>

  <div class="toggles">
    <label><input type="checkbox" id="t-auto" checked><span>Auto anchors</span></label>
    <label><input type="checkbox" id="t-cousins" checked><span>Cousins</span></label>
    <label><input type="checkbox" id="t-labels" checked><span>Labels</span></label>
    <label><input type="checkbox" id="t-rotate"><span>Rotate</span></label>
  </div>

  <div class="toggles" id="layer-toggles">
    <label>
      <input type="checkbox" id="t-layer-front" checked>
      <i style="background:#fde725; box-shadow:0 0 6px #fde725"></i>
      <span>+ Front</span>
    </label>
    <label>
      <input type="checkbox" id="t-layer-center" checked>
      <i style="background:#22a884; box-shadow:0 0 6px #22a884"></i>
      <span>Center</span>
    </label>
    <label>
      <input type="checkbox" id="t-layer-back" checked>
      <i style="background:#414487; box-shadow:0 0 6px #414487"></i>
      <span>− Back</span>
    </label>
  </div>

  <div class="footer-link"><a id="clear-cache">clear word cache</a></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* =====================================================================
   DATA — static config
   ===================================================================== */
const INNER_KEYS = ['s1', 's2', 'ns1', 'ns2'];
const M_KEYS     = ['m1', 'm2', 'm3', 'm4'];
const C_KEYS     = ['c1', 'c2', 'c3', 'c4'];
const ALL_KEYS   = [...INNER_KEYS, ...M_KEYS, ...C_KEYS];

const SYMBOLS = {
  s1: 'S₁', s2: 'S₂', ns1: '~S₁', ns2: '~S₂',
  m1: 'M₁', m2: 'M₂', m3: 'M₃', m4: 'M₄',
  c1: 'C₁', c2: 'C₂', c3: 'C₃', c4: 'C₄',
};

const DEFAULTS = {
  s1:  { name: 'Being',       anchors: 'Existence, Nothingness' },
  s2:  { name: 'Seeming',     anchors: 'Appearance, Reality' },
  ns1: { name: 'Non-being',   anchors: 'Absence, Presence' },
  ns2: { name: 'Non-seeming', anchors: 'Invisibility, Visibility' },
  m1:  { name: 'Truth',       anchors: 'Verity, Falsehood' },
  m2:  { name: 'Lie',         anchors: 'Fabrication, Truth' },
  m3:  { name: 'Falsehood',   anchors: 'Error, Truth' },
  m4:  { name: 'Secret',      anchors: 'Concealment, Disclosure' },
  c1:  { name: 'Paradox',     anchors: 'Contradiction, Consistency' },
  c2:  { name: 'Deception',   anchors: 'Trickery, Honesty' },
  c3:  { name: 'Subterfuge',  anchors: 'Evasion, Candor' },
  c4:  { name: 'Revelation',  anchors: 'Disclosure, Concealment' },
};

function blankDiagram() {
  const d = {};
  for (const k of ALL_KEYS) {
    d[k] = {
      name: '',
      front: { anchor: '', cousins: [] },
      back:  { anchor: '', cousins: [] },
    };
  }
  return d;
}

function defaultD0() {
  const d = blankDiagram();
  for (const k of ALL_KEYS) {
    const def = DEFAULTS[k];
    const [f, b] = (def.anchors || '').split(',').map(s => s.trim());
    d[k].name = def.name;
    d[k].front.anchor = f || '';
    d[k].back.anchor  = b || '';
  }
  return d;
}

/* =====================================================================
   NESTING STATE
   ---------------------------------------------------------------------
   diagrams[]  — each entry is a full diagram state (like the old `state`)
   nestings[]  — links between diagrams:
                 { parentDiag, parentKey, childDiag, childKey }
                 only ever created parentKey = 'ns2', childKey = 's1'
   currentDiag — index into diagrams of the diagram the UI is showing
   state       — alias for diagrams[currentDiag]; used by all the rest
   ===================================================================== */
const diagrams = [ defaultD0() ];
const nestings = [];
let currentDiag = 0;
let state = diagrams[currentDiag];

/* =====================================================================
   LAYER CONFIG
   ===================================================================== */
const Z_DEPTH = 4.2;

const LAYERS = [

/* =====================================================================
   WORD PROVIDER  —  Datamuse
   ===================================================================== */
const CACHE_KEY = 'greimas-words-v3';
const cache = new Map();

(function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    for (const k of Object.keys(obj)) cache.set(k, obj[k]);
  } catch (e) {}
})();

function persistCache() {
  try {
    const obj = {};
    for (const [k, v] of cache) obj[k] = v;
    localStorage.setItem(CACHE_KEY, JSON.stringify(obj));
  } catch (e) {}
}

function normKey(s) {
  return String(s || '').trim().toLowerCase()
    .replace(/[^\w\s-]/g, '').replace(/\s+/g, ' ').trim();
}

function titleCase(s) {
  return String(s || '').split(/\s+/)
    .map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w)
    .join(' ');
}

async function datamuse(param, term, signal) {
  if (!term) return [];
  const url = `https://api.datamuse.com/words?${param}=${encodeURIComponent(term)}&max=25`;
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error('datamuse ' + res.status + ' for ' + param + '=' + term);
  return res.json();
}

function pickWord(candidates, query, used) {
  if (!candidates || !candidates.length) return '';
  const q = String(query || '').toLowerCase().trim();
  const scored = [];
  for (const c of candidates) {
    const w = String(c.word || '').toLowerCase().trim();
    if (!w || w.includes(' ')) continue;
    if (w === q) continue;
    if (w === q + 's' || w === q + "'s") continue;
    if (used.has(w)) continue;
    scored.push({ word: w, score: c.score || 0 });
  }
  if (!scored.length) return '';
  scored.sort((a, b) => (b.score - a.score) || a.word.localeCompare(b.word));
  return scored[0].word;
}

function negationFallback(term, used) {
  const t = String(term || '').trim();
  if (!t) return '';
  const tries = [];
  if (/^non-/i.test(t))  tries.push(t.replace(/^non-/i, ''));
  if (/^un-/i.test(t))   tries.push(t.replace(/^un-/i, ''));
  tries.push('non-' + t.toLowerCase());
  tries.push('anti-' + t.toLowerCase());
  tries.push('un-' + t.toLowerCase());
  for (const c of tries) {
    const k = c.toLowerCase();
    if (c && !used.has(k)) return c;
  }
  return '';
}

async function fetchCousins(anchor, signal, exclude) {
  if (!anchor) return [];
  let raw = [];
  try {
    raw = await datamuse('ml', anchor, signal);
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    console.warn('[cousins] failed for', anchor, e.message);
    return [];
  }
  const used = new Set([anchor.toLowerCase(), ...exclude.map(s => s.toLowerCase())]);
  const out = [];
  for (const c of raw) {
    const w = String(c.word || '').toLowerCase().trim();
    if (!w || w.includes(' ')) continue;
    if (used.has(w)) continue;
    used.add(w);
    out.push(titleCase(w));
    if (out.length >= 4) break;
  }
  return out;
}

async function resolveAll(names, signal) {
  const used = new Set(names.map(n => n.toLowerCase().trim()).filter(Boolean));
  const results = new Map();
  const uncached = [];

  for (const name of names) {
    const key = normKey(name);
    if (!key) continue;
    if (results.has(key)) continue;
    if (cache.has(key)) {
      const r = cache.get(key);
      results.set(key, r);
      if (r.front?.anchor) used.add(r.front.anchor.toLowerCase());
      if (r.back?.anchor)  used.add(r.back.anchor.toLowerCase());
    } else {
      uncached.push({ name, key });
    }
  }

  const fetched = await Promise.all(uncached.map(async ({ name, key }) => {
    try {
      const [syns, ants] = await Promise.all([
        datamuse('rel_syn', name, signal).catch(e => { if (e.name === 'AbortError') throw e; return []; }),
        datamuse('rel_ant', name, signal).catch(e => { if (e.name === 'AbortError') throw e; return []; }),
      ]);
      console.log(`[subterms] ${name}: ${syns.length} syn, ${ants.length} ant`);
      return { name, key, syns, ants };
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      return { name, key, syns: [], ants: [] };
    }
  }));

  const anchors = [];
  for (const { name, key, syns, ants } of fetched) {
    if (signal?.aborted) throw new DOMException('aborted', 'AbortError');
    const front = pickWord(syns, name, used);
    let back = pickWord(ants, name, used);
    if (!back) back = negationFallback(name, used);
    if (front) used.add(front.toLowerCase());
    if (back)  used.add(back.toLowerCase());
    anchors.push({ key, name, front, back });
  }

  const excludeAll = Array.from(used);
  const cousinJobs = [];
  for (const a of anchors) {
    cousinJobs.push((async () => ({
      key: a.key, side: 'front',
      words: await fetchCousins(a.front, signal, excludeAll)
    }))());
    cousinJobs.push((async () => ({
      key: a.key, side: 'back',
      words: await fetchCousins(a.back, signal, excludeAll)
    }))());
  }
  const cousinsAll = await Promise.all(cousinJobs);

  const cousinMap = new Map();
  for (const c of cousinsAll) cousinMap.set(`${c.key}|${c.side}`, c.words);

  for (const a of anchors) {
    const r = {
      front: {
        anchor: a.front ? titleCase(a.front) : '',
        cousins: cousinMap.get(`${a.key}|front`) || []
      },
      back: {
        anchor: a.back ? titleCase(a.back) : '',
        cousins: cousinMap.get(`${a.key}|back`) || []
      },
    };
    cache.set(a.key, r);
    results.set(a.key, r);
  }

  persistCache();
  return results;
}

const glowTex = (() => {
  const s = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1.0)');
  g.addColorStop(0.30, 'rgba(255,255,255,0.7)');
  g.addColorStop(0.65, 'rgba(255,255,255,0.15)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const lineMaterials = [];

function makeLine(p1, p2, opts = {}) {
  const {
    color = 0xffffff, width = 2, opacity = 1,
    dashed = false, dash = 0.2, gap = 0.15
  } = opts;
  const geo = new LineGeometry();
  geo.setPositions([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z]);
  const mat = new LineMaterial({
    color, linewidth: width,
    transparent: true, opacity,
    dashed, dashSize: dash, gapSize: gap,
    depthWrite: false
  });
  mat.resolution.set(innerWidth, innerHeight);
  lineMaterials.push(mat);
  const line = new Line2(geo, mat);
  line.computeLineDistances();
  return line;
}

function makeDot(pos, color, scale, opacity = 0.95) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color,
    blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity
  }));
  sprite.position.copy(pos);
  sprite.scale.setScalar(scale);
  return sprite;
}

function makeLabel(symbol, name, textColor, cls) {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  el.style.color = textColor;
  const b = document.createElement('b');
  b.textContent = symbol;
  el.append(b, document.createTextNode(name));
  return new CSS2DObject(el);
}

function makeCousinLabel(text, textColor) {
  const el = document.createElement('div');
  el.className = 'lbl cousin';
  el.style.color = textColor;
  el.textContent = text;
  return new CSS2DObject(el);
}

let mainLabels   = [];

const animTargets = {

};

/* ---- Transition (concentrate / return) ---- */
const transition = {
  active: false,
  phase: 'out',       // 'out' then 'in'

  pendingDiag: null,

/* =====================================================================
   CLEAR
   ===================================================================== */
function clearGroup(g) {
  g.traverse(obj => {
    if (obj.isLine2) { obj.geometry.dispose(); obj.material.dispose(); }
    if (obj.isSprite && obj.material) obj.material.dispose();
  });
  g.clear();
}

function clearAll() {
  clearGroup(structureGroup);
  clearGroup(frontGroup);
  clearGroup(backGroup);
  clearGroup(labelGroup);

  for (const c of animTargets.cross) {
    diagramRoot.remove(c.line);
    c.line.geometry.dispose();
    c.line.material.dispose();
  }
  animTargets.cross.length = 0;
  animTargets.cousin.length = 0;

  for (const id of ['front', 'center', 'back']) {
    animTargets[id].materials.length = 0;
    animTargets[id].baseOpacities.length = 0;
    animTargets[id].labels.length = 0;
  }
  lineMaterials.length = 0;
}

/* =====================================================================
   BUILD
   ===================================================================== */
function build() {
  clearAll();
  mainLabels = [];
  subLabels = [];
  cousinLabels = [];

  const center = LAYERS.find(L => L.id === 'center');

  /* ---- CENTER LAYER ---- */
  for (const e of LAYER_EDGES) {
    const line = makeLine(posAt(e.a, 0), posAt(e.b, 0), {
      color: center.hex, width: e.width, opacity: e.opacity,
      dashed: e.dashed, dash: e.dash || 0.2, gap: e.gap || 0.15
    });
    structureGroup.add(line);
    animTargets.center.materials.push(line.material);
    animTargets.center.baseOpacities.push(e.opacity);
  }

  for (const k of ALL_KEYS) {
    const isInner = INNER_KEYS.includes(k);
    const dot = makeDot(posAt(k, 0), center.hex, isInner ? 0.72 : 0.55, 0.95);
    structureGroup.add(dot);
    animTargets.center.materials.push(dot.material);
    animTargets.center.baseOpacities.push(0.95);
  }

  for (const k of ALL_KEYS) {
    const p = posAt(k, 0);
    let dir, cls;
    if (INNER_KEYS.includes(k)) {
      dir = new THREE.Vector3(p.x, p.y, 0).normalize();
      cls = 'main';
    } else {
      dir = new THREE.Vector3(-p.x, -p.y, 0).normalize();
      cls = M_KEYS.includes(k) ? 'mid' : 'corner';
    }
    const label = makeLabel(SYMBOLS[k], state[k].name, center.text, cls);
    label.position.copy(p).addScaledVector(dir, 0.5);
    labelGroup.add(label);
    mainLabels.push(label);
  }

  /* ---- FRONT + BACK LAYERS ---- */
  for (const layer of LAYERS) {
    if (layer.id === 'center') continue;

    const group   = layer.id === 'front' ? frontGroup : backGroup;
    const slot    = animTargets[layer.id];
    const sideKey = layer.id;

    group.position.z = 0;
    group.scale.setScalar(1);

    for (const e of LAYER_EDGES) {
      const line = makeLine(posAt(e.a, 0), posAt(e.b, 0), {
        color: layer.hex, width: e.width * 0.94,
        opacity: e.opacity * layer.dim,
        dashed: e.dashed, dash: e.dash || 0.2, gap: e.gap || 0.15
      });
      group.add(line);
      slot.materials.push(line.material);
      slot.baseOpacities.push(e.opacity * layer.dim);
    }

    for (const k of ALL_KEYS) {
      const isInner = INNER_KEYS.includes(k);
      const p = posAt(k, 0);
      const sideData = state[k][sideKey];

      const dot = makeDot(p, layer.hex, isInner ? 0.44 : 0.36, layer.dim);
      group.add(dot);
      slot.materials.push(dot.material);
      slot.baseOpacities.push(layer.dim);

      if (sideData.anchor) {
        const dir = isInner
          ? new THREE.Vector3(p.x, p.y, 0).normalize()
          : new THREE.Vector3(-p.x, -p.y, 0).normalize();
        const lbl = makeLabel(
          layer.prefix + SYMBOLS[k], sideData.anchor, layer.text, 'layer'
        );
        lbl.position.copy(p).addScaledVector(dir, isInner ? 0.5 : 0.4);
        group.add(lbl);
        subLabels.push(lbl);
        slot.labels.push(lbl);
      }

      const pC = posAt(k, 0);
      const cross = makeLine(pC, pC, {
        color: layer.hex, width: 1.1,
        opacity: 0.30 * layer.dim,
        dashed: true, dash: 0.08, gap: 0.11
      });
      diagramRoot.add(cross);
      animTargets.cross.push({
        line: cross, key: k, sign: layer.sign, layerId: layer.id,
        baseOpacity: 0.30 * layer.dim,
      });

      if (!sideData.cousins || !sideData.cousins.length) continue;

      const ringR = isInner ? 0.60 : 0.46;
      const n = sideData.cousins.length;
      const cluster = {
        layerId: layer.id,
        lines: [],  lineBase: [],
        dots: [],   dotBase: [],
        labels: [],
      };

      sideData.cousins.forEach((word, i) => {
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        const cpos = new THREE.Vector3(
          p.x + Math.cos(angle) * ringR,
          p.y + Math.sin(angle) * ringR,
          0
        );

        const spoke = makeLine(p, cpos, {
          color: layer.hex, width: 1.0,
          opacity: 0.30 * layer.dim,
          dashed: true, dash: 0.04, gap: 0.07
        });
        group.add(spoke);
        cluster.lines.push(spoke);
        cluster.lineBase.push(0.30 * layer.dim);

        const cdot = makeDot(cpos, layer.hex, 0.20, layer.dim * 0.9);
        group.add(cdot);
        cluster.dots.push(cdot);
        cluster.dotBase.push(layer.dim * 0.9);

        const outDir = new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0);
        const clbl = makeCousinLabel(word, layer.text);
        clbl.position.copy(cpos).addScaledVector(outDir, 0.22);
        group.add(clbl);
        cluster.labels.push(clbl);
        cousinLabels.push(clbl);
      });

      animTargets.cousin.push(cluster);
    }
  }

  applyExpandState(1);
  applyVisibility();
  applyCousinVisibility();
  updateLayerControls();
}

/* =====================================================================
   EXPAND / COLLAPSE
   ===================================================================== */
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

function applyExpandState(flickerFactor) {
  const e = easeOutCubic(anim.progress);
  const gAlpha = transition.alpha;    // 0..1 — global transition fade

  frontGroup.position.z = e * Z_DEPTH;
  backGroup.position.z  = -e * Z_DEPTH;

  const scale = 0.86 + 0.14 * e;
  frontGroup.scale.setScalar(scale);
  backGroup.scale.setScalar(scale);

  const layersVisible = e > 0.005;

  const alphaFront  = layerAlpha.front  * layerFlicker.front;
  const alphaBack   = layerAlpha.back   * layerFlicker.back;
  const alphaCenter = layerAlpha.center * layerFlicker.center;

  /* FRONT */
  {
    const slot = animTargets.front;
    const layerOn = layerVisible.front;
    frontGroup.visible = layersVisible && layerOn;

    const f = alphaFront * e * flickerFactor * gAlpha;
    for (let i = 0; i < slot.materials.length; i++) {
      slot.materials[i].opacity = slot.baseOpacities[i] * f;
    }
    for (const lbl of slot.labels) {
      const op = Math.min(1, f);
      lbl.element.style.opacity = op.toFixed(3);
      const vis = labelsOn && layerOn && op > 0.06;
      lbl.visible = vis;
      lbl.element.style.display = vis ? '' : 'none';
    }
  }

  /* BACK */
  {
    const slot = animTargets.back;
    const layerOn = layerVisible.back;
    backGroup.visible = layersVisible && layerOn;

    const f = alphaBack * e * flickerFactor * gAlpha;
    for (let i = 0; i < slot.materials.length; i++) {
      slot.materials[i].opacity = slot.baseOpacities[i] * f;
    }
    for (const lbl of slot.labels) {
      const op = Math.min(1, f);
      lbl.element.style.opacity = op.toFixed(3);
      const vis = labelsOn && layerOn && op > 0.06;
      lbl.visible = vis;
      lbl.element.style.display = vis ? '' : 'none';
    }
  }

  /* CENTER */
  {
    const layerOn = layerVisible.center;
    const f = alphaCenter * flickerFactor * gAlpha;

    for (let i = 0; i < animTargets.center.materials.length; i++) {
      animTargets.center.materials[i].opacity =
        animTargets.center.baseOpacities[i] * f;
    }
    for (const lbl of mainLabels) {
      const op = Math.min(1, f);
      lbl.element.style.opacity = op.toFixed(3);
      const vis = labelsOn && layerOn && op > 0.06;
      lbl.visible = vis;
      lbl.element.style.display = vis ? '' : 'none';
    }
  }

  /* CROSS CONNECTORS */
  for (const c of animTargets.cross) {
    const layerOn = layerVisible[c.layerId];
    const centerOn = layerVisible.center;
    const pC = posAt(c.key, 0);
    const pL = posAt(c.key, c.sign * e * Z_DEPTH);
    c.line.geometry.setPositions([pC.x, pC.y, pC.z, pL.x, pL.y, pL.z]);
    c.line.computeLineDistances();

    const layerAlphaVal = (c.layerId === 'front' ? alphaFront : alphaBack);
    c.line.material.opacity =
      c.baseOpacity * e * flickerFactor * layerAlphaVal * (centerOn ? 1 : 0) * gAlpha;
    c.line.visible = layersVisible && layerOn && centerOn;
  }

  /* COUSIN CLUSTERS */
  const cousinAlpha = cousinsOn ? 1 : 0;
  for (const cluster of animTargets.cousin) {
    const layerOn = layerVisible[cluster.layerId];
    const layerAlphaVal = (cluster.layerId === 'front' ? alphaFront : alphaBack);
    const f = e * flickerFactor * layerAlphaVal * (layerOn ? 1 : 0) * gAlpha;

    for (let i = 0; i < cluster.lines.length; i++) {
      cluster.lines[i].material.opacity = cluster.lineBase[i] * f;
    }
    for (let i = 0; i < cluster.dots.length; i++) {
      cluster.dots[i].material.opacity = cluster.dotBase[i] * f;
    }
    for (const lbl of cluster.labels) {
      const op = Math.min(1, f) * cousinAlpha * COUSIN_OPACITY_MULT;
      lbl.element.style.opacity = op.toFixed(3);
      const vis = labelsOn && layerOn && op > 0.04;
      lbl.visible = vis;
      lbl.element.style.display = vis ? '' : 'none';
    }
  }
}

function updateLayerAnimations(dt) {
  for (const k of ['front', 'center', 'back']) {
    let target;
    if (k === 'center') {
      target = (anim.progress < 0.005) ? 1 : (layerVisible.center ? 1 : 0);
    } else {
      target = layerVisible[k] ? 1 : 0;
    }

    const current = layerAlpha[k];
    const delta = target - current;

    if (Math.abs(delta) > 0.001) {
      const speed = 3.0;
      const step = Math.sign(delta) * Math.min(Math.abs(delta), speed * dt);
      layerAlpha[k] = current + step;

      if (Math.random() < 0.18) layerFlicker[k] = 0;
      else layerFlicker[k] = 0.35 + Math.random() * 0.85;
    } else {
      layerAlpha[k] = target;
      layerFlicker[k] = 1;
    }
  }
}

function updateExpandAnimation(dt) {
  const delta = anim.target - anim.progress;
  const transitioning = Math.abs(delta) > 0.001;

  if (transitioning) {
    const speed = 1.45;
    const step = Math.sign(delta) * Math.min(Math.abs(delta), speed * dt);
    anim.progress += step;
  } else {
    anim.progress = anim.target;
  }

  updateLayerAnimations(dt);

  const stillTransitioning = Math.abs(anim.progress - anim.target) > 0.001;

  let flicker = 1;
  if (stillTransitioning) {
    if (Math.random() < 0.08) flicker = 0;
    else flicker = 0.5 + Math.random() * 0.7;
    const settle = 1 - Math.min(1, Math.abs(delta) * 2.5);
    flicker = 1 + (flicker - 1) * (1 - settle * 0.35);
  }

  applyExpandState(flicker);

  if (!stillTransitioning) updateLayerControls();
}

/* =====================================================================
   CONCENTRATE / RETURN  —  transition animation
   ===================================================================== */
function updateTransition(dt) {
  if (!transition.active) {
    diagramRoot.scale.setScalar(1);
    transition.alpha = 1;
    return;
  }

  transition.progress += dt / transition.duration;

  if (transition.phase === 'out') {
    const t = Math.min(1, transition.progress);
    diagramRoot.scale.setScalar(Math.max(0.0001, 1 - t));
    transition.alpha = Math.max(0, 1 - t);

    if (transition.progress >= 1) {
      /* Midpoint: swap diagrams, rebuild */
      if (transition.onSwap) transition.onSwap();
      transition.phase = 'in';
      transition.progress = 0;
    }
  } else {
    const t = Math.min(1, transition.progress);
    diagramRoot.scale.setScalar(Math.max(0.0001, t));
    transition.alpha = Math.min(1, t);

    if (transition.progress >= 1) {
      transition.active = false;
      transition.pendingDiag = null;
      transition.onSwap = null;
      diagramRoot.scale.setScalar(1);
      transition.alpha = 1;
    }
  }

  /* Flicker during transition */
  if (transition.active) {
    if (Math.random() < 0.22) transition.alpha *= 0;
    else transition.alpha *= 0.35 + Math.random() * 0.7;
  }
}

/* =====================================================================
   NESTING — sync between linked diagrams
   ===================================================================== */
function propagateLinks(fromIdx) {
  /* Down (parent -> child): copy parentKey name into childKey */
  const down = nestings.find(n => n.parentDiag === fromIdx);
  if (down) {
    const parent = diagrams[down.parentDiag];
    const child  = diagrams[down.childDiag];
    child[down.childKey].name = parent[down.parentKey].name || '';
  }
  /* Up (child -> parent) */
  const up = nestings.find(n => n.childDiag === fromIdx);
  if (up) {
    const parent = diagrams[up.parentDiag];
    const child  = diagrams[up.childDiag];
    parent[up.parentKey].name = child[up.childKey].name || '';
  }
}

function startConcentrate() {
  if (transition.active) return;

  /* If child already exists, just transition to it without recreating. */
  let childIdx = nestings.find(n => n.parentDiag === currentDiag)?.childDiag;

  if (childIdx == null) {
    /* Create new nested diagram */
    const newIdx = diagrams.length;
    const newDiag = blankDiagram();
    /* Seed new S1 with the current diagram's ~S2 term name */
    newDiag.s1.name = diagrams[currentDiag].ns2.name || '';
    diagrams.push(newDiag);
    nestings.push({
      parentDiag: currentDiag, parentKey: 'ns2',
      childDiag: newIdx,       childKey: 's1',
    });
    childIdx = newIdx;
  }

  const targetIdx = childIdx;

  transition.active = true;
  transition.phase = 'out';
  transition.progress = 0;
  transition.pendingDiag = targetIdx;
  transition.onSwap = () => {
    currentDiag = targetIdx;
    state = diagrams[currentDiag];
    syncInputsFromState();
    build();
    updateBreadcrumb();
    updateConcentrateButton();
  };
}

function startReturn(targetIdx) {
  if (transition.active) return;
  if (targetIdx === currentDiag) return;

  transition.active = true;
  transition.phase = 'out';
  transition.progress = 0;
  transition.pendingDiag = targetIdx;
  transition.onSwap = () => {
    currentDiag = targetIdx;
    state = diagrams[currentDiag];
    syncInputsFromState();
    build();
    updateBreadcrumb();
    updateConcentrateButton();
  };
}

/* =====================================================================
   BREADCRUMB + CONCENTRATE BUTTON UI
   ===================================================================== */
const breadcrumbEl = document.getElementById('breadcrumb');
const concentrateBtn = document.getElementById('concentrate');
const concentrateLabel = document.getElementById('concentrate-label');

function updateBreadcrumb() {
  breadcrumbEl.innerHTML = '';

  /* Walk up to root */
  const chain = [currentDiag];
  let idx = currentDiag;
  while (true) {
    const up = nestings.find(n => n.childDiag === idx);
    if (!up) break;
    idx = up.parentDiag;
    chain.unshift(idx);
  }

  chain.forEach((i, pos) => {
    if (pos > 0) {
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '›';
      breadcrumbEl.appendChild(sep);
    }
    const el = document.createElement('span');
    el.className = 'crumb' + (i === currentDiag ? ' current' : '');
    el.textContent = 'D' + i;
    if (i !== currentDiag) {
      el.addEventListener('click', () => startReturn(i));
    }
    breadcrumbEl.appendChild(el);
  });
}

function updateConcentrateButton() {
  const hasChild = nestings.some(n => n.parentDiag === currentDiag);
  const nextIdx = currentDiag + 1;
  concentrateLabel.textContent = hasChild
    ? 'Enter D' + nextIdx + ' ↓'
    : 'Concentrate ↓';
}

concentrateBtn.addEventListener('click', startConcentrate);

/* =====================================================================
   VISIBILITY / CONTROLS
   ===================================================================== */
const toggleAuto    = document.getElementById('t-auto');
const toggleCousins = document.getElementById('t-cousins');
const toggleLabels  = document.getElementById('t-labels');
const toggleRotate  = document.getElementById('t-rotate');
const expandBtn     = document.getElementById('expand');
const expandLabel   = document.getElementById('expand-label');
const applyBtn      = document.getElementById('apply');

const layerToggleEls = {
  front:  document.getElementById('t-layer-front'),
  center: document.getElementById('t-layer-center'),
  back:   document.getElementById('t-layer-back'),
};
const layerTogglesWrap = document.getElementById('layer-toggles');

function applyVisibility() { labelsOn = toggleLabels.checked; }
function applyCousinVisibility() { cousinsOn = toggleCousins.checked; }

function updateExpandButton() {
  const expanded = anim.target === 1;
  expandBtn.classList.toggle('expanded', expanded);
  expandLabel.textContent = expanded ? 'Collapse' : 'Expand';
}

function updateLayerControls() {
  const settled = Math.abs(anim.progress - anim.target) < 0.001;
  const isExpanded = anim.target === 1 && settled;

  layerTogglesWrap.classList.toggle('is-disabled', !isExpanded);
  for (const k of ['front', 'center', 'back']) {
    layerToggleEls[k].disabled = !isExpanded;
  }

  const anyHidden = !layerVisible.front || !layerVisible.center || !layerVisible.back;
  expandBtn.disabled = anyHidden;
}

expandBtn.addEventListener('click', () => {
  if (transition.active) return;
  anim.target = anim.target === 1 ? 0 : 1;
  updateExpandButton();
  updateLayerControls();
});

for (const k of ['front', 'center', 'back']) {
  layerToggleEls[k].addEventListener('change', () => {
    layerVisible[k] = layerToggleEls[k].checked;
    updateLayerControls();
  });
}

toggleLabels.addEventListener('change', applyVisibility);
toggleCousins.addEventListener('change', applyCousinVisibility);
toggleRotate.addEventListener('change', () => {
  controls.autoRotate = toggleRotate.checked;
});

/* =====================================================================
   COLLAPSIBLE SECTIONS
   ===================================================================== */
document.querySelectorAll('.sec[data-sec]').forEach(sec => {
  const title = sec.querySelector('.sec-title');
  const toggle = () => {
    sec.classList.toggle('collapsed');
    const expanded = !sec.classList.contains('collapsed');
    title.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  };
  title.addEventListener('click', toggle);
  title.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault(); toggle();
    }
  });
});

/* =====================================================================
   INPUTS
   ===================================================================== */
const inputs = {};
document.querySelectorAll('#ui input[data-k]').forEach(el => {
  const k = el.dataset.k, f = el.dataset.f;
  if (!inputs[k]) inputs[k] = {};
  inputs[k][f] = el;
});

function syncInputsFromState() {
  for (const k of ALL_KEYS) {
    if (inputs[k]?.name) inputs[k].name.value = state[k].name || '';
    if (inputs[k]?.subs) {
      const f = state[k].front?.anchor || '';
      const b = state[k].back?.anchor  || '';
      inputs[k].subs.value = [f, b].filter(Boolean).join(', ');
    }
  }
}

function applyAutoState() {
  const auto = toggleAuto.checked;
  for (const k of ALL_KEYS) {
    if (inputs[k]?.subs) {
      inputs[k].subs.readOnly = auto;
      inputs[k].subs.placeholder = auto ? 'auto: syn, ant' : 'syn, ant';
    }
  }
}

toggleAuto.addEventListener('change', applyAutoState);

/* =====================================================================
   APPLY
   ===================================================================== */
function setButtonLoading(on) {
  applyBtn.disabled = on;
  applyBtn.textContent = on ? 'Resolving…' : 'Update';
}

async function applyInputs() {
  if (transition.active) return;

  /* Read names from inputs into current diagram */
  for (const k of ALL_KEYS) {
    if (inputs[k]?.name) {
      const v = inputs[k].name.value.trim();
      state[k].name = v || '';    // blank allowed — D1+ starts blank
    }
  }

  /* Propagate through nestings BEFORE anything else */
  propagateLinks(currentDiag);

  /* If we synced a name up/down, refresh the visible fields */
  if (nestings.some(n => n.childDiag === currentDiag || n.parentDiag === currentDiag)) {
    syncInputsFromState();
  }

  const auto = toggleAuto.checked;

  if (!auto) {
    for (const k of ALL_KEYS) {
      const raw = inputs[k]?.subs?.value || '';
      const parts = raw.split(',').map(s => s.trim());
      state[k].front.anchor = parts[0] || '';
      state[k].back.anchor  = parts[1] || '';
    }

    if (currentAbort) currentAbort.abort();
    currentAbort = new AbortController();
    const signal = currentAbort.signal;

    setButtonLoading(true);
    try {
      const exclude = ALL_KEYS
        .flatMap(k => [state[k].name, state[k].front.anchor, state[k].back.anchor])
        .filter(Boolean).map(s => s.toLowerCase());

      const jobs = [];
      for (const k of ALL_KEYS) {
        const kk = k;
        jobs.push((async () => {
          state[kk].front.cousins = await fetchCousins(state[kk].front.anchor, signal, exclude);
        })());
        jobs.push((async () => {
          state[kk].back.cousins  = await fetchCousins(state[kk].back.anchor,  signal, exclude);
        })());
      }
      await Promise.all(jobs);
      build();
    } catch (e) {
      if (e.name !== 'AbortError') console.error('[anchors]', e);
    } finally {
      if (!signal.aborted) setButtonLoading(false);
    }
    return;
  }

  if (currentAbort) currentAbort.abort();
  currentAbort = new AbortController();
  const signal = currentAbort.signal;

  setButtonLoading(true);
  try {
    const names = ALL_KEYS.map(k => state[k].name);
    const resolved = await resolveAll(names, signal);

    for (const k of ALL_KEYS) {
      const key = normKey(state[k].name);
      const r = resolved.get(key);
      if (r) {
        state[k].front = { anchor: r.front.anchor, cousins: r.front.cousins || [] };
        state[k].back  = { anchor: r.back.anchor,  cousins: r.back.cousins  || [] };
      } else if (!state[k].name) {
        /* Blank name -> blank anchors */
        state[k].front = { anchor: '', cousins: [] };
        state[k].back  = { anchor: '', cousins: [] };
      }
    }

    syncInputsFromState();
    build();
  } catch (e) {
    if (e.name !== 'AbortError') console.error('[subterms]', e);
  } finally {
    if (!signal.aborted) setButtonLoading(false);
  }
}

applyBtn.addEventListener('click', applyInputs);

/* Reset = hard reset back to initial D0, clearing nestings */
document.getElementById('reset').addEventListener('click', () => {
  if (transition.active) return;
  diagrams.length = 0;
  nestings.length = 0;
  diagrams.push(defaultD0());
  currentDiag = 0;
  state = diagrams[0];

  /* Snap any in-flight animation back to a clean state */
  anim.progress = 0;
  anim.target = 0;
  updateExpandButton();
  updateLayerControls();

  syncInputsFromState();
  build();
  updateBreadcrumb();
  updateConcentrateButton();
});

document.querySelectorAll('#ui input[data-k]').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); applyInputs(); el.blur(); }
  });
});

document.getElementById('clear-cache').addEventListener('click', () => {
  cache.clear();
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  console.log('[cache] cleared');
});

/* =====================================================================
   RESIZE
   ===================================================================== */
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  lineMaterials.forEach(m => m.resolution.set(w, h));
}
addEventListener('resize', onResize);

/* =====================================================================
   LOOP
   ===================================================================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  updateTransition(dt);
  updateExpandAnimation(dt);
  controls.update();

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* =====================================================================
   BOOT
   ===================================================================== */
syncInputsFromState();
applyAutoState();
build();
updateExpandButton();
updateLayerControls();
updateBreadcrumb();
updateConcentrateButton();
animate();
</script>
</body>
</html>
