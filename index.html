<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested Squares — 3D Structure</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070d; color: #e9edf7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  #ui {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    width: 306px; max-height: calc(100vh - 28px); overflow-y: auto;
    padding: 14px 15px; border-radius: 12px;
    background: rgba(9, 13, 22, 0.9);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.55);
    font-size: 12px; line-height: 1.4;
  }
  #ui::-webkit-scrollbar { width: 6px; }
  #ui::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  #ui h1 {
    margin: 0 0 3px; font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .hint {
    margin: 0 0 12px; font-size: 10px; color: #7e8aa8;
  }

  #current {
    margin: 0 0 12px; padding: 10px 12px;
    border-radius: 8px;
    background: rgba(126,160,255,0.10);
    border: 1px solid rgba(126,160,255,0.25);
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.05em;
    color: #cfe0ff;
  }
  #current .sub {
    display: block;
    margin-top: 2px;
    font-size: 10.5px; font-weight: 400;
    color: #8a96b4;
    letter-spacing: 0.04em;
  }

  .group {
    margin: 0 0 10px;
    padding: 0 0 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .group:last-child { border-bottom: none; padding-bottom: 0; }

  .group-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #7e8aa8; margin: 0 0 6px 2px;
  }
  .group-label i {
    display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: 0 0 6px currentColor;
  }

  .btn-row {
    display: flex; gap: 4px;
    margin-bottom: 4px;
  }
  .btn-row:last-child { margin-bottom: 0; }

  .btn-row .indent {
    flex: 0 0 36px;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: #5f6a86;
    display: flex; align-items: center;
    padding-right: 4px;
    justify-content: flex-end;
  }

  .btn-row button {
    flex: 1;
    padding: 6px 4px;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: #c8d0e6;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-row button:hover:not(:disabled) {
    background: rgba(126,160,255,0.16);
    border-color: rgba(126,160,255,0.4);
    color: #fff;
  }
  .btn-row button.active {
    background: rgba(126,160,255,0.28);
    border-color: rgba(126,160,255,0.7);
    color: #fff;
    font-weight: 600;
  }
  .btn-row button:disabled {
    opacity: 0.4; cursor: progress;
  }

  #overview {
    width: 100%;
    padding: 9px 10px;
    margin: 8px 0 4px;
    border-radius: 8px;
    cursor: pointer;
    font: inherit;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b6f0ff;
    background: linear-gradient(135deg, rgba(56,189,248,0.16), rgba(167,139,250,0.14));
    border: 1px solid rgba(56,189,248,0.42);
    transition: background 0.2s, border-color 0.2s;
  }
  #overview:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(56,189,248,0.30), rgba(167,139,250,0.24));
    border-color: rgba(56,189,248,0.75);
  }
  #overview:disabled { opacity: 0.4; cursor: progress; }

  .nav-note {
    margin: 10px 0 0;
    font-size: 10px;
    color: #5f6a86;
    letter-spacing: 0.03em;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="ui">
  <h1>Nested Squares</h1>
  <p class="hint">drag to orbit · scroll to zoom</p>

  <div id="current"></div>

  <button id="overview">Overview</button>

  <div class="group">
    <div class="group-label"><i style="background:#FF7A45;color:#FF7A45"></i>L3 · Narrative</div>
    <div class="btn-row" id="row-L3"></div>
  </div>

  <div class="group">
    <div class="group-label"><i style="background:#FDE725;color:#FDE725"></i>L2 · Argument</div>
    <div class="btn-row" id="row-L2"></div>
  </div>

  <div class="group">
    <div class="group-label"><i style="background:#6DD4C4;color:#6DD4C4"></i>L1 · Proposition</div>
    <div id="l1-rows"></div>
  </div>

  <p class="nav-note">Clicking a square flies you to it. On arrival, the view resets to the canonical orientation for that square.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   1. CONSTANTS
   ===================================================================== */
const SQ3 = 120, SQ2 = 60, SQ1 = 30;
const Z3 = 400, Z2 = 200, Z1 = 0;

const LEVEL_COLORS = { 3: 0xFF7A45, 2: 0xFDE725, 1: 0x6DD4C4 };
const LEVEL_NAMES  = { 3: 'Narrative', 2: 'Argument', 1: 'Proposition' };

// The canonical "state 0" view offset — same direction for every square.
// Distance is derived from square size so the framing feels consistent.
const STATE0_DIR = new THREE.Vector3(0.55, 0.42, 0.72).normalize();
const STATE0_DIST_FACTOR = 2.6;

const FLIGHT_DURATION = 1.6;   // seconds
const FADE_RATE       = 1.6;   // opacity easing, per second

/* =====================================================================
   2. GEOMETRY — three planes, one square at L3, four at L2, sixteen at L1
   ===================================================================== */
function squareCorners(cx, cy, z, side) {
  const h = side / 2;
  return [
    new THREE.Vector3(cx - h, cy - h, z),
    new THREE.Vector3(cx + h, cy - h, z),
    new THREE.Vector3(cx + h, cy + h, z),
    new THREE.Vector3(cx - h, cy + h, z),
  ];
}

const L3 = {
  level: 3, index: 0,
  center: new THREE.Vector3(0, 0, Z3),
  side: SQ3,
  corners: squareCorners(0, 0, Z3, SQ3),
};

const L2 = L3.corners.map((c, i) => ({
  level: 2, index: i,
  center: new THREE.Vector3(c.x, c.y, Z2),
  side: SQ2,
  corners: squareCorners(c.x, c.y, Z2, SQ2),
}));

const L1 = [];
for (let i = 0; i < L2.length; i++) {
  for (let j = 0; j < 4; j++) {
    const c = L2[i].corners[j];
    const idx = i * 4 + j;
    L1.push({
      level: 1, index: idx,
      parentIndex: i, parentCornerIndex: j,
      center: new THREE.Vector3(c.x, c.y, Z1),
      side: SQ1,
      corners: squareCorners(c.x, c.y, Z1, SQ1),
    });
  }
}

const ALL_SQUARES = {};
for (const s of [L3, ...L2, ...L1]) ALL_SQUARES[`${s.level}-${s.index}`] = s;

/* =====================================================================
   3. SCENE
   ===================================================================== */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 8000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.08;
controls.rotateSpeed     = 0.85;
controls.zoomSpeed       = 0.9;
controls.enablePan       = false;   // rotation always orbits the centroid
controls.minDistance     = 4;
controls.maxDistance     = 4000;

/* =====================================================================
   4. VISUAL HELPERS
   ===================================================================== */
const glowTex = (() => {
  const s = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1.0)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function makeSquareObject(sq) {
  const color = LEVEL_COLORS[sq.level];
  const group = new THREE.Group();
  scene.add(group);

  // Outline
  const pts = [...sq.corners, sq.corners[0]];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 1 });
  const line = new THREE.Line(geo, mat);
  group.add(line);

  // Corner dots
  const dots = [];
  const dotScale = sq.level === 3 ? 11 : sq.level === 2 ? 6.5 : 4;
  for (const c of sq.corners) {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color,
      blending: THREE.AdditiveBlending,
      transparent: true, depthWrite: false, opacity: 1,
    }));
    sprite.position.copy(c);
    sprite.scale.setScalar(dotScale);
    group.add(sprite);
    dots.push(sprite);
  }

  return {
    key: `${sq.level}-${sq.index}`,
    level: sq.level,
    index: sq.index,
    group, line, dots,
    opacity: 0,   // animated; starts invisible
  };
}

const squareObjects = {};
for (const sq of [L3, ...L2, ...L1]) {
  squareObjects[`${sq.level}-${sq.index}`] = makeSquareObject(sq);
}

/* =====================================================================
   5. CONNECTORS — dashed verticals linking parent corners to child centres
   ===================================================================== */
const connectors = [];

function makeDashedConnector(a, b, color, opacity) {
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const mat = new THREE.LineDashedMaterial({
    color, transparent: true, opacity,
    dashSize: 6, gapSize: 6,
  });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  return line;
}

// L3 corner -> L2 centre
for (let i = 0; i < L2.length; i++) {
  const line = makeDashedConnector(L3.corners[i], L2[i].center, LEVEL_COLORS[3], 0);
  scene.add(line);
  connectors.push({
    line,
    ownerA: { level: 3, index: 0 },
    ownerB: { level: 2, index: i },
    baseOpacity: 0.55,
  });
}

// L2 corner -> L1 centre
for (let i = 0; i < L2.length; i++) {
  for (let j = 0; j < 4; j++) {
    const l1idx = i * 4 + j;
    const line = makeDashedConnector(L2[i].corners[j], L1[l1idx].center, LEVEL_COLORS[2], 0);
    scene.add(line);
    connectors.push({
      line,
      ownerA: { level: 2, index: i },
      ownerB: { level: 1, index: l1idx },
      baseOpacity: 0.45,
    });
  }
}

/* =====================================================================
   6. STATE
   ===================================================================== */
let current = { level: 3, index: 0 };

// 'steady'    — only the current square is visible
// 'navigating'— everything is visible during the flight
// 'overview'  — everything stays visible
let fadeState = 'steady';

let flight = null;

/* =====================================================================
   7. STATE-0 OFFSET
   ===================================================================== */
function state0Offset(sq) {
  return STATE0_DIR.clone().multiplyScalar(sq.side * STATE0_DIST_FACTOR);
}

/* =====================================================================
   8. CAMERA FLIGHT
   ---------------------------------------------------------------------
   The camera travels along an arc:
     • the target lerps linearly from the old centroid to the new one
     • the offset from the target interpolates in spherical coordinates
       from its current state to the state-0 offset for the new square
     • a mid-flight arc boost pushes the camera outward, so it "lifts"
       like a drone rather than sliding through the structure
   ===================================================================== */
function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function startFlight(endTarget, endOffset, duration, onArrive) {
  const startTarget = controls.target.clone();
  const startOffset = camera.position.clone().sub(startTarget);

  const s0 = new THREE.Spherical().setFromVector3(startOffset);
  const s1 = new THREE.Spherical().setFromVector3(endOffset);

  // Take the shortest angular route around the vertical axis.
  let dTheta = s1.theta - s0.theta;
  while (dTheta >  Math.PI) dTheta -= 2 * Math.PI;
  while (dTheta < -Math.PI) dTheta += 2 * Math.PI;

  flight = {
    startTarget, endTarget,
    s0: { r: s0.radius, phi: s0.phi, theta: s0.theta },
    s1: { r: s1.radius, phi: s1.phi, theta: s0.theta + dTheta },
    startTime: performance.now(),
    duration: duration * 1000,
    onArrive,
  };

  controls.enabled = false;
}

function updateFlight(now) {
  if (!flight) return;

  const t = Math.min(1, (now - flight.startTime) / flight.duration);
  const e = easeInOutCubic(t);

  // Target slides linearly between the two centroids.
  const targetNow = flight.startTarget.clone().lerp(flight.endTarget, e);

  // Offset interpolates in spherical coordinates.
  const r     = flight.s0.r     + (flight.s1.r     - flight.s0.r)     * e;
  const phi   = flight.s0.phi   + (flight.s1.phi   - flight.s0.phi)   * e;
  const theta = flight.s0.theta + (flight.s1.theta - flight.s0.theta) * e;

  // Arc boost — lift the camera outward mid-flight.
  const arcBoost = 1 + 0.45 * Math.sin(Math.PI * t);

  const off = new THREE.Vector3().setFromSphericalCoords(r * arcBoost, phi, theta);
  camera.position.copy(targetNow).add(off);
  controls.target.copy(targetNow);
  camera.lookAt(targetNow);

  if (t >= 1) {
    const cb = flight.onArrive;
    flight = null;
    controls.enabled = true;
    controls.update();
    if (cb) cb();
  }
}

/* =====================================================================
   9. NAVIGATION ACTIONS
   ===================================================================== */
function goToSquare(level, index) {
  if (flight) return;

  const sq = ALL_SQUARES[`${level}-${index}`];
  if (!sq) return;

  current = { level, index };
  fadeState = 'navigating';   // reveal the whole diagram for the journey
  updateUI();

  startFlight(
    sq.center.clone(),
    state0Offset(sq),
    FLIGHT_DURATION,
    () => {
      // On arrival, we are in state 0 for the new square. Fold back down.
      fadeState = 'steady';
    }
  );
}

function goToOverview() {
  if (flight) return;

  fadeState = 'overview';
  updateUI();

  const overviewTarget = new THREE.Vector3(0, 0, 200);
  const overviewPos    = new THREE.Vector3(500, 420, 1180);

  startFlight(
    overviewTarget,
    overviewPos.clone().sub(overviewTarget),
    1.8,
    () => { /* stay in overview */ }
  );
}

/* =====================================================================
   10. OPACITY ANIMATION
   ===================================================================== */
function targetOpacityFor(sq) {
  if (fadeState === 'overview' || fadeState === 'navigating') return 1;
  // steady: only the current square is visible
  return (sq.level === current.level && sq.index === current.index) ? 1 : 0;
}

function updateOpacities(dt) {
  const k = 1 - Math.exp(-FADE_RATE * dt);

  for (const key of Object.keys(squareObjects)) {
    const obj = squareObjects[key];
    const target = targetOpacityFor(obj);
    obj.opacity += (target - obj.opacity) * k;
    if (Math.abs(obj.opacity - target) < 0.004) obj.opacity = target;

    obj.line.material.opacity = obj.opacity;
    for (const d of obj.dots) d.material.opacity = obj.opacity;
  }

  for (const c of connectors) {
    const a = squareObjects[`${c.ownerA.level}-${c.ownerA.index}`].opacity;
    const b = squareObjects[`${c.ownerB.level}-${c.ownerB.index}`].opacity;
    c.line.material.opacity = Math.max(a, b) * c.baseOpacity;
  }
}

/* =====================================================================
   11. UI
   ===================================================================== */
function buildUI() {
  const rowL3 = document.getElementById('row-L3');
  rowL3.innerHTML = '';
  const b3 = document.createElement('button');
  b3.textContent = 'D1';
  b3.dataset.key = '3-0';
  b3.addEventListener('click', () => goToSquare(3, 0));
  rowL3.appendChild(b3);

  const rowL2 = document.getElementById('row-L2');
  rowL2.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('button');
    b.textContent = `D${i + 1}`;
    b.dataset.key = `2-${i}`;
    b.addEventListener('click', () => goToSquare(2, i));
    rowL2.appendChild(b);
  }

  const l1rows = document.getElementById('l1-rows');
  l1rows.innerHTML = '';
  for (let g = 0; g < 4; g++) {
    const row = document.createElement('div');
    row.className = 'btn-row';

    const indent = document.createElement('span');
    indent.className = 'indent';
    indent.textContent = `L2·${g + 1}`;
    row.appendChild(indent);

    for (let j = 0; j < 4; j++) {
      const idx = g * 4 + j;
      const b = document.createElement('button');
      b.textContent = `D${idx + 1}`;
      b.dataset.key = `1-${idx}`;
      b.addEventListener('click', () => goToSquare(1, idx));
      row.appendChild(b);
    }
    l1rows.appendChild(row);
  }
}

function updateUI() {
  const card = document.getElementById('current');
  if (fadeState === 'overview') {
    card.innerHTML = `Overview<span class="sub">all squares visible</span>`;
  } else {
    const name = LEVEL_NAMES[current.level];
    card.innerHTML = `L${current.level} · D${current.index + 1}`
      + `<span class="sub">${name} level</span>`;
  }

  document.querySelectorAll('#ui button[data-key]').forEach(b => {
    const active = (fadeState !== 'overview')
                && b.dataset.key === `${current.level}-${current.index}`;
    b.classList.toggle('active', active);
    b.disabled = !!flight;
  });

  document.getElementById('overview').disabled = !!flight;
}

document.getElementById('overview').addEventListener('click', goToOverview);

/* =====================================================================
   12. RESIZE + RENDER LOOP
   ===================================================================== */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

let lastTime = performance.now();
let uiDirty = true;   // refresh button disabled state when flights start/end

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  updateFlight(now);
  updateOpacities(dt);

  if (!flight) controls.update();

  // Cheap re-enable/disable of buttons on flight start/end
  const flightActive = !!flight;
  if (flightActive !== uiDirty) {
    uiDirty = flightActive;
    updateUI();
  }

  renderer.render(scene, camera);
}

/* =====================================================================
   13. BOOT
   ===================================================================== */
buildUI();

// Snap camera to state 0 for L3 D1 at load.
{
  const sq = ALL_SQUARES['3-0'];
  controls.target.copy(sq.center);
  camera.position.copy(sq.center).add(state0Offset(sq));
  camera.lookAt(sq.center);
}

updateUI();
animate();
</script>
</body>
</html>
